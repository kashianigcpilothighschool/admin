<!DOCTYPE html> 
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ভার্সন: V13 -->
    <title>পরীক্ষা কক্ষের তথ্য</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ===== সিট প্লান ===== */
        /* ===== সোলেমানলিপি ফন্ট: পিসিতে ইনস্টল থাকলে সেটি, নইলে ফাইলের পাশের SolaimanLipi.ttf ===== */
        @font-face {
            font-family: 'SolaimanLipi';
            src: local('SolaimanLipi'), local('Solaiman Lipi'), local('SolaimanLipi Regular'),
                 url('SolaimanLipi.ttf') format('truetype'),
                 url('fonts/SolaimanLipi.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        button, input, select, textarea, option { font-family: inherit; }

        :root {
            --navy: #1D2B4F;
            --navy-dark: #101A33;
            --navy-soft: #33456F;
            --navy-tint: #EEF1F8;
            --gold: #B9822E;
            --gold-bright: #D6A24E;
            --gold-soft: #F1E2C3;
            --paper: #FAF9F5;
            --surface: #FFFFFF;
            --border: #E4E0D4;
            --border-soft: #EDEAE0;
            --ink: #1E2330;
            --ink-soft: #6B7280;
            --ink-faint: #9CA3AF;
            --success: #23895B;
            --success-bg: #E7F6EE;
            --error: #C0392B;
            --error-bg: #FCEDEB;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.05);
            --shadow-md: 0 6px 20px rgba(16, 24, 40, 0.08);
            --shadow-navy: 0 10px 30px rgba(16, 26, 51, 0.35);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'SolaimanLipi', 'Hind Siliguri', 'Kalpurush', sans-serif;
            margin: 0;
            padding: 32px 16px 60px;
            background: radial-gradient(circle at top, #FDFCF9 0%, var(--paper) 55%);
            color: var(--ink);
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: var(--surface);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-md), 0 1px 0 rgba(16, 24, 40, 0.02);
            border: 1px solid var(--border-soft);
        }

        /* ===== হেডার ব্যানার ===== */
        .header {
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
            padding: 16px 44px 14px;
            position: relative;
        }
        .header::after {
            content: "";
            position: absolute;
            left: 0; right: 0; bottom: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--gold), var(--gold-bright) 40%, transparent);
        }
        .header h1 {
            font-family: 'SolaimanLipi', 'Hind Siliguri', serif;
            color: #fff;
            margin: 0 0 4px;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 0.2px;
        }
        .header p {
            margin: 0;
            color: var(--gold-soft);
            font-size: 14px;
        }
        .exam-head { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .exam-head select {
            font-family: 'SolaimanLipi', 'Hind Siliguri', serif;
            font-size: 18px;
            font-weight: 600;
            color: var(--navy-dark);
            background: #fff;
            border: 1.5px solid var(--gold);
            border-radius: var(--radius-sm);
            padding: 8px 14px;
            cursor: pointer;
        }
        .exam-head select:focus { outline: none; box-shadow: 0 0 0 4px rgba(214, 162, 78, 0.35); }
        #examName { flex: 1; min-width: 220px; }
        #examYear { width: 130px; }
        .exam-time { display: flex; align-items: center; gap: 8px; }
        .exam-time label { color: var(--gold-soft); font-size: 15px; font-weight: 600; white-space: nowrap; }
        #examTime { width: 170px; }
        @media (max-width: 768px) { #examYear, #examTime { width: 100%; } .exam-time { width: 100%; } }

        .body-pad { padding: 22px 44px 8px; }

        /* ===== সেকশন হেডিং ===== */
        .section-heading {
            display: flex;
            align-items: center;
            gap: 13px;
            margin: 20px 0 12px;
        }
        .section-heading:first-child { margin-top: 0; }
        .section-num {
            flex: none;
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: var(--navy);
            color: #fff;
            font-family: 'SolaimanLipi', 'Hind Siliguri', serif;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
        }
        .section-heading h3 {
            margin: 0;
            font-family: 'SolaimanLipi', 'Hind Siliguri', serif;
            font-size: 18px;
            font-weight: 600;
            color: var(--navy);
        }

        .room-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .info-card {
            background-color: var(--paper);
            padding: 20px 22px;
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-md);
            transition: box-shadow .18s ease, border-color .18s ease;
        }
        .info-card:hover {
            box-shadow: var(--shadow-sm);
            border-color: var(--border);
        }
        .info-card h3 {
            display: none;
        }
        .info-item {
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .info-item:last-child { margin-bottom: 0; }
        .info-label {
            font-weight: 500;
            color: var(--ink-soft);
            font-size: 13.5px;
            white-space: nowrap;
        }
        .info-value {
            color: var(--navy);
            font-weight: 700;
            background: var(--navy-tint);
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 13.5px;
        }

        .building-floor-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 12px;
        }
        .building-floor-item { display: flex; flex-direction: column; }
        .building-floor-item label {
            font-weight: 500;
            color: var(--ink-soft);
            font-size: 12.5px;
            margin-bottom: 7px;
        }

        /* ===== ইনপুট সাধারণ স্টাইল ===== */
        input[type="text"], input[type="number"], select {
            font-family: inherit;
            padding: 10px 13px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            background-color: #fff;
            color: var(--ink);
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        input[type="text"]:hover, input[type="number"]:hover, select:hover {
            border-color: var(--navy-soft);
        }
        input[type="text"]:focus, input[type="number"]:focus, select:focus {
            outline: none;
            border-color: var(--navy);
            box-shadow: 0 0 0 4px rgba(29, 43, 79, 0.1);
        }
        #roomNumber, #genderSelect, #departmentSelect, #benchCount,
        #buildingSelect, #floorSelect, #directionSelect {
            color: var(--navy) !important;
            font-weight: 600;
            border: 1.5px solid var(--border) !important;
            background-color: #fff !important;
        }

        #directionNote {
            padding: 12px 15px !important;
            background-color: var(--gold-soft) !important;
            border-radius: var(--radius-sm);
            font-size: 12.5px;
            color: var(--navy-dark) !important;
            display: none;
            border: 1px solid var(--gold) !important;
            line-height: 1.55;
        }
        #directionNote.show { display: block !important; }

        /* ===== বিদ্যালয়ের ফর্ম সেকশন ===== */
        .form-section {
            background-color: var(--paper);
            padding: 24px;
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-md);
        }
        .form-section h3 { display: none; }

        .form-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr 40px;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
            padding: 13px;
            background-color: #fff;
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-sm);
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        .form-row:hover {
            border-color: var(--border);
            box-shadow: var(--shadow-sm);
        }
        .form-row select, .form-row input { width: 100%; }

        input.student-count { font-family: inherit; font-size: inherit; }
        input.student-count::placeholder { color: #6fa88a; font-weight: 500; }
        input.end-roll.auto { background: linear-gradient(180deg,#fbf3e0,#f3e4bf); font-weight: 700; color: #5a3c0c; }
        .student-count {
            background-color: var(--success-bg);
            color: var(--success);
            text-align: center;
            border-radius: var(--radius-sm);
            font-weight: 700;
            padding: 10px 5px;
            border: 1px solid #cdeadb;
        }

        .add-btn {
            background-color: #fff;
            color: var(--navy);
            border: 1.5px dashed var(--navy-soft);
            padding: 11px 18px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 600;
            font-family: inherit;
            font-size: 14px;
            margin: 14px 0 0;
            width: 100%;
            transition: background-color .15s ease, border-color .15s ease, transform .1s ease;
        }
        .add-btn:hover { background-color: var(--navy-tint); border-color: var(--navy); }
        .add-btn:active { transform: scale(0.99); }

        .remove-btn {
            background-color: transparent;
            color: var(--error);
            border: 1.5px solid #f0d2cc;
            padding: 7px 8px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            width: 100%;
            transition: background-color .15s ease;
        }
        .remove-btn:hover { background-color: var(--error-bg); border-color: var(--error); }

        .total-students {
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
            color: #fff;
            padding: 17px;
            border-radius: var(--radius-md);
            text-align: center;
            margin: 24px 44px 0;
            font-weight: 600;
            font-size: 16px;
            letter-spacing: .2px;
            box-shadow: var(--shadow-sm);
        }

        /* ===== সিট প্লান সেকশন ===== */
        .seat-plan-section {
            background: var(--navy-dark);
            padding: 38px 44px;
            margin-top: 36px;
            color: #fff;
        }
        .seat-plan-header { margin-bottom: 22px; }
        .seat-plan-header h2 {
            margin: 0 0 6px;
            font-family: 'SolaimanLipi', 'Hind Siliguri', serif;
            font-size: 22px;
            font-weight: 600;
            color: #fff;
        }
        .seat-plan-header p {
            margin: 0;
            color: var(--gold-soft);
            font-size: 14px;
        }

        #columnInputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .column-input {
            background: rgba(255, 255, 255, 0.045);
            padding: 20px 22px;
            border-radius: var(--radius-md);
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: border-color .18s ease, background .18s ease;
        }
        .column-input:hover {
            border-color: rgba(214, 162, 78, 0.4);
            background: rgba(255, 255, 255, 0.06);
        }
        .column-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .column-label {
            font-weight: 600;
            color: #fff;
            font-size: 15px;
        }
        .add-range-btn {
            background: transparent;
            color: var(--gold-soft);
            border: 1px solid var(--gold);
            padding: 8px 13px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            font-family: inherit;
            transition: background .15s ease, transform .1s ease;
        }
        .add-range-btn:hover { background: rgba(214, 162, 78, 0.18); }
        .add-range-btn:active { transform: scale(0.97); }

        .range-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.045);
            border-radius: var(--radius-sm);
            border: 1px solid rgba(255, 255, 255, 0.1);
            flex-wrap: wrap;
        }
        .range-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            min-width: 58px;
        }
        .input-group { display: flex; gap: 10px; align-items: center; flex: 1; flex-wrap: wrap; }
        .input-wrapper { display: flex; flex-direction: column; align-items: center; }
        .input-label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 5px;
            font-weight: 500;
        }
        .column-input input {
            width: 84px;
            padding: 8px 9px;
            border: 1.5px solid rgba(255, 255, 255, 0.16) !important;
            border-radius: var(--radius-sm);
            font-size: 13px;
            text-align: center;
            background: #fff !important;
            color: var(--ink) !important;
        }
        .remove-range-btn {
            background: transparent;
            color: #f0a89e;
            border: 1px solid rgba(240, 168, 158, 0.4);
            padding: 7px 10px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            min-width: 30px;
            transition: background .15s ease;
        }
        .remove-range-btn:hover { background: rgba(192, 57, 43, 0.2); }

        /* ===== ✨ রেঞ্জ সারি: শ্রেণি | শুরুর রোল | সিট সংখ্যা | শেষ রোল — এক লাইনে, গর্জিয়াস লুক ===== */
        .column-input {
            position: relative;
            border-radius: 18px;
            background: linear-gradient(160deg, rgba(255,255,255,.075), rgba(255,255,255,.03));
            box-shadow: 0 14px 34px -18px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08);
            transition: border-color .2s ease, background .2s ease, transform .2s ease, box-shadow .2s ease;
        }
        .column-input::before {
            content: ""; position: absolute; left: 22px; right: 22px; top: 0; height: 2px; border-radius: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), var(--gold-soft), var(--gold), transparent);
            opacity: .75;
        }
        .column-input:hover { transform: translateY(-2px); box-shadow: 0 22px 44px -18px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.1); }
        .column-label { display: inline-flex; align-items: center; gap: 9px; font-size: 16px; letter-spacing: .2px; }
        .column-label::before {
            content: ""; width: 9px; height: 9px; border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #fff3cf, var(--gold));
            box-shadow: 0 0 0 3px rgba(214,162,78,.22), 0 0 12px rgba(214,162,78,.55);
        }
        .add-range-btn {
            border-radius: 999px; padding: 7px 15px;
            background: linear-gradient(180deg, rgba(214,162,78,.18), rgba(214,162,78,.06));
            box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
        }
        .add-range-btn:hover { background: linear-gradient(180deg, rgba(214,162,78,.34), rgba(214,162,78,.14)); transform: translateY(-1px); }

        .range-item {
            display: grid;
            grid-template-columns: 1fr 34px;
            grid-template-areas: "label btn" "group group";
            align-items: center;
            gap: 10px 8px;
            padding: 12px 14px 14px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,.1);
            border-left: 3px solid var(--gold);
            background: linear-gradient(135deg, rgba(255,255,255,.07), rgba(255,255,255,.025));
            transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
        }
        .range-item:hover, .range-item:focus-within {
            border-color: rgba(214,162,78,.5);
            background: linear-gradient(135deg, rgba(255,255,255,.09), rgba(255,255,255,.04));
            box-shadow: 0 8px 22px -12px rgba(0,0,0,.6), 0 0 0 1px rgba(214,162,78,.12);
        }
        .range-label {
            grid-area: label; justify-self: start; min-width: 0;
            padding: 3px 12px; border-radius: 999px;
            font-size: 12px; font-weight: 700; letter-spacing: .2px;
            color: #4a3208;
            background: linear-gradient(180deg, #f6e2b0, var(--gold-soft, #e3bc6a));
            box-shadow: 0 2px 6px rgba(0,0,0,.25);
        }
        .input-group {
            grid-area: group;
            display: grid; width: 100%;
            grid-template-columns: minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);
            gap: 8px; align-items: end;
        }
        .input-wrapper { display: flex; flex-direction: column; align-items: stretch; min-width: 0; }
        .input-wrapper:has(.stu-class) { order: -1; }          /* শ্রেণি সবার আগে */
        .stu-note { order: 10; grid-column: 1 / -1; }
        .input-label {
            text-align: center; margin-bottom: 5px; font-size: 11.5px; font-weight: 600;
            color: var(--gold-soft); letter-spacing: .2px; white-space: nowrap;
        }
        .column-input input, .column-input select.stu-class {
            width: 100% !important; max-width: none !important; min-width: 0; height: 38px; padding: 0 8px !important;
            border-radius: 10px !important; font-size: 14px !important; font-family: inherit;
            box-shadow: 0 1px 2px rgba(0,0,0,.18) inset;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        .column-input select.stu-class { cursor: pointer; text-overflow: ellipsis; }
        .column-input input:focus, .column-input select.stu-class:focus {
            outline: none; border-color: var(--gold) !important;
            box-shadow: 0 0 0 3px rgba(214,162,78,.3);
        }
        .column-input input[id^="end_roll_"] {                  /* শেষ রোল (শুধু পড়া যায়) */
            background: linear-gradient(180deg, #fbf3e0, #f3e4bf) !important;
            font-weight: 700; color: #5a3c0c !important; cursor: default;
        }
        .column-input input[id^="start_roll_"]::placeholder { color: #9aa3b4; }
        .remove-range-btn {
            grid-area: btn; width: 34px; height: 34px; min-width: 0; padding: 0; border-radius: 50%;
            display: grid; place-items: center; font-size: 18px; line-height: 1;
            transition: background .15s ease, transform .15s ease;
        }
        .remove-range-btn:hover { transform: rotate(90deg); }
        @media (max-width: 520px) {
            .input-group { grid-template-columns: 1fr 1fr; }
            .input-wrapper:has(.stu-class) { grid-column: 1 / -1; }
        }

        .submit-section {
            text-align: center;
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .primary-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .submit-btn {
            background: linear-gradient(135deg, var(--gold-bright), var(--gold));
            color: var(--navy-dark);
            border: none;
            padding: 15px 38px;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            min-width: 220px;
            transition: filter .15s ease, transform .1s ease, box-shadow .15s ease;
            box-shadow: 0 8px 20px rgba(185, 130, 46, 0.28);
        }
        .submit-btn:hover:not(:disabled) { filter: brightness(1.06); box-shadow: 0 10px 24px rgba(185, 130, 46, 0.36); }
        .submit-btn:active:not(:disabled) { transform: translateY(1px); }
        .submit-btn:disabled {
            background: #5b6472;
            color: #cfd3da;
            cursor: not-allowed;
            box-shadow: none;
        }

        .test-btn {
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.22);
            padding: 15px 26px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background .15s ease, border-color .15s ease;
        }
        .test-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.4); }

        .print-btn {
            background: transparent;
            color: var(--gold-soft);
            border: 1px solid var(--gold);
            padding: 15px 26px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background .15s ease;
        }
        .print-btn:hover { background: rgba(184, 134, 43, 0.15); }

        .toolbar-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 26px 0 16px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
        }
        .toolbar-divider::before, .toolbar-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.12);
        }

        .toolbar {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .toolbar .test-btn {
            padding: 11px 20px;
            font-size: 13px;
            font-weight: 500;
        }

        @media print {
            body * { visibility: hidden; }

            .building-floor-row { grid-template-columns: 1fr; gap: 10px; }

            .submit-btn { min-width: 100%; }
            .test-btn, .print-btn { width: 100%; }
            #columnInputs { grid-template-columns: 1fr; }
        }
    
        /* ===== রেঞ্জ লেবেলের পাশে + ও - বাটন ===== */
        .range-item { grid-template-columns: 1fr; grid-template-areas: "label" "group"; }
        .range-top { grid-area: label; display: flex; align-items: center; gap: 8px; }
        .range-top .range-label { grid-area: auto; }

        .range-plus-btn {

            transition: background .15s ease, transform .15s ease;
        }
        .range-plus-btn:hover { background: rgba(35, 137, 91, 0.25); transform: scale(1.1); }
        /* ===== Morning / Noon কক্ষ কার্ড ===== */
        .shift-cards { display: none !important; }   /* কার্ড পেজে লুকানো — প্রিন্টের সময় ডায়ালগে বেছে নিতে হয় */
        .shift-cards-unused { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 18px; }
        .shift-card { background: var(--paper); border: 1.5px solid var(--border-soft); border-radius: var(--radius-md); padding: 14px 16px; }
        .shift-card.on { border-color: var(--navy); box-shadow: 0 0 0 3px rgba(29, 43, 79, 0.08); }
        .shift-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; color: var(--navy); font-size: 14.5px; }
        .shift-head span { font-size: 12px; color: var(--ink-soft); }
        .room-chip { display: block; width: 100%; text-align: left; margin-bottom: 6px; padding: 8px 12px; background: #fff; border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; font-family: inherit; color: var(--ink); }
        .room-chip small { display: block; font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }
        .room-chip:hover { border-color: var(--navy-soft); }
        .room-chip.me { border-color: var(--navy); background: var(--navy-tint); }
        .shift-empty { font-size: 12.5px; color: var(--ink-soft); padding: 6px 2px; }
        @media (max-width: 700px) { .shift-cards { grid-template-columns: 1fr; } }

        /* ===== প্রিন্টের আগে Morning / Noon বেছে নেওয়ার ডায়ালগ (আধুনিক) ===== */
        .pp-overlay { --pp-bg:#fff; --pp-ink:#16203a; --pp-soft:#6b7488; --pp-line:#e4e8f1; --pp-card:#f7f8fc; --pp-acc:#3b5bdb;
            position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 9999;
            background: rgba(12, 18, 38, .45); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
            opacity: 0; visibility: hidden; transition: opacity .2s ease, visibility .2s; }
        .pp-overlay.open { opacity: 1; visibility: visible; }
        @media (prefers-color-scheme: dark) { .pp-overlay { --pp-bg:#151b2e; --pp-ink:#eef1fb; --pp-soft:#9aa4bd; --pp-line:#2a3350; --pp-card:#1b2340; --pp-acc:#7c93ff; } }
        .pp-box { position: relative; width: 100%; max-width: 560px; background: var(--pp-bg); color: var(--pp-ink); border: 1px solid var(--pp-line);
            border-radius: 24px; padding: 22px; box-shadow: 0 30px 80px rgba(8,12,30,.35);
            transform: translateY(14px) scale(.97); transition: transform .28s cubic-bezier(.2,.9,.3,1.2); }
        .pp-overlay.open .pp-box { transform: none; }
        .pp-head { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
        .pp-ico { flex: none; width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; color: #fff;
            background: linear-gradient(135deg, #4f6bff, #8a5cff); box-shadow: 0 8px 20px rgba(79,107,255,.35); }
        .pp-ico svg { width: 24px; height: 24px; }
        .pp-head h3 { margin: 0; font-size: 18px; font-weight: 700; color: var(--pp-ink); }
        .pp-head p { margin: 3px 0 0; font-size: 13px; color: var(--pp-soft); }
        .pp-x { margin-left: auto; flex: none; width: 34px; height: 34px; border-radius: 50%; border: none; background: var(--pp-card); color: var(--pp-soft); cursor: pointer; display: grid; place-items: center; transition: background .15s, color .15s; }
        .pp-x:hover { background: var(--pp-line); color: var(--pp-ink); }
        .pp-x svg { width: 16px; height: 16px; }
        .pp-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .pp-opt { position: relative; font-family: inherit; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 10px;
            background: var(--pp-card); border: 1.5px solid var(--pp-line); border-radius: 18px; padding: 14px; color: var(--pp-ink);
            transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease, background .18s ease; }
        .pp-opt:hover:not(:disabled) { transform: translateY(-3px); border-color: var(--tone); box-shadow: 0 14px 30px -12px var(--tone); }
        .pp-opt:active:not(:disabled) { transform: translateY(-1px) scale(.985); }
        .pp-opt:disabled { opacity: .5; cursor: not-allowed; }
        .pp-opt.morning { --tone: #f59f00; --grad: linear-gradient(135deg, #ffb84d, #ff7a45); }
        .pp-opt.noon { --tone: #3b82f6; --grad: linear-gradient(135deg, #38bdf8, #4f6bff); }
        .pp-opt.last { border-color: var(--tone); background: color-mix(in srgb, var(--tone) 8%, var(--pp-card)); }
        .pp-top { display: flex; align-items: center; gap: 10px; }
        .pp-sun { flex: none; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: #fff; background: var(--grad); }
        .pp-sun svg { width: 21px; height: 21px; }
        .pp-name { font-size: 15px; font-weight: 700; line-height: 1.2; }
        .pp-name small { display: block; font-size: 12px; font-weight: 500; color: var(--pp-soft); margin-top: 2px; }
        .pp-kbd { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--pp-soft); border: 1px solid var(--pp-line); border-bottom-width: 2px; border-radius: 6px; padding: 1px 7px; background: var(--pp-bg); }
        .pp-stat { display: flex; align-items: baseline; gap: 6px; }
        .pp-stat b { font-size: 28px; line-height: 1; font-weight: 800; letter-spacing: -.5px; }
        .pp-stat span { font-size: 12.5px; color: var(--pp-soft); }
        .pp-bar { height: 6px; border-radius: 999px; background: var(--pp-line); overflow: hidden; }
        .pp-bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--grad); transition: width .6s cubic-bezier(.2,.8,.2,1); }
        .pp-meta { font-size: 12px; color: var(--pp-soft); }
        .pp-chips { display: flex; flex-wrap: wrap; gap: 5px; min-height: 22px; }
        .pp-chip { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--pp-bg); border: 1px solid var(--pp-line); color: var(--pp-ink); }
        .pp-chip.more { color: var(--pp-soft); border-style: dashed; }
        .pp-tags { display: flex; gap: 6px; flex-wrap: wrap; min-height: 20px; }
        .pp-tag { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; color: #fff; background: var(--grad); }
        .pp-tag.soft { color: var(--pp-ink); background: var(--pp-line); }
        .pp-empty { font-size: 13px; color: var(--pp-soft); padding: 6px 0; }
        .pp-foot { display: flex; gap: 10px; margin-top: 14px; }
        .pp-all, .pp-cancel { font-family: inherit; font-size: 13.5px; font-weight: 600; padding: 11px 14px; border-radius: 12px; cursor: pointer; transition: background .15s, border-color .15s, color .15s; }
        .pp-all { flex: 1; border: 1.5px dashed var(--pp-line); background: transparent; color: var(--pp-soft); display: flex; align-items: center; justify-content: center; gap: 8px; }
        .pp-all:hover:not(:disabled) { border-color: var(--pp-acc); color: var(--pp-acc); }
        .pp-all:disabled { opacity: .5; cursor: not-allowed; }
        .pp-cancel { border: none; background: var(--pp-card); color: var(--pp-ink); }

        .pp-opt:focus-visible, .pp-all:focus-visible, .pp-cancel:focus-visible, .pp-x:focus-visible { outline: 3px solid color-mix(in srgb, var(--pp-acc) 55%, transparent); outline-offset: 2px; }
        @media (max-width: 560px) {

            .pp-box { max-width: none; border-radius: 24px 24px 0 0; padding: 18px 16px calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateY(100%); }
            .pp-opts { grid-template-columns: 1fr; }
            .pp-kbd { display: none; }
        }
        @media (prefers-reduced-motion: reduce) { .pp-overlay, .pp-box, .pp-opt, .pp-bar i { transition: none !important; } }

const ANON_KEY = "sb_publishable_Ecayyqfsteeio6zjLzHAZw_F6I3h_F0";
(function () {   // হাব থেকে ?token=... নিয়ে এসেছে — সেশনে রেখে URL পরিষ্কার করা
  try {
    const u = new URL(location.href), t = u.searchParams.get("token");
    if (t) { sessionStorage.setItem("app_token", t); u.searchParams.delete("token"); history.replaceState(null, "", u.pathname + (u.search || "") + u.hash); }
  } catch (e) {}
})();
let TOKEN = ""; try { TOKEN = sessionStorage.getItem("app_token") || ""; } catch (e) {}
async function api(fn, ...args) {
  const h = { "Content-Type": "application/json" };
  if (ANON_KEY) { h.apikey = ANON_KEY; if (/^eyJ/.test(ANON_KEY)) h.Authorization = "Bearer " + ANON_KEY; }
  let r, j;
  try { r = await fetch(API_URL, { method: "POST", headers: h, body: JSON.stringify({ fn, args }) }); j = await r.json(); }
  catch (e) { throw new Error("সার্ভারে পৌঁছানো যায়নি। ইন্টারনেট ও সার্ভার ফাংশন দেখুন।"); }

}

  return { api, token: TOKEN, me };
})();
window.logout = async function () {
  try { await api('logout', TOKEN); } catch (e) {}
  try { sessionStorage.removeItem('app_token'); } catch (e) {}

    <script>
        // ========================
        // "প্রিন্ট করুন" বাটনের জন্য Apps Script Web App URL
        // ========================
       const PRINT_URL = 'seat-print.html';

        // ========================
        // প্রতিটি টুলবার বাটনের জন্য আলাদা URL (এখানে পরিবর্তন করুন)
        // ========================
        const BUTTON_URLS = {
            swsi:   'https://ssc-phi-seven.vercel.app/School_Wise_Students_Information',
            ISWS:   'https://ssc-phi-seven.vercel.app/Information_of_Subject_wise_Students',

            btn4:   'https://example.com/button-4-link',
            btn5:   'https://example.com/button-5-link',
            btn6:   'https://example.com/button-6-link'
        };

        let rangeCounters = {};

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString('bn-BD');
            const debugDiv = document.getElementById('debugInfo');
            const logEntry = `[${timestamp}] ${type.toUpperCase()}: ${message}\n`;
            debugDiv.textContent += logEntry;
            debugDiv.scrollTop = debugDiv.scrollHeight;
            console.log(logEntry);
        }

        document.addEventListener('keydown', function(event) {
            if (event.ctrlKey && event.key === 'Enter') {
                event.preventDefault();
                generateSeatPlan();
            }
            if (event.ctrlKey && event.key === 's') {
                event.preventDefault();
                testDataCollection();
            }
        });

        function quickValidation() {
            const errors = [];

            if (!document.getElementById('roomNumber').value.trim()) {
                errors.push('কক্ষ নম্বর দিন');
            }

            if (!document.getElementById('directionSelect').value) {
                errors.push('বসার দিক নির্বাচন করুন');
            }

            const schoolRows = document.querySelectorAll('#schoolForms .form-row');
            let hasValidSchool = false;

            schoolRows.forEach(row => {
                const school = row.querySelector('.school-select').value;
                const startRoll = row.querySelector('.start-roll').value;
                const endRoll = row.querySelector('.end-roll').value;

                if (school && startRoll && endRoll) {
                    hasValidSchool = true;
                }
            });

            if (!hasValidSchool) {
                errors.push('অন্তত একটি বিদ্যালয়ের সম্পূর্ণ তথ্য দিন');
            }

            const columns = ['C', 'D', 'F', 'G', 'I', 'J'];
            let totalSeats = 0;

            columns.forEach(col => {
                const ranges = document.querySelectorAll(`#ranges_${col} .range-item`);
                ranges.forEach(range => {
                    const seatCount = parseInt(range.querySelector('input[id*="seat_count"]').value) || 0;
                    totalSeats += seatCount;
                });
            });

            if (totalSeats === 0) {
                errors.push('অন্তত একটি কলামে সিট সংখ্যা দিন');
            }

            return errors;
        }

        async function fastGenerateSeatPlan() {
            log('Supabase-এ সিট প্লান সংরক্ষণ শুরু...', 'info');

            const errors = quickValidation();
            if (errors.length > 0) {
                showAlert('ত্রুটি: ' + errors.join(', '), 'error');
                return;
            }

            const loadingDiv = document.getElementById('loadingDiv');
            const submitBtn = document.getElementById('submitBtn');
            loadingDiv.style.display = 'block';
            submitBtn.disabled = true;
            submitBtn.textContent = 'জমা হচ্ছে...';

            try {
                const { api: sbApi, token } = await window.fbReady;
                const allData = collectAllData();
                const r = allData.roomInfo;

                // একই ভবন+তলা+কক্ষ আবার সাবমিট করলে আগের ডেটা update হবে
                const roomId = window.makeRoomId(r.building, r.floor, r.roomNumber);

                await sbApi('seatPlanSave', token, roomId, { ...allData, roomId: roomId });

                // এডিটে কক্ষ নং/ভবন/তলা/শিফট বদলালে পুরোনো রেকর্ড মুছে ফেলা (নইলে ডুপ্লিকেট থেকে যায়)
                if (window.__editingId && window.__editingId !== roomId) {
                    try { await sbApi('seatPlanDelete', token, window.__editingId); }
                    catch (e) { console.warn('পুরোনো রেকর্ড মোছা যায়নি:', e.message); }
                }
                window.__editingId = roomId;

                window.__seatSaved = true;   // সফল হলে অটো রিফ্রেশের জন্য ফ্ল্যাগ
                showAlert('সিট প্লান সফলভাবে সংরক্ষিত হয়েছে!', 'success');
                log('সফল: seatPlans/' + roomId, 'success');
            } catch (error) {
                const msg = error.message;
                showAlert('সংরক্ষণে ত্রুটি: ' + msg, 'error');
                log('সংরক্ষণ ত্রুটি: ' + error.message, 'error');
            } finally {
                loadingDiv.style.display = 'none';
                submitBtn.disabled = false;
                submitBtn.textContent = 'সাবমিট';
            }
        }

        // "প্রিন্ট করুন" বাটন — শুধু এই বাটনেই প্রিন্ট URL খুলবে
        function openPrintPage() {
            if (!PRINT_URL || PRINT_URL.indexOf('এখানে') !== -1) {
                showAlert('প্রিন্ট URL এখনো সেট করা হয়নি!', 'error');
                log('PRINT_URL সেট করা নেই', 'error');
                return;
            }
            log('প্রিন্ট পেজে যাওয়া হচ্ছে: ' + PRINT_URL, 'info');
            window.open(window.withToken(PRINT_URL), '_blank');
        }

        // "এডিট" বাটন — প্রিন্ট পেজে এই কক্ষের এডিট ডায়ালগ খুলবে (সাবমিটের মতো একই কক্ষ-আইডি)
        function openEditPage() {
            const room = document.getElementById('roomNumber').value.trim();
            if (!room) {
                showAlert('আগে কক্ষ নম্বর দিন!', 'error');
                return;
            }
            if (!window.currentShift()) {
                showAlert('আগে পরীক্ষা শুরুর সময় নির্বাচন করুন!', 'error');
                return;
            }
            const roomId = window.makeRoomId(
                document.getElementById('buildingSelect').value,
                document.getElementById('floorSelect').value,
                room
            );
            const url = window.withToken(PRINT_URL + '?room=' + encodeURIComponent(roomId) + '&edit=1');
            log('এডিটের জন্য প্রিন্ট পেজে যাওয়া হচ্ছে: ' + url, 'info');
            window.open(url, '_blank');
        }

        // টুলবারের অন্য বাটনগুলো — এখন আর printPage() কল হয় না, তাই প্রিন্ট ডায়ালগ দেখাবে না
        function redirectToButton(key) {
            const targetUrl = BUTTON_URLS[key];

                showAlert('এই বাটনের জন্য URL এখনো সেট করা হয়নি!', 'error');
                log(`URL সেট করা নেই: ${key}`, 'error');

            log(`${key} পেজে যাওয়া হচ্ছে: ${targetUrl}`, 'info');

        function printPage() {
            log('ব্রাউজার প্রিন্ট ফাংশন চালু...', 'info');

            try {
                const container = document.querySelector('.container');
                container.classList.add('print-content');

                const hiddenElements = document.querySelectorAll('.loading, .alert, .debug-info, #testDataDisplay');
                hiddenElements.forEach(el => el.style.display = 'none');

                window.print();

                setTimeout(() => {
                    container.classList.remove('print-content');
                }, 1000);

                log('প্রিন্ট ডায়ালগ খোলা হয়েছে', 'success');

            } catch (error) {
                log(`প্রিন্টে সমস্যা: ${error.message}`, 'error');
                showAlert('প্রিন্ট করতে সমস্যা হয়েছে: ' + error.message, 'error');
            }
        }

        function handleRollInput(input, type) {
            const value = input.value;
            const row = input.parentElement;

            const numericValue = value.replace(/[^0-9]/g, '');

            if (numericValue.length > 6) {
                input.value = numericValue.substring(0, 6);
                return;
            }

            input.value = numericValue;

            if (numericValue.length === 6) {
                if (type === 'start') {
                    const endRollInput = row.querySelector('.end-roll');
                    if (endRollInput) {
                        setTimeout(() => {
                            endRollInput.focus();
                            endRollInput.select();
                        }, 100);
                    }
                } else if (type === 'end') {
                    const nextRow = row.parentElement.nextElementSibling;
                    if (nextRow && nextRow.classList.contains('form-row')) {
                        const nextSchoolSelect = nextRow.querySelector('.school-select');
                        if (nextSchoolSelect) {
                            setTimeout(() => {
                                nextSchoolSelect.focus();
                            }, 100);
                        }
                    } else {
                        addNewRow();
                        setTimeout(() => {
                            const newRows = document.querySelectorAll('#schoolForms .form-row');
                            const lastRow = newRows[newRows.length - 1];
                            const schoolSelect = lastRow.querySelector('.school-select');
                            if (schoolSelect) {
                                schoolSelect.focus();
                            }
                        }, 200);
                    }
                }

                if (navigator.vibrate) {
                    navigator.vibrate(50);
                }

                log(`${type === 'start' ? 'শুরুর' : 'শেষের'} রোল ৬ ডিজিট পূর্ণ হয়েছে: ${numericValue}`, 'info');
            }

            if (numericValue.length > 0) {
                const rollNumber = parseInt(numericValue);
                if (rollNumber < 100000) {
                    input.style.borderColor = '#c99a2e';
                } else {
                    input.style.borderColor = '#2F7D4F';
                }
            } else {
                input.style.borderColor = '';
            }

            updateStudentCount(row);
        }

        function handleKeyPress(event, input, type) {
            if (event.key === 'Enter') {
                event.preventDefault();
                const value = input.value.replace(/[^0-9]/g, '');
                if (value.length >= 5) {
                    handleRollInput(input, type);
                }
            }

            if (event.key === 'Tab' && input.value.length === 6) {
                log('Tab key pressed with complete 6-digit roll', 'info');
            }

            const allowedKeys = ['Backspace', 'Delete', 'Tab', 'Enter', 'ArrowLeft', 'ArrowRight'];
            if (!allowedKeys.includes(event.key) && (event.key < '0' || event.key > '9')) {
                event.preventDefault();
            }
        }

            if (!roomData.direction || roomData.direction === 'নির্বাচিত নয়') {

            }
            const schoolData = [];
            const formRows = document.querySelectorAll('#schoolForms .form-row');
            formRows.forEach((row, index) => {
                const schoolName = row.querySelector('.school-select').value;
                const startRoll = parseInt(row.querySelector('.start-roll').value);
                const endRoll = parseInt(row.querySelector('.end-roll').value);

                if (schoolName && startRoll && endRoll && startRoll <= endRoll) {
                    const studentCount = endRoll - startRoll + 1;
                    schoolData.push({
                        id: index + 1,
                        name: schoolName,
                        startRoll: startRoll,
                        endRoll: endRoll,
                        studentCount: studentCount
                    });
                    log(`বিদ্যালয় ${index + 1}: ${schoolName} - ${startRoll} থেকে ${endRoll} (${studentCount} জন)`);
                }
            });

            const columns = ['C', 'D', 'F', 'G', 'I', 'J'];
            const columnData = [];

            for (let i = 0; i < columns.length; i++) {
                const col = columns[i];
                const rangeContainer = document.getElementById('ranges_' + col);

                if (!rangeContainer) {
                    log(`কলাম ${col} এর রেঞ্জ কন্টেইনার পাওয়া যায়নি`, 'error');
                    continue;
                }

                const ranges = rangeContainer.children;
                const colRanges = [];

                for (let j = 0; j < ranges.length; j++) {
                    const rangeDiv = ranges[j];
                    const startRollInput = rangeDiv.querySelector('input[id^="start_roll_' + col + '_"]');
                    const seatCountInput = rangeDiv.querySelector('input[id^="seat_count_' + col + '_"]');

                    if (!startRollInput || !seatCountInput) {
                        log(`কলাম ${col} রেঞ্জ ${j + 1} এর ইনপুট পাওয়া যায়নি`, 'error');
                        continue;
                    }

                    const startRoll = parseInt(startRollInput.value);
                    const seatCount = parseInt(seatCountInput.value);
                    // শুরুর রোলে শুধু d / D লিখলে ওই সিটে DOOR বসবে
                    const isDoor = /^d$/i.test(String(startRollInput.value).trim());

                    if (!isNaN(seatCount) && seatCount > 0) {
                        const rangeObj = {
                            startRoll: isNaN(startRoll) ? 0 : startRoll,
                            count: seatCount
                        };
                        if (isDoor) { rangeObj.startRoll = 'DOOR'; rangeObj.door = true; }
                        // শুরুর রোলে শুধু x / X লিখলে ওই সিটগুলোতে xxxxxx বসবে
                        if (/^x$/i.test(String(startRollInput.value).trim())) { rangeObj.startRoll = 'xxxxxx'; rangeObj.xmark = true; rangeObj.text = 'xxxxxx'; }
                        colRanges.push(rangeObj);
                        log(`কলাম ${col} রেঞ্জ ${j + 1}: ${startRoll} থেকে ${seatCount} টি সিট`);
                    }
                }

                columnData.push({ ranges: colRanges });
            }

            const totalStudents = schoolData.reduce((sum, school) => sum + school.studentCount, 0);
            const totalSeats = columnData.reduce((sum, col) =>
                sum + col.ranges.reduce((colSum, range) => colSum + range.count, 0), 0
            );

            const allData = {
                roomInfo: roomData,
                schools: schoolData,
                columnData: columnData,
                totals: {
                    totalStudents: totalStudents,
                    totalSeats: totalSeats
                }
            };

            log(`ডেটা সংগ্রহ সম্পন্ন - মোট ${totalStudents} জন ছাত্র, ${totalSeats} টি সিট`, 'success');
            return allData;
        }

    <script>
    // ===== Students টেবিল থেকে শ্রেণি অনুযায়ী রোল (মূল কোড অপরিবর্তিত; শুধু যোগ করা অংশ) =====
    (function () {
        const COLS = ['C', 'D', 'F', 'G', 'I', 'J'];
        const st = { map: {}, keys: [], loaded: false };
        window.__stu = { st: st, matched: function (k, a, c) { return matched(k, a, c); }, prefixOf: function (k) { return prefixOf(k); },
            rollLabel: function (k, v) { return rollLabel(k, v); }, toSaved: function (k, v) { return toSaved(k, v); }, fromSaved: function (k, x) { return fromSaved(k, x); }, baseOf: function (v) { return baseOf(v); } };
        // ---- রোল: "002", "002 (H)", "002 (ক)" — সাফিক্সসহ রোলও আলাদা রোল হিসেবে গণনা ----
        // ভেতরে সংখ্যা: 2 = "002", 2.001 = প্রথম সাফিক্স রোল, 2.002 = দ্বিতীয় … (সাজানো ক্রম ঠিক থাকে)
        function pad3(n) { return String(n).padStart(3, '0'); }
        function baseOf(v) { return Math.floor(Number(v) + 1e-9); }
        function normRoll(raw) {
            const t = String(raw == null ? '' : raw).trim(), m = t.match(/^(\d+)\s*(.*)$/);
            if (m) return { base: parseInt(m[1], 10), suf: m[2].replace(/\s+/g, ' ').trim() };
            const d = t.replace(/\D/g, ''); return d ? { base: parseInt(d, 10), suf: '' } : null;
        }
        function rollLabel(k, v) { const g = st.map[k]; return (g && g.v2l[v]) || pad3(baseOf(v)); }
        function toSaved(k, v) { const lab = rollLabel(k, v); return /\D/.test(lab) ? lab : baseOf(v); }   // সাধারণ রোল সংখ্যা, সাফিক্স রোল লেখা (যেমন "002 (H)")
        function fromSaved(k, x) {

                        if (rg && sel && sel.value && st.loaded && !isNaN(sr) && sr > 0) { rg.classKey = sel.value; rg.prefix = prefixOf(sel.value); rg.rolls = matched(sel.value, sr, sc).map(v => toSaved(sel.value, v)); }
                    });
                });
            } catch (e) { console.error(e); }
