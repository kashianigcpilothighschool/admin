<script>
(function () {
    const KEY = 'seatplan_exam';
    const nameSel = document.getElementById('examName');
    const yearSel = document.getElementById('examYear');
    const timeSel = document.getElementById('examTime');
    const bn = n => String(n).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);

    // সাল: গত বছর থেকে আগামী ২ বছর
    const cy = new Date().getFullYear();
    for (let y = cy - 1; y <= cy + 2; y++) {
        yearSel.insertAdjacentHTML('beforeend', `<option value="${y}">${bn(y)}</option>`);
    }
    yearSel.value = String(cy);

    // তালিকায় না থাকা সময় (নিজে লেখা) অপশন হিসেবে যোগ করা
    function addTime(t) {
        if (!t || t === '__other__') return;
        if ([...timeSel.options].some(o => o.value === t)) return;
        const o = document.createElement('option');
        o.value = o.textContent = t;
        timeSel.insertBefore(o, timeSel.querySelector('option[value="__other__"]'));
    }

    // আগের নির্বাচন ফিরিয়ে আনা
    try {
        const s = JSON.parse(localStorage.getItem(KEY) || '{}');
        if (s.name) nameSel.value = (s.name === 'অর্ধবার্ষিক পরীক্ষা' ? 'অর্ধ-বার্ষিক পরীক্ষা' : s.name);
        if (s.year) yearSel.value = s.year;
        if (s.time) { addTime(s.time); timeSel.value = s.time; }
    } catch (e) {}

    function saveSel() {
        try { localStorage.setItem(KEY, JSON.stringify({ name: nameSel.value, year: yearSel.value, time: timeSel.value })); } catch (e) {}
        scheduleSync();
    }
    nameSel.addEventListener('change', saveSel);
    yearSel.addEventListener('change', saveSel);
    let lastTime = timeSel.value;
    timeSel.addEventListener('change', function () {
        if (timeSel.value === '__other__') {
            const t = (prompt('পরীক্ষা শুরুর সময় লিখুন (যেমন: সকাল ১০:১৫):') || '').trim();
            if (!t) { timeSel.value = lastTime; return; }
            addTime(t);
            timeSel.value = t;
        }
        lastTime = timeSel.value;
        saveSel();
    });

    // ===== প্রিন্ট পেজের কেন্দ্রের তথ্যে (__center__) পরীক্ষার নাম ও সময় পাঠানো =====
    // সার্ভারে থাকা বর্তমান তথ্য পড়ে শুধু exam ও time বদলানো হয়, বাকি তথ্য (কেন্দ্রের নাম, কোড ইত্যাদি) অক্ষত থাকে
    let syncTimer = null;
    function scheduleSync() {
        clearTimeout(syncTimer);
        syncTimer = setTimeout(() => { syncCenter().catch(e => console.warn('কেন্দ্রের তথ্য সিঙ্ক হয়নি:', e.message)); }, 1000);
    }
    async function syncCenter() {
        const exam = nameSel.value ? nameSel.value + ' ' + bn(yearSel.value) : '';
        const time = timeSel.value && timeSel.value !== '__other__' ? timeSel.value : '';
        if (!exam && !time) return false;
        const { api: sbApi, token } = await window.fbReady;
        const rows = await sbApi('seatPlanList', token);
        const cRow = (Array.isArray(rows) ? rows : []).find(r => r.id === '__center__');
        const cur = (cRow && cRow.data && cRow.data.center) || {};
        const next = { ...cur };
        if (exam) next.exam = exam;
        if (time) next.time = /[0-9০-৯]$/.test(time) ? time + 'টা' : time;   // প্রিন্ট পেজের ধরন: "সকাল ১০:০০টা"
        if (next.exam === cur.exam && next.time === cur.time) return false;
        await sbApi('seatPlanSave', token, '__center__', { center: next });
        return true;
    }

    // সাবমিটের পরও একবার সিঙ্ক
    const _fastGen = fastGenerateSeatPlan;
    fastGenerateSeatPlan = async function () {
        await _fastGen();
        try { await syncCenter(); }
        catch (e) { showAlert('পরীক্ষার নাম প্রিন্ট পেজে পাঠানো যায়নি: ' + e.message, 'error'); }
    };

    // সাবমিটের ডেটায় পরীক্ষার নাম ও সাল যোগ করা
    const _collectExam = collectAllData;
    collectAllData = function () {
        const d = _collectExam();
        d.examName = nameSel.value;
        d.examYear = yearSel.value;
        d.examStartTime = timeSel.value;
        d.examTitle = (nameSel.value ? nameSel.value + ' ' : '') + bn(yearSel.value);
        return d;
    };
})();
</script>
<script>
// ===== পরের রোল: যে রোল একবার ব্যবহার হয়েছে, তার পরের রোল পরবর্তী রুম/রেঞ্জের জন্য দেখাবে =====
(function () {
    const $ = id => document.getElementById(id);
    const bnN = n => String(n).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
    const fmt = (key, roll) => window.__stu.prefixOf(key) + '-' + window.__stu.rollLabel(key, roll);
    let savedRows = [];

    async function loadSaved() {
        try {
            const { api: sbApi, token } = await window.fbReady;
            const rows = await sbApi('seatPlanList', token);
            savedRows = Array.isArray(rows) ? rows : [];
        } catch (e) { console.warn('সংরক্ষিত রুমের রোল পড়া যায়নি:', e.message); }
    }
    function currentRoomId() {
        return window.makeRoomId($('buildingSelect').value, $('floorSelect').value, $('roomNumber').value);
    }
    // অন্য সংরক্ষিত রুমে ব্যবহৃত রোল (এই রুম বাদে)
    function usedSaved(key) {
        const me = currentRoomId(), editing = window.__editingId || '', out = [];
        savedRows.forEach(r => {
            if (!r || r.id === '__center__' || r.id === me || r.id === editing || !r.data) return;
            if (window.shiftOfRow(r) !== window.currentShift()) return;   // শুধু একই শিফটের কক্ষ
            (r.data.columnData || []).forEach(c => (c.ranges || []).forEach(rg => {
                if (rg.classKey === key && Array.isArray(rg.rolls)) rg.rolls.forEach(x => { const v = window.__stu.fromSaved(key, x); if (!isNaN(v)) out.push(v); });
            }));
        });
        return out;
    }
    // এই ফর্মের অন্য রেঞ্জে ব্যবহৃত রোল
    function usedInForm(key, self) {
        const out = [];
        document.querySelectorAll('#columnInputs .range-item').forEach(div => {
            if (div === self) return;
            const sel = div.querySelector('.stu-class');
            if (!sel || sel.value !== key) return;
            const a = parseInt(div.querySelector('input[id^="start_roll_"]').value);
            const c = parseInt(div.querySelector('input[id^="seat_count_"]').value);
            if (isNaN(a) || isNaN(c) || c <= 0) return;
            window.__stu.matched(key, a, c).forEach(x => out.push(x));
        });
        return out;
    }
    // সর্বোচ্চ ব্যবহৃত রোলের পরের রোল (Students-এ যেটি আছে)
    function nextRoll(key, self) {
        const st = window.__stu.st;
        if (!st.loaded || !st.map[key]) return undefined;
        const all = [...st.map[key].rolls].sort((a, b) => a - b);
        const used = usedSaved(key).concat(usedInForm(key, self));
        if (!used.length) return all[0];
        const mx = Math.max.apply(null, used);
        return all.find(r => r > mx) || null;   // null = সব রোল শেষ
    }
    // বিদ্যালয়ের তথ্যের সারির জন্য: আগের সংরক্ষিত কক্ষে ব্যবহৃত সর্বোচ্চ রোলের পরের রোল
    // undefined = Students এখনো লোড হয়নি, null = সব রোল শেষ
    window.__usedSavedRolls = function (key) { return usedSaved(key); };
    window.__nextAfterSaved = function (key) {
        const st = window.__stu.st;
        if (!st.loaded || !st.map[key]) return undefined;
        const all = [...st.map[key].rolls].sort((a, b) => a - b);
        const used = usedSaved(key);
        if (!used.length) return all[0];
        const mx = Math.max.apply(null, used);
        return all.find(r => r > mx) || null;
    };
    function fillStart(div, auto) {
        const sel = div.querySelector('.stu-class'), a = div.querySelector('input[id^="start_roll_"]');
        if (!sel || !a || !sel.value) return;
        const nx = nextRoll(sel.value, div);
        if (!nx) return;
        a.value = window.__stu.baseOf(nx);
        if (auto) a.dataset.autoRoll = '1';
        a.dispatchEvent(new Event('input', { bubbles: true }));
    }
    function hintOf(div) {
        let h = div.querySelector('.next-hint');
        if (!h) {
            h = document.createElement('div'); h.className = 'next-hint';
            h.style.cssText = 'flex-basis:100%;font-size:11.5px;line-height:1.6;color:#F1E2C3';
            const g = div.querySelector('.input-group'); if (g) g.appendChild(h);
        }
        return h;
    }
    function updateHint(div) {
        const sel = div.querySelector('.stu-class'); if (!sel) return;
        const h = hintOf(div), key = sel.value;
        h.textContent = '';
        if (!key) return;
        const nx = nextRoll(key, div);
        if (nx === undefined) return;
        if (nx === null) { h.textContent = '✔ এই শ্রেণির সব রোল আগের রুমগুলোতে ব্যবহার হয়ে গেছে'; return; }
        const a = div.querySelector('input[id^="start_roll_"]');
        if (parseInt(a.value) === window.__stu.baseOf(nx)) { h.textContent = '➡ পরের অব্যবহৃত রোল: ' + fmt(key, nx) + ' (বসানো আছে)'; return; }
        h.appendChild(document.createTextNode('➡ পরের অব্যবহৃত রোল: ' + fmt(key, nx) + ' '));
        const b = document.createElement('button');
        b.type = 'button'; b.textContent = 'শুরুর রোলে বসান';
        b.style.cssText = 'padding:2px 8px;border-radius:6px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;font-size:11px;cursor:pointer';
        b.onclick = () => { fillStart(div, true); updateAll(); };
        h.appendChild(b);
    }
    // ---- দেওয়া রোল আগে কোথায় ব্যবহার হয়েছে তা দেখানো ----
    const escH = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const SHN2 = { morning: 'সকাল', noon: 'দুপুর' };
    function whereUsed(key, rolls, self) {
        const S = window.__stu, me = currentRoomId(), editing = window.__editingId || '';
        const want = new Set(rolls), hits = {};   // groupKey -> { label, same, vals:Set }
        const add = (gk, label, same, v) => { (hits[gk] = hits[gk] || { label: label, same: same, vals: new Set() }).vals.add(v); };
        const cur = window.currentShift();
        savedRows.forEach(r => {
            if (!r || r.id === '__center__' || r.id === me || r.id === editing || !r.data) return;
            const sh = window.shiftOfRow(r), ri = r.data.roomInfo || {};
            const label = bnN(ri.roomNumber || '?') + ' নং কক্ষ (' + SHN2[sh] + ')';
            (r.data.columnData || []).forEach(c => (c.ranges || []).forEach(rg => {
                if (rg.classKey !== key || !Array.isArray(rg.rolls)) return;
                rg.rolls.forEach(x => { const v = S.fromSaved(key, x); if (want.has(v)) add('r|' + r.id, label, sh === cur, v); });
            }));
        });
        // এই ফর্মের অন্য রেঞ্জ
        document.querySelectorAll('#columnInputs .range-item').forEach(d => {
            if (d === self) return;
            const sel = d.querySelector('.stu-class'); if (!sel || sel.value !== key) return;
            const a = parseInt(d.querySelector('input[id^="start_roll_"]').value), c = parseInt(d.querySelector('input[id^="seat_count_"]').value);
            if (isNaN(a) || isNaN(c) || c <= 0) return;
            const col = (d.parentElement.id || '').replace('ranges_', ''), idx = [...d.parentElement.children].indexOf(d) + 1;
            S.matched(key, a, c).forEach(v => { if (want.has(v)) add('f|' + d.id, 'এই ফর্মেই (কলাম ' + col + ', রেঞ্জ ' + bnN(idx) + ')', true, v); });
        });
        const all = [...S.st.map[key].rolls].sort((a, b) => a - b), pos = new Map(all.map((v, i) => [v, i]));
        const lab = v => S.prefixOf(key) + '-' + bnN(S.rollLabel(key, v));
        return Object.keys(hits).map(k => {
            const h = hits[k], vs = [...h.vals].sort((a, b) => a - b), runs = [];
            let a = vs[0], z = vs[0];
            for (let i = 1; i <= vs.length; i++) {
                if (i < vs.length && pos.get(vs[i]) === pos.get(z) + 1) { z = vs[i]; continue; }
                runs.push(a === z ? lab(a) : lab(a) + '–' + lab(z));
                a = z = vs[i];
            }
            return { label: h.label, same: h.same, runs: runs, n: vs.length };
        });
    }
    function updateWhere(div) {
        const sel = div.querySelector('.stu-class'); if (!sel) return;
        let w = div.querySelector('.used-where');
        if (!w) {
            w = document.createElement('div'); w.className = 'used-where';
            w.style.cssText = 'flex-basis:100%;grid-column:1/-1;font-size:11.5px;line-height:1.7';
            const g = div.querySelector('.input-group'); if (g) g.appendChild(w);
        }
        w.innerHTML = '';
        const key = sel.value, S = window.__stu;
        const a = parseInt(div.querySelector('input[id^="start_roll_"]').value), c = parseInt(div.querySelector('input[id^="seat_count_"]').value);
        if (!key || !S.st.loaded || isNaN(a) || isNaN(c) || c <= 0) return;
        const list = whereUsed(key, S.matched(key, a, c), div);
        if (!list.length) return;
        w.innerHTML = list.map(h => '<div style="color:' + (h.same ? '#f0a89e' : '#F1E2C3') + '">' + (h.same ? '⛔' : 'ℹ️') + ' ' + escH(h.runs.join(', ')) +
            ' (' + bnN(h.n) + ' জন) আগেই ব্যবহার হয়েছে: ' + escH(h.label) + (h.same ? '' : ' — অন্য শিফট') + '</div>').join('');
    }
    function updateAll() { document.querySelectorAll('#columnInputs .range-item').forEach(div => { updateHint(div); updateWhere(div); }); }

    const ci = $('columnInputs');
    // শ্রেণি বাছলে শুরুর রোল ফাঁকা থাকলে নিজে বসবে (d/D লেখা থাকলে বসবে না)
    ci.addEventListener('change', e => {
        const t = e.target; if (!t.classList || !t.classList.contains('stu-class')) return;
        const div = t.closest('.range-item'), a = div.querySelector('input[id^="start_roll_"]');
        if (a && !String(a.value).trim()) fillStart(div, true);
        setTimeout(updateAll, 0);
    });
    // হাতে শুরুর রোল লিখলে স্বয়ংক্রিয় চিহ্ন উঠে যাবে
    ci.addEventListener('input', e => {
        const t = e.target;
        if (t.id && t.id.indexOf('start_roll_') === 0 && e.isTrusted) delete t.dataset.autoRoll;
        setTimeout(updateAll, 0);
    });
    // রুম বদলালে (পরের রুম) স্বয়ংক্রিয়ভাবে বসানো রেঞ্জগুলো নতুন "পরের রোল"-এ বদলাবে
    function refillSchoolRows() {
        document.querySelectorAll('#schoolForms .form-row').forEach(row => {
            if (row.dataset.autoRoll !== '1') return;
            const o = row.querySelector('.school-select').selectedOptions[0], k = o && o.dataset.k;
            if (!k) return;
            const nx = window.__nextAfterSaved(k);
            if (nx === undefined) return;
            const a = row.querySelector('.start-roll'), b = row.querySelector('.end-roll');
            if (nx === null) { a.value = ''; b.value = ''; }
            else { a.value = window.__stu.baseOf(nx); b.value = window.__stu.baseOf(Math.max.apply(null, [...window.__stu.st.map[k].rolls])); }
            updateStudentCount(row);
        });
    }
    $('schoolForms').addEventListener('input', e => {
        const t = e.target, row = t.closest && t.closest('.form-row');
        if (row && e.isTrusted && t.classList && (t.classList.contains('start-roll') || t.classList.contains('end-roll') || t.classList.contains('student-count'))) delete row.dataset.autoRoll;
    });
    function onRoomChange() {
        refillSchoolRows();
        document.querySelectorAll('#columnInputs .range-item').forEach(div => {
            const a = div.querySelector('input[id^="start_roll_"]');
            if (a && a.dataset.autoRoll === '1') fillStart(div, true);
        });
        updateAll();
    }
    ['roomNumber', 'buildingSelect', 'floorSelect'].forEach(id => { const el = $(id); if (el) el.addEventListener('change', onRoomChange); });

    // সাবমিটের পর সংরক্ষিত তালিকা নতুন করে পড়ে "পরের রোল" হালনাগাদ
    const _fgen = fastGenerateSeatPlan;
    fastGenerateSeatPlan = async function () {
        await _fgen();
        await loadSaved();
        updateAll();
    };
    // নতুন রেঞ্জ যোগ হলে হিন্ট ঠিক করা
    const _ar = addRange;
    addRange = function (col) { _ar(col); setTimeout(updateAll, 0); };

    window.fbReady.then(loadSaved).then(() => {
        const t = setInterval(() => { if (window.__stu.st.loaded) { clearInterval(t); updateAll(); } }, 400);
        setTimeout(() => clearInterval(t), 20000);
    });
})();
</script>
<script>
// ===== Morning / Noon শিফট: পরীক্ষা শুরুর সময় অনুযায়ী কক্ষ আলাদা =====
(function () {
    const $ = id => document.getElementById(id);
    const bn = s => String(s).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
    const en = s => String(s).replace(/[০-৯]/g, d => '০১২৩৪৫৬৭৮৯'.indexOf(d));
    const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const NAME = { morning: '🌅 Morning (সকাল)', noon: '☀️ Noon (দুপুর)' };

    // সময় লেখা থেকে শিফট: সকাল/ভোর → morning; দুপুর/বিকাল → noon; উপসর্গ না থাকলে ঘণ্টা দেখে
    function shiftOfTime(t) {
        t = String(t || '').trim();
        if (!t || t === '__other__') return '';
        if (/^(সকাল|ভোর)/.test(t)) return 'morning';
        if (/^(দুপুর|বিকাল|বিকেল|অপরাহ্ণ|অপরাহ্ন|বেলা)/.test(t)) return 'noon';
        const m = en(t).match(/(\d{1,2})/);
        if (!m) return '';
        const h = parseInt(m[1], 10);
        return (h >= 12 || h <= 5) ? 'noon' : 'morning';
    }
    window.currentShift = () => shiftOfTime($('examTime') && $('examTime').value);
    // পুরোনো সংরক্ষিত কক্ষে shift না থাকলে সংরক্ষিত সময় থেকে; তাও না থাকলে morning ধরা হয়
    window.shiftOfRow = r => (r && r.data && (r.data.shift || shiftOfTime(r.data.examStartTime))) || 'morning';
    // কক্ষ-আইডি = ভবন_তলা_কক্ষ_শিফট (একই কক্ষ দুই শিফটে আলাদা সংরক্ষিত হবে)
    window.makeRoomId = function (building, floor, room) {
        const base = [building, floor, room].map(s => String(s).trim()).join('_');
        const sh = window.currentShift();
        return (base + (sh ? '_' + sh : '')).replace(/[\/\s]+/g, '-');
    };

    // সাবমিটের ডেটায় শিফট
    const _collect = collectAllData;
    collectAllData = function () { const d = _collect(); d.shift = window.currentShift(); return d; };

    // শিফট না থাকলে সাবমিট হবে না
    const _qv = quickValidation;
    quickValidation = function () {
        const e = _qv();
        if (!window.currentShift()) e.push('পরীক্ষা শুরুর সময় নির্বাচন করুন (সকাল/দুপুর নির্ধারণের জন্য)');
        // একই শিফটে একই রোল একাধিকবার ব্যবহার করা যাবে না (এই ফর্মের ভেতরে + আগে সংরক্ষিত অন্য কক্ষে)
        try {
            const S = window.__stu;
            if (S && S.st.loaded) {
                const seen = {}, dup = [];
                document.querySelectorAll('#columnInputs .range-item').forEach(div => {
                    const sel = div.querySelector('.stu-class'); if (!sel || !sel.value) return;
                    const a = parseInt(div.querySelector('input[id^="start_roll_"]').value);
                    const c = parseInt(div.querySelector('input[id^="seat_count_"]').value);
                    if (isNaN(a) || isNaN(c) || c <= 0) return;
                    const key = sel.value;
                    let other = null;
                    try { other = new Set(window.__usedSavedRolls(key)); } catch (x) {}
                    S.matched(key, a, c).forEach(v => {
                        const id = key + '|' + v;
                        const lab = S.prefixOf(key) + '-' + S.rollLabel(key, v);
                        if (seen[id]) dup.push(lab + ' (এই ফর্মে একাধিকবার)');
                        else if (other && other.has(v)) dup.push(lab + ' (আগের কক্ষে ব্যবহৃত)');
                        seen[id] = 1;
                    });
                });
                if (dup.length) {
                    const bnx = s => String(s).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
                    e.push('একই শিফটে একই রোল দুইবার দেওয়া যাবে না: ' + bnx(dup.slice(0, 6).join(', ')) + (dup.length > 6 ? ' …আরও ' + bnx(dup.length - 6) + 'টি' : ''));
                }
            }
        } catch (x) { console.error(x); }
        return e;
    };

    // ----- কার্ড -----
    let rows = [];
    function countStudents(d) {
        let n = 0;
        (d.columnData || []).forEach(c => (c.ranges || []).forEach(rg => { if (Array.isArray(rg.rolls)) n += rg.rolls.length; }));
        return n;
    }
    function label(d) {
        const r = d.roomInfo || {};
        return (r.roomNumber ? bn(r.roomNumber) + ' নং কক্ষ' : '—');
    }
    function sub(d) {
        const r = d.roomInfo || {};
        return [r.building, r.floor, r.gender, r.department].map(x => String(x || '').trim()).filter(Boolean).join(' • ');
    }
    function render() {
        const box = $('shiftCards'); if (!box) return;
        const cur = window.currentShift(), me = window.makeRoomId($('buildingSelect').value, $('floorSelect').value, $('roomNumber').value);
        const g = { morning: [], noon: [] };
        rows.forEach(r => { if (r && r.id !== '__center__' && r.data) g[window.shiftOfRow(r)].push(r); });
        const num = r => parseInt(en((r.data.roomInfo || {}).roomNumber), 10) || 0;
        box.innerHTML = ['morning', 'noon'].map(k => {
            const list = g[k].sort((a, b) => num(a) - num(b));
            const total = list.reduce((s, r) => s + countStudents(r.data), 0);
            return `<div class="shift-card${cur === k ? ' on' : ''}"><div class="shift-head"><b>${NAME[k]}</b>` +
                `<span>${bn(list.length)} কক্ষ • ${bn(total)} জন</span></div>` +
                (list.length ? list.map(r => `<button type="button" class="room-chip${r.id === me ? ' me' : ''}" data-id="${esc(r.id)}" title="প্রিন্ট পেজে এডিট করুন">` +
                    `<b>${esc(label(r.data))}</b><small>${esc(sub(r.data))}</small></button>`).join('')
                    : '<div class="shift-empty">কোনো কক্ষ সংরক্ষিত নেই</div>') + '</div>';
        }).join('');
    }
    async function reload() {
        try {
            const { api: sbApi, token } = await window.fbReady;
            const list = await sbApi('seatPlanList', token);
            rows = Array.isArray(list) ? list : [];
        } catch (e) { console.warn('কক্ষের কার্ড লোড হয়নি:', e.message); }
        render();
    }
    $('shiftCards').addEventListener('click', e => {
        const b = e.target.closest('.room-chip'); if (!b) return;
        window.open(window.withToken(PRINT_URL + '?room=' + encodeURIComponent(b.dataset.id) + '&edit=1'), '_blank');
    });

    // সময় বদলালে: কার্ড হালনাগাদ + পরের রোল নতুন শিফট অনুযায়ী
    $('examTime').addEventListener('change', () => {
        render();
        const r = $('roomNumber'); if (r) r.dispatchEvent(new Event('change', { bubbles: true }));
    });
    ['roomNumber', 'buildingSelect', 'floorSelect'].forEach(id => { const el = $(id); if (el) el.addEventListener('change', render); });


    // ----- প্রিন্ট: Morning / Noon কার্ড বেছে নিয়ে প্রিন্ট পেজ খোলা -----
    const ICON = {
        morning: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 18a5 5 0 0 0-10 0"/><path d="M12 2v7M4.2 10.2l1.4 1.4M1 18h2M21 18h2M18.4 11.6l1.4-1.4M23 22H1M8 6l4-4 4 4"/></svg>',
        noon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
    };
    const TITLE = { morning: ['Morning', 'সকালের শিফট'], noon: ['Noon', 'দুপুরের শিফট'] };
    const LAST_KEY = 'seatPlan.lastPrintShift';
    const lastShift = () => { try { return localStorage.getItem(LAST_KEY) || ''; } catch (e) { return ''; } };
    const num = r => parseInt(en(((r.data.roomInfo || {}).roomNumber) || ''), 10) || 0;

    function pickStats() {
        const g = { morning: { n: 0, s: 0, rooms: [] }, noon: { n: 0, s: 0, rooms: [] } };
        rows.forEach(r => { if (r && r.id !== '__center__' && r.data) { const k = window.shiftOfRow(r); g[k].n++; g[k].s += countStudents(r.data); g[k].rooms.push(r); } });
        ['morning', 'noon'].forEach(k => g[k].rooms.sort((a, b) => num(a) - num(b)));
        return g;
    }
    function renderPick() {
        const g = pickStats(), cur = window.currentShift(), last = lastShift();
        const grand = (g.morning.s + g.noon.s) || 1;
        $('printPickOpts').innerHTML = ['morning', 'noon'].map((k, i) => {
            const x = g[k], has = x.n > 0, pct = Math.round(x.s / grand * 100);
            const chips = x.rooms.slice(0, 6).map(r => `<span class="pp-chip">${esc(bn((r.data.roomInfo || {}).roomNumber || '—'))}</span>`).join('') +
                (x.n > 6 ? `<span class="pp-chip more">+${bn(x.n - 6)}</span>` : '');
            const tags = (cur === k ? '<span class="pp-tag">এখন নির্বাচিত</span>' : '') + (last === k ? '<span class="pp-tag soft">শেষবার প্রিন্ট</span>' : '');
            return `<button type="button" class="pp-opt ${k}${last === k ? ' last' : ''}" data-shift="${k}"${has ? '' : ' disabled'}>` +
                `<div class="pp-top"><div class="pp-sun">${ICON[k]}</div><div class="pp-name">${TITLE[k][0]}<small>${TITLE[k][1]}</small></div><span class="pp-kbd">${bn(i + 1)}</span></div>` +
                (has
                    ? `<div class="pp-stat"><b>${bn(x.n)}</b><span>কক্ষ • ${bn(x.s)} জন</span></div>` +
                      `<div class="pp-bar" aria-hidden="true"><i data-w="${pct}"></i></div>` +
                      `<div class="pp-chips">${chips}</div>`
                    : '<div class="pp-empty">কোনো কক্ষ সংরক্ষিত নেই</div>') +
                `<div class="pp-tags">${tags}</div></button>`;
        }).join('');
        $('printPickAll').disabled = !(g.morning.n + g.noon.n);
        requestAnimationFrame(() => requestAnimationFrame(() => $('printPickOpts').querySelectorAll('.pp-bar i').forEach(el => { el.style.width = el.dataset.w + '%'; })));
    }
    const pickEl = () => $('printPick');
    const isOpen = () => pickEl().classList.contains('open');
    let opener = null;
    function closePick() {
        pickEl().classList.remove('open'); pickEl().setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
        if (opener && opener.focus) { try { opener.focus(); } catch (e) {} }
    }
    function goPrint(shift) {
        closePick();
        if (shift) { try { localStorage.setItem(LAST_KEY, shift); } catch (e) {} }
        log('প্রিন্ট পেজে যাওয়া হচ্ছে (' + (shift || 'সব') + ')', 'info');
        window.open(window.withToken(PRINT_URL + (shift ? '?shift=' + shift : '')), '_blank');
    }
    window.openPrintPage = async function () {
        if (!PRINT_URL || PRINT_URL.indexOf('এখানে') !== -1) { showAlert('প্রিন্ট URL এখনো সেট করা হয়নি!', 'error'); return; }
        opener = document.activeElement;
        renderPick();
        pickEl().classList.add('open'); pickEl().setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
        const first = $('printPickOpts').querySelector('.pp-opt:not(:disabled)'); if (first) first.focus();
        if (!rows.length) { await reload(); if (isOpen()) renderPick(); }
    };
    $('printPickOpts').addEventListener('click', e => {
        const b = e.target.closest('.pp-opt'); if (!b || b.disabled) return;
        goPrint(b.dataset.shift);
    });
    $('printPickAll').addEventListener('click', () => goPrint(''));
    $('printPickX').addEventListener('click', closePick);
    $('printPickCancel').addEventListener('click', closePick);
    pickEl().addEventListener('click', e => { if (e.target === pickEl()) closePick(); });
    document.addEventListener('keydown', e => {
        if (!isOpen()) return;
        if (e.key === 'Escape') { closePick(); return; }
        if (e.key === '1' || e.key === '১') { const b = $('printPickOpts').querySelector('.pp-opt.morning:not(:disabled)'); if (b) goPrint('morning'); }
        else if (e.key === '2' || e.key === '২') { const b = $('printPickOpts').querySelector('.pp-opt.noon:not(:disabled)'); if (b) goPrint('noon'); }
        else if ((e.key === 'a' || e.key === 'A') && !$('printPickAll').disabled) goPrint('');
        else if (e.key === 'Tab') {   // ফোকাস ডায়ালগের ভেতরেই ঘুরবে
            const f = [...pickEl().querySelectorAll('button:not(:disabled)')]; if (!f.length) return;
            const i = f.indexOf(document.activeElement);
            if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
            else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
        }
    });

    const _fg = fastGenerateSeatPlan;
    fastGenerateSeatPlan = async function () { await _fg(); await reload(); };
    window.fbReady.then(reload);
    render();
})();
</script>
<script>
// ===== এডিট বাটন: কক্ষ নং চাইবে → সংরক্ষিত ডেটা ফর্মের সব ঘরে ফিরিয়ে আনবে =====
(function () {
    const $ = id => document.getElementById(id);
    const COLS = ['C', 'D', 'F', 'G', 'I', 'J'];
    const en = s => String(s == null ? '' : s).replace(/[০-৯]/g, d => '০১২৩৪৫৬৭৮৯'.indexOf(d)).trim();
    const bn = s => String(s).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
    const SHIFT_NAME = { morning: 'সকাল', noon: 'দুপুর' };

    // select-এ মান বসায়; তালিকায় না থাকলে নতুন option যোগ করে
    function setSelect(sel, val, label) {
        if (!sel || val == null || val === '') return;
        val = String(val);
        if (![...sel.options].some(o => o.value === val)) {
            const o = document.createElement('option');
            o.value = val; o.textContent = label || val;
            const other = sel.querySelector('option[value="__other__"]');
            sel.insertBefore(o, other || null);
        }
        sel.value = val;
    }
    function setInput(id, v) { const el = $(id); if (el && v != null) el.value = v; }

    function fill(data) {
        const r = data.roomInfo || {};

        // ১. পরীক্ষার নাম, সাল ও সময়
        if (data.examName) setSelect($('examName'), data.examName);
        if (data.examYear) setSelect($('examYear'), data.examYear, bn(data.examYear));
        if (data.examStartTime) {
            setSelect($('examTime'), data.examStartTime);
            $('examTime').dispatchEvent(new Event('change', { bubbles: true }));
        }

        // ২. কক্ষের তথ্য
        setInput('roomNumber', r.roomNumber);
        setSelect($('genderSelect'), r.gender);
        setSelect($('departmentSelect'), r.department);
        setSelect($('buildingSelect'), r.building);
        setSelect($('floorSelect'), r.floor);
        if (r.benchCount) setInput('benchCount', r.benchCount);
        $('directionSelect').value = (r.direction && r.direction !== 'নির্বাচিত নয়') ? r.direction : '';
        if (typeof updateDirectionInfo === 'function') updateDirectionInfo();

        // ৩. শ্রেণি / শুরুর রোল / শেষ রোল (ওপরের সারিগুলো)
        const wrap = $('schoolForms');
        const schools = Array.isArray(data.schools) ? data.schools : [];
        while (wrap.querySelectorAll('.form-row').length > 1) wrap.querySelector('.form-row:last-child').remove();
        const first = wrap.querySelector('.form-row');
        ['.start-roll', '.end-roll', '.student-count'].forEach(q => { first.querySelector(q).value = ''; });
        first.querySelector('.school-select').value = '';
        delete first.dataset.mode;
        schools.forEach((sc, i) => {
            if (i > 0) addNewRow();
            const row = wrap.querySelectorAll('.form-row')[i];
            const sel = row.querySelector('.school-select');
            setSelect(sel, sc.name);
            const opt = sel.selectedOptions[0];
            if (opt && sc.classKey && !opt.dataset.k) opt.dataset.k = sc.classKey;
            row.querySelector('.start-roll').value = sc.startRoll != null ? sc.startRoll : '';
            row.querySelector('.end-roll').value = sc.endRoll != null ? sc.endRoll : '';
            const c = row.querySelector('.student-count');
            if (c) { c.value = sc.studentCount != null ? sc.studentCount : ''; row.dataset.mode = 'count'; }
        });
        if (typeof updateTotal === 'function') updateTotal();

        // ৪. ৬টি কলামের রেঞ্জ (শ্রেণি, শুরুর রোল, সিট সংখ্যা, শেষ রোল)
        COLS.forEach((col, ci) => {
            const cont = $('ranges_' + col);
            if (!cont) return;
            const ranges = (data.columnData && data.columnData[ci] && data.columnData[ci].ranges) || [];
            cont.innerHTML = '';
            rangeCounters[col] = 1;
            const n = Math.max(ranges.length, 1);
            for (let k = 0; k < n; k++) addRange(col);
            ranges.forEach((rg, k) => {
                const div = cont.children[k];
                if (!div) return;
                const a = div.querySelector('input[id^="start_roll_"]');
                const s = div.querySelector('input[id^="seat_count_"]');
                const sel = div.querySelector('.stu-class');
                if (sel && rg.classKey) {
                    const lbl = (window.__stu && window.__stu.st.map[rg.classKey] && window.__stu.st.map[rg.classKey].label) || ('শ্রেণি ' + rg.classKey);
                    setSelect(sel, rg.classKey, lbl);
                }
                a.value = (rg.door || rg.startRoll === 'DOOR') ? 'D' : (rg.xmark ? 'x' : (rg.startRoll ? rg.startRoll : ''));
                delete a.dataset.autoRoll;
                s.value = rg.count != null ? rg.count : '';
                a.dispatchEvent(new Event('input', { bubbles: true }));
            });
        });
    }

    // কক্ষ নং দিয়ে সংরক্ষিত সারি খোঁজা
    function describe(r) {
        const i = (r.data && r.data.roomInfo) || {};
        const sh = SHIFT_NAME[window.shiftOfRow(r)] || '';
        return [i.building, i.floor, sh].map(x => String(x || '').trim()).filter(Boolean).join(' • ');
    }

    // ---- আধুনিক এডিট ডায়ালগ: শিফট → কক্ষ (ড্রপডাউন) → তথ্যের প্রিভিউ ----
    const SH_ICON = { morning: '🌅', noon: '☀️' };
    const SH_TXT = { morning: 'সকাল', noon: 'দুপুর / বিকাল' };
    const numOf = r => parseInt(en((r.data.roomInfo || {}).roomNumber), 10) || 0;
    const stuOf = r => {
        const t = r.data.totals && r.data.totals.totalStudents;
        if (t != null) return t;
        let n = 0;
        (r.data.columnData || []).forEach(c => (c.ranges || []).forEach(g => { if (Array.isArray(g.rolls)) n += g.rolls.length; }));
        return n;
    };
    const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function injectCss() {
        if ($('editDlgCss')) return;
        const st = document.createElement('style');
        st.id = 'editDlgCss';
        st.textContent = `
        #editDlg{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px;
            background:rgba(16,26,51,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:edFade .18s ease}
        #editDlg .ed-box{width:100%;max-width:420px;background:var(--surface,#fff);color:var(--ink,#1E2330);border-radius:20px;overflow:hidden;
            box-shadow:0 24px 60px rgba(16,26,51,.45);animation:edPop .22s cubic-bezier(.2,.9,.3,1.2);font-family:inherit}
        #editDlg .ed-head{position:relative;padding:20px 22px 18px;color:#fff;background:linear-gradient(135deg,var(--navy-dark,#101A33),var(--navy-soft,#33456F))}
        #editDlg .ed-head h3{margin:0;font-size:19px;font-weight:700;font-family:'SolaimanLipi','Hind Siliguri',serif}
        #editDlg .ed-head p{margin:3px 0 0;font-size:12.5px;color:var(--gold-soft,#F1E2C3);opacity:.9}
        #editDlg .ed-x{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;border:0;cursor:pointer;
            background:rgba(255,255,255,.14);color:#fff;font-size:16px;line-height:1;transition:background .15s}
        #editDlg .ed-x:hover{background:rgba(255,255,255,.28)}
        #editDlg .ed-body{padding:20px 22px 6px}
        #editDlg .ed-lbl{display:block;font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--ink-soft,#6B7280);margin:0 0 7px}
        #editDlg .ed-seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:12px;background:var(--navy-tint,#EEF1F8);margin-bottom:18px}
        #editDlg .ed-seg button{border:0;background:transparent;padding:10px 8px;border-radius:9px;cursor:pointer;font-family:inherit;
            font-size:14.5px;font-weight:600;color:var(--ink-soft,#6B7280);transition:all .18s;display:flex;align-items:center;justify-content:center;gap:6px}
        #editDlg .ed-seg button.on{background:#fff;color:var(--navy,#1D2B4F);box-shadow:0 2px 8px rgba(16,24,40,.12)}
        #editDlg .ed-seg small{font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--navy-tint,#EEF1F8);color:var(--navy-soft,#33456F)}
        #editDlg .ed-seg button.on small{background:var(--gold-soft,#F1E2C3);color:var(--gold,#B9822E)}
        #editDlg .ed-sel{position:relative;margin-bottom:16px}

    window.openEditRoom = async function () {
        if ($('editDlg')) return;
        const btn = $('editPrintBtn');
        if (btn) btn.disabled = true;
        let rows = [];
        try {
            const { api: sbApi, token } = await window.fbReady;
            const list = await sbApi('seatPlanList', token);
            rows = (Array.isArray(list) ? list : []).filter(r => r && r.id !== '__center__' && r.data && r.data.roomInfo);
        } catch (e) {
            showAlert('তথ্য আনতে ত্রুটি: ' + e.message, 'error');
            if (btn) btn.disabled = false;
            return;
        }
        if (btn) btn.disabled = false;
        if (!rows.length) { showAlert('কোনো সংরক্ষিত কক্ষ পাওয়া যায়নি!', 'error'); return; }

        injectCss();
        const count = { morning: 0, noon: 0 };
        rows.forEach(r => { count[window.shiftOfRow(r)]++; });
        let shift = window.currentShift() || (count.morning ? 'morning' : 'noon');

        const ov = document.createElement('div');
        ov.id = 'editDlg';
        ov.setAttribute('role', 'dialog');
        ov.setAttribute('aria-modal', 'true');
        ov.innerHTML =
            '<div class="ed-box">' +
              '<div class="ed-head"><h3>কক্ষের তথ্য এডিট করুন</h3><p>শিফট ও কক্ষ বেছে নিন</p>' +
              '<button type="button" class="ed-x" aria-label="বন্ধ করুন">✕</button></div>' +
              '<div class="ed-body">' +
                '<span class="ed-lbl">শিফট</span>' +
                '<div class="ed-seg">' + ['morning', 'noon'].map(k =>
                    '<button type="button" data-sh="' + k + '">' + SH_ICON[k] + ' ' + SH_TXT[k] + ' <small>' + bn(count[k]) + '</small></button>').join('') + '</div>' +
                '<label class="ed-lbl" for="editRoomSel">কক্ষ নং</label>' +
                '<div class="ed-sel"><select id="editRoomSel"></select></div>' +
                '<div class="ed-prev" id="editPrev"></div>' +

        function showPrev() {
            const r = current.find(x => x.id === roomSel.value);

            go.disabled = false; del.disabled = false;
            const i = r.data.roomInfo;
            const chips = [i.building, i.floor, i.gender, i.department, i.direction && i.direction !== 'নির্বাচিত নয়' ? i.direction : '']

                '<div class="ed-chips">' + chips + '</div>';
        }
        function fillRooms() {
            ov.querySelectorAll('.ed-seg button').forEach(b => b.classList.toggle('on', b.dataset.sh === shift));
            current = rows.filter(r => window.shiftOfRow(r) === shift).sort((x, y) => numOf(x) - numOf(y));
            roomSel.innerHTML = current.length
                ? current.map(r => '<option value="' + esc(r.id) + '">' + bn(esc(en(r.data.roomInfo.roomNumber))) + ' নং কক্ষ</option>').join('')

            showPrev();
        }
        ov.querySelector('.ed-seg').addEventListener('click', e => {
            const b = e.target.closest('button'); if (!b) return;
            shift = b.dataset.sh; fillRooms();
        });
        roomSel.addEventListener('change', showPrev);
        fillRooms();

        const close = () => { document.removeEventListener('keydown', onKey); ov.remove(); if (deletedAny) location.reload(); };
        const onKey = e => { if (e.key === 'Escape') close(); };
        document.addEventListener('keydown', onKey);
        ov.querySelector('.ed-x').onclick = close;

                }
                if (!ok) throw new Error((lastErr && lastErr.message) || 'অজানা ত্রুটি');
                // নিশ্চিত হওয়া: সত্যিই মুছেছে কিনা
                const after = await sbApi('seatPlanList', token);
                if ((Array.isArray(after) ? after : []).some(r => r && r.id === pick.id)) throw new Error('সার্ভার সফল বলেছে কিন্তু কক্ষটি এখনো আছে');
                deletedAny = true;
                rows = rows.filter(r => r.id !== pick.id);
                count.morning = 0; count.noon = 0; rows.forEach(r => { count[window.shiftOfRow(r)]++; });
                ov.querySelectorAll('.ed-seg button').forEach(b => { const sm = b.querySelector('small'); if (sm) sm.textContent = bn(count[b.dataset.sh]); });
                fillRooms();
                showAlert(name + ' মুছে ফেলা হয়েছে।', 'success');
                log('কক্ষ ডিলিট: ' + pick.id, 'success');
                if (!rows.length) close();
            } catch (e) {
                showAlert('কক্ষ মুছতে ত্রুটি: ' + e.message, 'error');
                del.disabled = false; go.disabled = false;
            }
        };

        go.onclick = () => {
            const pick = current.find(r => r.id === roomSel.value);
            if (!pick) return;
            fill(pick.data);
            window.__editingId = pick.id;   // কোন সংরক্ষিত কক্ষ এডিট হচ্ছে
            try { if (typeof updateAll === 'function') updateAll(); } catch (e) {}
            close();
            showAlert(bn(en(pick.data.roomInfo.roomNumber)) + ' নং কক্ষের তথ্য ফর্মে ফিরে এসেছে। পরিবর্তন করে "সাবমিট" চাপুন।', 'success');
            log('এডিটের জন্য লোড: ' + pick.id, 'success');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        roomSel.focus();
    };
})();
</script>

        return c + '|' + st.keys.filter(ok).join(',');
    }
    // শিফট বা শিফটের অনুমোদিত শ্রেণি বদলালে হিসাব নতুন করে আঁকা (সার্চ বক্সে লেখার সময় নয়)
    window.__suCheck = function () { if (sigNow() !== lastSig) draw(); };

    // সংরক্ষিত কক্ষ থেকে শ্রেণি-ভিত্তিক ব্যবহৃত রোল (শিফট বাছা থাকলে শুধু চলতি শিফট; না থাকলে সকাল + দুপুর)
    function compute() {
        const S = window.__stu, st = S && S.st;
        if (!st || !st.loaded) return null;
        const per = {}, roomSet = { morning: new Set(), noon: new Set() };
        // শুধু চলতি শিফটের তথ্য: শিফট বাছা থাকলে শুধু ওই শিফটের কক্ষ ও ওই শিফটে অনুমোদিত শ্রেণি
        const cur = curShift(), okCls = (cur && window.shiftClassAllowed) ? window.shiftClassAllowed : () => true;
        lastSig = sigNow();
        saved.forEach(r => {
            if (!r || r.id === '__center__' || !r.data) return;
            const sh = (window.shiftOfRow ? window.shiftOfRow(r) : 'morning') === 'noon' ? 'noon' : 'morning';
            if (cur && sh !== cur) return;
            const room = String(((r.data.roomInfo || {}).roomNumber) || '').trim();
            let any = false;
            (r.data.columnData || []).forEach(c => (c.ranges || []).forEach(rg => {
                if (!rg.classKey || !Array.isArray(rg.rolls) || !st.map[rg.classKey]) return;
                const p = per[rg.classKey] || (per[rg.classKey] = { morning: new Set(), noon: new Set(), occ: {} });
                rg.rolls.forEach(x => {
                    const v = S.fromSaved(rg.classKey, x); if (isNaN(v)) return;
                    p[sh].add(v); any = true;
                    (p.occ[sh + '|' + v] = p.occ[sh + '|' + v] || []).push(room);
                });
            }));
            if (any) roomSet[sh].add(r.id);
        });

        const lab = (k, v) => bnN(S.rollLabel(k, v));
        const pctOf = (u, t) => !t ? 0 : (u >= t ? 100 : Math.min(99, Math.round(u / t * 100)));
        let tTotal = 0, tUsed = 0, tMor = 0, tNoon = 0;
        const dups = [];
        const rows = st.keys.filter(okCls).map(k => {
            const g = st.map[k], p = per[k] || { morning: new Set(), noon: new Set(), occ: {} };
            const usedSet = new Set();
            let mor = 0, noon = 0;
            p.morning.forEach(v => { if (g.rolls.has(v)) { usedSet.add(v); mor++; } });
            p.noon.forEach(v => { if (g.rolls.has(v)) { usedSet.add(v); noon++; } });
            const total = g.n, used = usedSet.size, left = total - used;
            // বাকি রোল: Students-এ থাকা রোলের ক্রমে পরপর বাকিগুলো এক রেঞ্জে (যেমন ০১২–০২০)
            const runs = []; let a = null, z = null;
            [...g.rolls].sort((x, y) => x - y).forEach(v => {
                if (usedSet.has(v)) { if (a !== null) { runs.push(a === z ? lab(k, a) : lab(k, a) + '–' + lab(k, z)); a = z = null; } }
                else { if (a === null) a = v; z = v; }
            });
            if (a !== null) runs.push(a === z ? lab(k, a) : lab(k, a) + '–' + lab(k, z));
            // একই শিফটে একই রোল একাধিক কক্ষে বসানো হলে সতর্কতা
            const label = g.label.replace('শ্রেণি: ', '');
            Object.keys(p.occ).forEach(key => {
                const list = p.occ[key]; if (list.length < 2) return;
                const [sh, v] = key.split('|');
                dups.push({ cls: label, roll: window.__stu.prefixOf(k) + '-' + lab(k, Number(v)), shift: sh === 'noon' ? 'দুপুর' : 'সকাল',
                            rooms: [...new Set(list)].map(x => bnN(x || '?')) });
            });
            tTotal += total; tUsed += used; tMor += mor; tNoon += noon;
            const cls = left === 0 ? 'done' : (used === 0 ? 'none' : 'part');
            return { key: k, label, total, mor, noon, used, left, pct: pctOf(used, total), cls, runs };
        });
        return {
            cur, rows, dups, tTotal, tUsed, tLeft: tTotal - tUsed, tMor, tNoon,
            pct: pctOf(tUsed, tTotal), roomsMor: roomSet.morning.size, roomsNoon: roomSet.noon.size
        };
    }

    function updateStatus(d) {
        const ss = $('stuStatus');
        if (ss && ss.textContent.indexOf('শিক্ষার্থী লোড হয়েছে') > -1) {
            const nt = ss.textContent.replace(/।.*$/, '') + '। 🌅 সকাল শিফটে ' + bnN(d.tMor) + ' জন • ☀️ দুপুর শিফটে ' + bnN(d.tNoon) + ' জন';
            if (ss.textContent !== nt) ss.textContent = nt;
        }
    }

    // ---------- স্ক্রিন ----------
    function rowBar(r) { return r.cls === 'done' ? '#9ee6bd' : (r.cls === 'none' ? '#c9cfdb' : '#F1E2C3'); }

    function drawRows() {
        const body = $('suBody'); if (!body || !last) return;
        const q = bnN(query.trim()).toLowerCase();
        const list = last.rows.filter(r =>
            (filter === 'all' || (filter === 'left' && r.left > 0) || (filter === 'done' && r.left === 0) || (filter === 'none' && r.used === 0)) &&
            (!q || bnN(r.label).toLowerCase().indexOf(q) > -1));
        body.innerHTML = list.length ? list.map(r => {
            const MAX = 5, shown = r.runs.slice(0, MAX).join(', ') + (r.runs.length > MAX ? ' …+' + bnN(r.runs.length - MAX) + 'টি' : '');
            return '<tr><td>' + esc(r.label) +
                (r.left ? '<span class="su-rem" title="' + esc(r.runs.join(', ')) + '">বাকি রোল: ' + esc(shown) + '</span>' : '') + '</td>' +
                '<td class="c">' + bnN(r.total) + '</td>' +
                (last.cur ? '' : '<td class="c">' + bnN(r.mor) + '</td><td class="c">' + bnN(r.noon) + '</td>') +
                '<td class="c" style="color:#9ee6bd;font-weight:700">' + bnN(r.used) + '</td>' +
                '<td class="c" style="color:' + (r.left ? '#f0a89e' : '#9ee6bd') + ';font-weight:700">' + (r.left ? bnN(r.left) : '✔ ০') + '</td>' +
                '<td class="c"><span class="su-badge ' + r.cls + '">' + STAT[r.cls] + '</span>' +
                '<div class="su-mini"><i style="width:' + r.pct + '%;background:' + rowBar(r) + '"></i></div></td></tr>';
        }).join('') : '<tr><td colspan="' + (last.cur ? 5 : 7) + '" class="su-empty">এই শর্তে কোনো শ্রেণি পাওয়া যায়নি</td></tr>';
        const c = $('suCount'); if (c) c.textContent = bnN(list.length) + '/' + bnN(last.rows.length) + 'টি শ্রেণি';
    }

    function draw() {
        const box = ensureBox(); if (!box) return;
        const d = compute();
        if (!d) { box.innerHTML = ''; last = null; return; }
        last = d;
        updateStatus(d);
        const head = '<div class="su-head"><span class="su-title">📊 শ্রেণিভিত্তিক হিসাব' + (d.cur ? ' — ' + SHI2[d.cur] + ' ' + SHN2[d.cur] + ' শিফট' : '') + '</span>' +
            '<button type="button" class="su-btn" id="stuUsageEye" title="' + (open ? 'হিসাব লুকান' : 'হিসাব দেখুন') + '" aria-expanded="' + open + '">' + (open ? '🙈 লুকান' : '👁 দেখুন') + '</button>' +
            '<button type="button" class="su-btn pri" id="suPrint" title="A4 পাতায় রিপোর্ট প্রিন্ট / PDF">🖨 রিপোর্ট প্রিন্ট</button></div>';
        if (!open) { box.innerHTML = head; return; }

        const cnt = { all: d.rows.length, left: d.rows.filter(r => r.left > 0).length, done: d.rows.filter(r => r.left === 0).length, none: d.rows.filter(r => r.used === 0).length };
        const pill = (k, t) => '<button type="button" class="su-pill' + (filter === k ? ' on' : '') + '" data-sf="' + k + '" aria-pressed="' + (filter === k) + '">' + t + ' (' + bnN(cnt[k]) + ')</button>';
        const warn = d.dups.length
            ? '<div class="su-warn">⚠ <b>ডুপ্লিকেট রোল ' + bnN(d.dups.length) + 'টি:</b> একই শিফটে একই রোল একাধিক কক্ষে আছে — ' +
              d.dups.slice(0, 6).map(x => esc(x.cls) + ' ' + esc(x.roll) + ' (' + x.shift + ', কক্ষ ' + x.rooms.join('/') + ')').join('; ') +
              (d.dups.length > 6 ? ' …আরও ' + bnN(d.dups.length - 6) + 'টি' : '') + '</div>'
            : '';
        box.innerHTML = head +
            '<div class="su-cards">' +
            '<div class="su-card"><b>' + bnN(d.tTotal) + '</b><span>মোট শিক্ষার্থী</span></div>' +
            '<div class="su-card used"><b>' + bnN(d.tUsed) + '</b><span>ব্যবহৃত</span></div>' +
            '<div class="su-card left"><b>' + bnN(d.tLeft) + '</b><span>বাকি</span></div>' +
            '<div class="su-card pct"><b>' + bnN(d.pct) + '%</b><span>অগ্রগতি</span></div></div>' +
            '<div class="su-bar"><i style="width:' + d.pct + '%"></i></div>' +
            '<div class="su-shift">' +
              (d.cur !== 'noon' ? '<span>🌅 সকাল: ' + bnN(d.roomsMor) + 'টি কক্ষ • ' + bnN(d.tMor) + ' জন</span>' : '') +
              (d.cur !== 'morning' ? '<span>☀️ দুপুর: ' + bnN(d.roomsNoon) + 'টি কক্ষ • ' + bnN(d.tNoon) + ' জন</span>' : '') + '</div>' +
            warn +
            '<div class="su-tools">' + pill('all', 'সব') + pill('left', 'বাকি আছে') + pill('done', 'সম্পূর্ণ') + pill('none', 'শুরু হয়নি') +
            '<input type="search" class="su-search" id="suQ" placeholder="🔍 শ্রেণি খুঁজুন (যেমন: ৯ম, বালিকা)" value="' + esc(query) + '">' +
            '<span id="suCount" style="font-size:11.5px;color:#c9cfdb"></span></div>' +
            '<div class="su-wrap"><table class="su-tbl"><thead><tr><th style="text-align:left">শ্রেণি</th><th class="c">মোট</th>' + (d.cur ? '' : '<th class="c">🌅 সকাল</th><th class="c">☀️ দুপুর</th>') +
            '<th class="c">ব্যবহৃত</th><th class="c">বাকি</th><th class="c">অবস্থা</th></tr></thead><tbody id="suBody"></tbody></table></div>';
        drawRows();
    }

    // ---------- A4 প্রিন্ট রিপোর্ট ----------
    function sheetHtml(d) {
        const val = id => ($(id) && $(id).value) || '';
        const exam = [val('examName'), val('examYear') ? bnN(val('examYear')) : ''].filter(Boolean).join(' ');
        let time = val('examTime'); if (time === '__other__') time = '';
        const sess = val('stuSession');
        let when;
        try { when = new Date().toLocaleString('bn-BD', { dateStyle: 'long', timeStyle: 'short' }); } catch (e) { when = bnN(new Date().toLocaleString()); }

        const body = d.rows.map((r, i) =>
            '<tr><td class="c">' + bnN(i + 1) + '</td><td>' + esc(r.label) + '</td>' +
            '<td class="c">' + bnN(r.total) + '</td>' + (d.cur ? '' : '<td class="c">' + bnN(r.mor) + '</td><td class="c">' + bnN(r.noon) + '</td>') +
            '<td class="c"><b>' + bnN(r.used) + '</b></td><td class="c"><b>' + bnN(r.left) + '</b></td>' +
            '<td class="c">' + STAT[r.cls] + '<div class="bar"><i style="width:' + r.pct + '%"></i></div></td>' +
            '<td class="rem">' + (r.left ? esc(r.runs.join(', ')) : '—') + '</td></tr>').join('');
        const warn = d.dups.length
            ? '<div class="warn"><b>⚠ ডুপ্লিকেট রোল (' + bnN(d.dups.length) + 'টি):</b> ' +
              d.dups.map(x => esc(x.cls) + ' ' + esc(x.roll) + ' (' + x.shift + ', কক্ষ ' + x.rooms.join('/') + ')').join('; ') + '</div>'
            : '';
        return '<div class="su-sheet">' +
            '<h1>শ্রেণিভিত্তিক পরীক্ষার্থী ব্যবহার রিপোর্ট' + (d.cur ? ' — ' + SHN2[d.cur] + ' শিফট' : '') + '</h1>' +
            (exam ? '<div class="sub">' + esc(exam) + (time ? ' • শুরু: ' + esc(time) : '') + '</div>' : '') +
            '<div class="meta"><span>সেশন: ' + (sess ? bnN(esc(sess)) : '—') + '</span><span>প্রিন্টের সময়: ' + esc(when) + '</span></div>' +
            '<div class="sum"><div><b>' + bnN(d.tTotal) + '</b>মোট শিক্ষার্থী</div><div><b>' + bnN(d.tUsed) + '</b>সিটে বসানো হয়েছে</div>' +
            '<div><b>' + bnN(d.tLeft) + '</b>বাকি</div><div><b>' + bnN(d.pct) + '%</b>অগ্রগতি</div></div>' +
            '<div class="shifts">' + (d.cur === 'morning' ? '🌅 সকাল শিফট: ' + bnN(d.roomsMor) + 'টি কক্ষ, ' + bnN(d.tMor) + ' জন'
                : d.cur === 'noon' ? '☀️ দুপুর শিফট: ' + bnN(d.roomsNoon) + 'টি কক্ষ, ' + bnN(d.tNoon) + ' জন'
                : '🌅 সকাল শিফট: ' + bnN(d.roomsMor) + 'টি কক্ষ, ' + bnN(d.tMor) + ' জন &nbsp;|&nbsp; ☀️ দুপুর শিফট: ' + bnN(d.roomsNoon) + 'টি কক্ষ, ' + bnN(d.tNoon) + ' জন') + '</div>' +
            '<table><thead><tr><th style="width:5%">ক্রম</th><th>শ্রেণি</th><th style="width:7%">মোট</th>' + (d.cur ? '' : '<th style="width:7%">সকাল</th><th style="width:7%">দুপুর</th>') +
            '<th style="width:8%">ব্যবহৃত</th><th style="width:7%">বাকি</th><th style="width:13%">অবস্থা</th><th style="width:22%">বাকি রোল</th></tr></thead>' +
            '<tbody>' + body + '</tbody>' +
            '<tfoot><tr><td colspan="2" class="c">সর্বমোট</td><td class="c">' + bnN(d.tTotal) + '</td>' + (d.cur ? '' : '<td class="c">' + bnN(d.tMor) + '</td><td class="c">' + bnN(d.tNoon) + '</td>') +
            '<td class="c">' + bnN(d.tUsed) + '</td><td class="c">' + bnN(d.tLeft) + '</td><td class="c">' + bnN(d.pct) + '%</td><td></td></tr></tfoot></table>' +
            warn +
            '<div class="sign"><span>প্রস্তুতকারী</span><span>কেন্দ্র সচিব</span></div>' +
            '<div class="foot">সিট প্ল্যান সিস্টেম থেকে স্বয়ংক্রিয়ভাবে তৈরি • ' + esc(when) + '</div></div>';
    }

    function printReport() {
        const d = compute();
        if (!d) { if (typeof showAlert === 'function') showAlert('আগে Students লোড করুন, তারপর রিপোর্ট প্রিন্ট করুন।', 'error'); return; }
        injectCss();
        let sh = $('suSheet');
        if (!sh) { sh = document.createElement('div'); sh.id = 'suSheet'; document.body.appendChild(sh); }
        sh.innerHTML = sheetHtml(d);
        document.body.classList.add('su-printing');
        window.addEventListener('afterprint', function done() {
            document.body.classList.remove('su-printing');
            window.removeEventListener('afterprint', done);
        });
        setTimeout(() => window.print(), 60);
    }

    async function loadSaved() {
        try {
            const { api: sbApi, token } = await window.fbReady;
            const list = await sbApi('seatPlanList', token);
            saved = Array.isArray(list) ? list : [];
        } catch (e) { console.warn('ব্যবহৃত রোলের হিসাব আনা যায়নি:', e.message); }
        draw();
    }

    // Students লোড হলে (স্ট্যাটাস বার্তা বদলালে) আবার আঁকবে
    const s = $('stuStatus');
    if (s) new MutationObserver(draw).observe(s, { childList: true, characterData: true, subtree: true });

    // সাবমিটের পর হালনাগাদ
    const _fg = fastGenerateSeatPlan;
    fastGenerateSeatPlan = async function () { await _fg(); await loadSaved(); };

    const _et = $('examTime');
    if (_et) _et.addEventListener('change', () => setTimeout(window.__suCheck, 60));

    window.fbReady.then(loadSaved);
})();
</script>
<script>
// ===== সাবমিট সফল হলে পেজ অটো রিফ্রেশ =====
(function () {
    const AUTO_REFRESH_DELAY = 1500;   // মিলিসেকেন্ড — সফল বার্তা দেখানোর সময়
    const _orig = fastGenerateSeatPlan;
    fastGenerateSeatPlan = async function () {
        window.__seatSaved = false;
        await _orig();
        if (window.__seatSaved) {
            const btn = document.getElementById('submitBtn');
            if (btn) { btn.disabled = true; btn.textContent = 'রিফ্রেশ হচ্ছে...'; }
            setTimeout(function () { location.reload(); }, AUTO_REFRESH_DELAY);
        }
    };
})();
</script>
<script>
// ===== শিফট অনুযায়ী শ্রেণি নির্ধারণ: সকালে শুধু নির্ধারিত শ্রেণি, দুপুরে শুধু নির্ধারিত শ্রেণি =====
(function () {
    const $ = id => document.getElementById(id);
    const KEY = 'seatplan_shift_classes';   // { noMorning: [শ্রেণির key...], noNoon: [...] } — তালিকায় না থাকলে শ্রেণি অনুমোদিত
    const bnN = n => String(n).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
    const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const SHN = { morning: 'সকাল', noon: 'দুপুর' };

    function load() {
        try {
            const c = JSON.parse(localStorage.getItem(KEY) || 'null');
            if (c && Array.isArray(c.noMorning) && Array.isArray(c.noNoon)) return c;
        } catch (e) {}
        return { noMorning: [], noNoon: [] };
    }
    function allowed(k) {
        const sh = window.currentShift && window.currentShift();
        if (!sh || !k) return true;
        const c = load();
        return (sh === 'morning' ? c.noMorning : c.noNoon).indexOf(k) === -1;
    }
    window.shiftClassAllowed = allowed;   // 📊 শ্রেণিভিত্তিক হিসাব এটি ব্যবহার করে
    const labelOf = k => { const g = window.__stu && window.__stu.st.map[k]; return g ? g.label.replace('শ্রেণি: ', '') : k; };

    // ---- বাটন ও নোট ----
    const loadBtn = $('stuLoadBtn');
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'add-range-btn'; btn.id = 'shiftClsBtn';
    btn.textContent = '⚙ শিফট অনুযায়ী শ্রেণি';
    loadBtn.insertAdjacentElement('afterend', btn);
    const note = document.createElement('div');
    note.id = 'shiftClsNote';
    note.style.cssText = 'display:inline;font-size:12.5px;margin:6px 8px 0 0;color:#9ee6bd;font-weight:700';
    $('stuStatus').insertAdjacentElement('afterend', note);
    const detail = document.createElement('div');
    detail.id = 'shiftClsDetail';
    detail.style.cssText = 'display:inline;font-size:12px;color:#fff';
    note.insertAdjacentElement('afterend', detail);

    let useCache = {};
    async function refreshUse() {
        try { useCache = await usageBySaved(); } catch (e) {}
        apply();
    }
    function renderDetail(st, sh) {
        const keys = st.keys.filter(allowed);
        if (!keys.length) { detail.innerHTML = ''; return; }
        let tT = 0, tU = 0, tL = 0;
        const rows = keys.map(k => {
            const n = st.map[k].n, u = useCache[k] || { morning: 0, noon: 0 };
            const here = u[sh], left = Math.max(0, n - here);
            tT += n; tU += here; tL += left;

            '</td><td style="text-align:center">' + bnN(tU) + '</td><td style="text-align:center">' + bnN(tL) + '</td></tr></tfoot></table></div>';

    // ---- নির্বাচনের তালিকায় শুধু অনুমোদিত শ্রেণি দেখানো ----
    function apply() {
        if (window.__suCheck) window.__suCheck();
        document.querySelectorAll('#columnInputs select.stu-class, #schoolForms select.school-select').forEach(sel => {
            [...sel.options].forEach(o => {
                const k = sel.classList.contains('stu-class') ? o.value : (o.dataset.k || '');
                if (!k) return;
                const bad = !allowed(k) && !o.selected;   // আগে বাছা থাকলে (এডিটের ক্ষেত্রে) থাকবে
                o.hidden = bad; o.disabled = bad;
            });
        });
        const st = window.__stu && window.__stu.st, sh = window.currentShift && window.currentShift();
        // Students বার: মোট শিক্ষার্থী + সকাল শিফটে কত + দুপুর/বিকাল শিফটে কত (শিফট নির্ধারণের সেটিং অনুযায়ী)
        const stMsg = $('stuStatus');
        if (st && st.loaded && stMsg && /^(✅|👥)/.test(stMsg.textContent)) {
            const c = load();
            const sum = keys => keys.reduce((a, k) => a + st.map[k].n, 0);
            const kMor = st.keys.filter(k => c.noMorning.indexOf(k) === -1);
            const kNoon = st.keys.filter(k => c.noNoon.indexOf(k) === -1);
            const tx = '👥 মোট শিক্ষার্থী: ' + bnN(sum(st.keys)) + ' জন • 🌅 সকাল শিফটে: ' + bnN(sum(kMor)) + ' জন (' + bnN(kMor.length) + 'টি শ্রেণি/শাখা)' +
                ' • ☀️ দুপুর/বিকাল শিফটে: ' + bnN(sum(kNoon)) + ' জন (' + bnN(kNoon.length) + 'টি শ্রেণি/শাখা)';
            if (stMsg.textContent !== tx) stMsg.textContent = tx;
        }
        if (!st || !st.loaded || !sh) { note.textContent = ''; detail.innerHTML = ''; return; }
        const ok = st.keys.filter(allowed).length;
        note.textContent = '🕘 ' + SHN[sh] + ' শিফট: ' + bnN(ok) + 'টি শ্রেণি নির্ধারিত' + (ok === st.keys.length ? ' (সব শ্রেণি)' : '');
        // চলতি শিফটের নির্ধারিত শ্রেণি অনুযায়ী সংখ্যা (শাখা/গ্রুপ নয়, শুধু শ্রেণি): যেমন "৮ম শ্রেণি: ৭৮৭ জন"
        const rk = st.keys.filter(allowed);
        const chip = 'display:inline-block;margin:3px 6px 0 0;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:12.5px';
        const ORD = { 1:'১ম',2:'২য়',3:'৩য়',4:'৪র্থ',5:'৫ম',6:'৬ষ্ঠ',7:'৭ম',8:'৮ম',9:'৯ম',10:'১০ম',11:'১১শ',12:'১২শ' };
        const byCls = {}, order = [];
        rk.forEach(k => {
            const b = parseInt(String(k).trim(), 10), ck = isNaN(b) ? String(k).trim().split(' ')[0] : String(b);
            if (!(ck in byCls)) { byCls[ck] = 0; order.push(ck); }
            byCls[ck] += st.map[k].n;
        });
        const html = order.map(ck => '<span style="' + chip + '">' + esc(ORD[ck] ? ORD[ck] + ' শ্রেণি' : ck) + ': <b style="color:#9ee6bd">' + bnN(byCls[ck]) + ' জন</b></span>').join('');
        if (detail.innerHTML !== html) detail.innerHTML = html;
    }
    let tm = null;
    const sched = () => { clearTimeout(tm); tm = setTimeout(apply, 30); };
    ['columnInputs', 'schoolForms'].forEach(id => new MutationObserver(sched).observe($(id), { childList: true, subtree: true }));
    $('examTime').addEventListener('change', sched);
    new MutationObserver(sched).observe($('stuStatus'), { childList: true, characterData: true, subtree: true });

    // ---- সাবমিটে অননুমোদিত শ্রেণি আটকানো ----
    const _qv = quickValidation;
    quickValidation = function () {
        const e = _qv(), bad = new Set();
        document.querySelectorAll('#columnInputs select.stu-class').forEach(s => { if (s.value && !allowed(s.value)) bad.add(s.value); });
        document.querySelectorAll('#schoolForms .school-select').forEach(s => { const o = s.selectedOptions[0], k = o && o.dataset.k; if (k && !allowed(k)) bad.add(k); });
        if (bad.size) {
            const sh = window.currentShift();
            e.push('এই শ্রেণি ' + SHN[sh] + ' শিফটে নির্ধারিত নয়: ' + [...bad].map(labelOf).join(', '));
        }
        return e;
    };

    // ---- সেটিংস ডায়ালগ (সার্চ • প্রিসেট • ব্যবহারের হিসাব • সতর্কতা) ----
    function css() {

        #shiftClsDlg .sc-head{padding:16px 20px;color:#fff;background:linear-gradient(135deg,#101A33,#33456F)}
