        #shiftClsDlg input[type=checkbox]{width:20px;height:20px;cursor:pointer;accent-color:#1D2B4F}
        #shiftClsDlg .sc-sum{padding:8px 20px;font-size:12.5px;color:#33456F;background:#F7F8FC;border-top:1px solid #EDEAE0}
        #shiftClsDlg .sc-foot{display:flex;gap:10px;padding:14px 20px;border-top:1px solid #EDEAE0}
        #shiftClsDlg .sc-foot button{flex:1;padding:11px;border:0;border-radius:10px;font:inherit;font-weight:700;cursor:pointer}
        #shiftClsDlg .sc-cancel{background:#EEF1F8;color:#1D2B4F}
        #shiftClsDlg .sc-save{flex:1.6!important;background:linear-gradient(135deg,#D6A24E,#B9822E);color:#101A33}
        #shiftClsDlg tr.sc-cls td{background:#EEF1F8;border-top:2px solid #C9CFDB}
        #shiftClsDlg tr.sc-cls td small{display:inline;margin-left:6px}
        #shiftClsDlg tr.sc-cls td:not(:first-child) small{display:block;margin:2px 0 0}
        #shiftClsDlg .sc-tg{border:0;background:#fff;border-radius:6px;width:24px;height:24px;margin-right:6px;cursor:pointer;color:#1D2B4F;font-size:13px;line-height:1;box-shadow:0 0 0 1px #C9CFDB}
        #shiftClsDlg .sc-tg:hover{background:#F1E2C3}
        #shiftClsDlg tr.sc-hid{display:none!important}
        #shiftClsDlg th{box-shadow:0 1px 0 #C9CFDB}
        @media(max-width:520px){#shiftClsDlg .sc-body{padding:6px 10px 10px}#shiftClsDlg td,#shiftClsDlg th{padding:6px 4px}#shiftClsDlg table{font-size:13px}}
        #shiftClsDlg tr[data-c] td:first-child{padding-left:22px}`;
        document.head.appendChild(s);
    }
    // সংরক্ষিত কক্ষগুলো থেকে শ্রেণি-ভিত্তিক ব্যবহৃত সংখ্যা (শিফটসহ)
    async function usageBySaved() {
        const out = {};
        try {
            const { api: sb, token } = await window.fbReady;
            const rows = await sb('seatPlanList', token);
            (Array.isArray(rows) ? rows : []).forEach(r => {
                if (!r || r.id === '__center__' || !r.data) return;
                const sh = window.shiftOfRow(r) === 'noon' ? 'noon' : 'morning';
                (r.data.columnData || []).forEach(c => (c.ranges || []).forEach(rg => {
                    if (!rg.classKey || !Array.isArray(rg.rolls)) return;
                    const u = out[rg.classKey] || (out[rg.classKey] = { morning: 0, noon: 0 });
                    u[sh] += rg.rolls.length;
                }));
            });
        } catch (e) { console.warn('ব্যবহারের হিসাব আনা যায়নি:', e.message); }
        return out;
    }
    btn.addEventListener('click', async () => {
        const st = window.__stu && window.__stu.st;
        if (!st || !st.loaded) { showAlert('আগে Students লোড করুন, তারপর শিফট অনুযায়ী শ্রেণি ঠিক করুন।', 'error'); return; }
        if ($('shiftClsDlg')) return;
        btn.disabled = true;
        const use = await usageBySaved();
        btn.disabled = false;
        if ($('shiftClsDlg')) return;
        css();
        const c = load();
        const ov = document.createElement('div'); ov.id = 'shiftClsDlg';
        ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true');
        ov.innerHTML = '<div class="sc-box"><div class="sc-head"><h3>শিফট অনুযায়ী শ্রেণি</h3><p>যে শিফটে যে শ্রেণি বসবে সেখানে টিক দিন। দুই শিফটে টিক দিলে দুই শিফটেই পাবে।</p></div>' +
            '<div class="sc-tools"><input type="search" id="scQ" placeholder="🔍 শ্রেণি খুঁজুন (যেমন: ৯ম, বালিকা)">' +
            '<button type="button" class="sc-pre" data-p="m">সব সকালে</button><button type="button" class="sc-pre" data-p="n">সব দুপুরে</button><button type="button" class="sc-pre" data-p="b">দুই শিফটেই সব</button></div>' +
            '<div class="sc-body"><table><thead><tr><th>শ্রেণি</th><th>🌅 সকাল</th><th>☀️ দুপুর</th></tr></thead><tbody>' +
            (function () {
                const baseOfKey = k => String(k).trim().split(' ')[0];
                const cnt = {}; st.keys.forEach(k => { const b = baseOfKey(k); cnt[b] = (cnt[b] || 0) + 1; });
                const seen = {}, tot = {}, aM = {}, aN = {};
                st.keys.forEach(k => { const b = baseOfKey(k), u = use[k] || { morning: 0, noon: 0 };
                    tot[b] = (tot[b] || 0) + st.map[k].n; aM[b] = (aM[b] || 0) + u.morning; aN[b] = (aN[b] || 0) + u.noon; });
                return st.keys.map(k => {
                const b = baseOfKey(k);
                let head = '';
                if (cnt[b] > 1 && !seen[b]) {
                    seen[b] = 1;
                    const cl = (labelOf(k).split(/[\s(]/)[0]) || b;
                    head = '<tr class="sc-cls" data-c="' + esc(b) + '" data-l="' + esc(cl) + '"><td><button type="button" class="sc-tg" title="শাখাগুলো লুকান/দেখান" aria-expanded="true">▾</button><b>শ্রেণি: ' + esc(cl) + '</b><small>' + bnN(cnt[b]) + 'টি শাখা • মোট ' + bnN(tot[b]) + ' জন • সব শাখা একসাথে</small></td>' +
                        '<td><input type="checkbox" class="cm" title="এই শ্রেণির সব শাখা"><small>ব্যবহৃত ' + bnN(aM[b]) + '</small></td><td><input type="checkbox" class="cn" title="এই শ্রেণির সব শাখা"><small>ব্যবহৃত ' + bnN(aN[b]) + '</small></td></tr>';
                }
                const u = use[k] || { morning: 0, noon: 0 };
                return head + '<tr data-k="' + esc(k) + '"' + (cnt[b] > 1 ? ' data-c="' + esc(b) + '"' : '') + ' data-l="' + esc(labelOf(k)) + '" data-um="' + u.morning + '" data-un="' + u.noon + '">' +
                    '<td><b>' + esc(labelOf(k)) + '</b><small>মোট ' + bnN(st.map[k].n) + ' জন</small><span class="sc-w"></span></td>' +
                    '<td><input type="checkbox" class="m"' + (c.noMorning.indexOf(k) === -1 ? ' checked' : '') + '>' + '<small>ব্যবহৃত ' + bnN(u.morning) + '</small></td>' +
                    '<td><input type="checkbox" class="n"' + (c.noNoon.indexOf(k) === -1 ? ' checked' : '') + '>' + '<small>ব্যবহৃত ' + bnN(u.noon) + '</small></td></tr>';
                }).join('');
            })() +
            '</tbody></table></div><div class="sc-sum" id="scSum"></div>' +
            '<div class="sc-foot"><button type="button" class="sc-cancel">বাতিল</button><button type="button" class="sc-save">সংরক্ষণ করুন</button></div></div>';
        document.body.appendChild(ov);

        const rows = [...ov.querySelectorAll('tbody tr[data-k]')];
        const heads = [...ov.querySelectorAll('tbody tr.sc-cls')];
        // শ্রেণির হেডার-টিক: সব শাখা টিক থাকলে টিক, কিছু থাকলে আংশিক (—)
        function syncHeads() {
            heads.forEach(h => {
                const sec = rows.filter(tr => tr.dataset.c === h.dataset.c);
                [['cm', 'm'], ['cn', 'n']].forEach(([hc, rc]) => {
                    const on = sec.filter(tr => tr.querySelector('.' + rc).checked).length;
                    const box = h.querySelector('.' + hc);
                    box.checked = on === sec.length; box.indeterminate = on > 0 && on < sec.length;
                });
            });
        }
        function applyCollapse() {
            heads.forEach(h => {
                const col = h.classList.contains('col');
                h.querySelector('.sc-tg').textContent = col ? '▸' : '▾';
                h.querySelector('.sc-tg').setAttribute('aria-expanded', col ? 'false' : 'true');
                rows.forEach(tr => { if (tr.dataset.c === h.dataset.c) tr.classList.toggle('sc-hid', col); });
            });
        }
        const snap = () => rows.map(tr => (tr.querySelector('.m').checked ? 1 : 0) + '' + (tr.querySelector('.n').checked ? 1 : 0)).join('');
        const init = snap();
        function refresh() {
            syncHeads();
            let m = 0, n = 0, none = 0, sm = 0, sn = 0;
            rows.forEach(tr => {
                const cm = tr.querySelector('.m').checked, cn = tr.querySelector('.n').checked, ns = (st.map[tr.dataset.k] || {}).n || 0;
                const um = +tr.dataset.um, un = +tr.dataset.un, w = [];
                if (cm) { m++; sm += ns; } if (cn) { n++; sn += ns; }
                if (!cm && !cn) { none++; w.push('কোনো শিফটে নেই — এই শ্রেণি সিটে বসানো যাবে না'); }
                if (!cm && um > 0) w.push('সকালের কক্ষে ইতোমধ্যে ' + bnN(um) + ' জন বসানো আছে');
                if (!cn && un > 0) w.push('দুপুরের কক্ষে ইতোমধ্যে ' + bnN(un) + ' জন বসানো আছে');
                tr.querySelector('.sc-w').innerHTML = w.map(esc).join('<br>');
                tr.className = (!cm && !cn) ? 'bad' : (w.length ? 'warn' : '');
            });
            $('scSum').textContent = '🌅 সকাল: ' + bnN(m) + 'টি শ্রেণি (' + bnN(sm) + ' জন) • ☀️ দুপুর: ' + bnN(n) + 'টি শ্রেণি (' + bnN(sn) + ' জন)' + (none ? ' • ⚠ কোনো শিফটে নেই: ' + bnN(none) + 'টি' : '');
        }
        const close = () => { document.removeEventListener('keydown', onKey); ov.remove(); };
        const tryClose = () => { if (snap() !== init && !confirm('সংরক্ষণ না করা পরিবর্তন আছে। তবুও বন্ধ করবেন?')) return; close(); };
        const onKey = e => { if (e.key === 'Escape') tryClose(); };
        document.addEventListener('keydown', onKey);
        ov.addEventListener('mousedown', e => { if (e.target === ov) tryClose(); });
        ov.addEventListener('click', e => {
            const tg = e.target.closest('.sc-tg'); if (!tg) return;
            tg.closest('tr').classList.toggle('col'); applyCollapse();
        });
        ov.addEventListener('change', e => {
            if (e.target.matches('input.cm, input.cn')) {   // শ্রেণির টিক → ওই শ্রেণির সব শাখা
                const h = e.target.closest('tr'), rc = e.target.classList.contains('cm') ? 'm' : 'n';
                rows.filter(tr => tr.dataset.c === h.dataset.c).forEach(tr => { tr.querySelector('.' + rc).checked = e.target.checked; });
                refresh();
            } else if (e.target.matches('input.m, input.n')) refresh();
        });
        ov.querySelector('.sc-cancel').onclick = tryClose;
        ov.querySelectorAll('.sc-pre').forEach(b => b.onclick = () => {
            const p = b.dataset.p;
            rows.forEach(tr => { tr.querySelector('.m').checked = p !== 'n'; tr.querySelector('.n').checked = p !== 'm'; });
            refresh();
        });
        $('scQ').addEventListener('input', e => {
            const q = bnN(e.target.value.trim()).toLowerCase();
            rows.forEach(tr => { tr.style.display = (!q || bnN(tr.dataset.l).toLowerCase().indexOf(q) > -1) ? '' : 'none'; });
            if (q) { heads.forEach(h => h.classList.remove('col')); applyCollapse(); }
            heads.forEach(h => { h.style.display = rows.some(tr => tr.dataset.c === h.dataset.c && tr.style.display !== 'none') ? '' : 'none'; });
        });
        ov.querySelector('.sc-save').onclick = () => {
            const nm = [], nn = [];
            rows.forEach(tr => {
                if (!tr.querySelector('.m').checked) nm.push(tr.dataset.k);
                if (!tr.querySelector('.n').checked) nn.push(tr.dataset.k);
            });
            const cfg = { noMorning: nm, noNoon: nn };
            try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) {}
            close(); apply();
            pushServer(cfg).then(ok => showAlert(ok ? 'শিফট অনুযায়ী শ্রেণি সংরক্ষিত হয়েছে (সার্ভারেও — সব কম্পিউটারে একই থাকবে)।' : 'এই ব্রাউজারে সংরক্ষিত হয়েছে, কিন্তু সার্ভারে সংরক্ষণ করা যায়নি।', ok ? 'success' : 'error'));
        };
        refresh();
        $('scQ').focus();
    });

    // ---- সার্ভারে স্থায়ী সংরক্ষণ: একবার ঠিক করলে সব ব্রাউজার/কম্পিউটারে একই থাকবে ----
    async function serverGet() {
        const { api: sb, token } = await window.fbReady;
        const rows = await sb('seatPlanList', token);
        const c = (Array.isArray(rows) ? rows : []).find(r => r && r.id === '__center__');
        return { sb, token, data: (c && c.data) || {} };
    }
    async function pushServer(cfg) {
        try {
            const { sb, token, data } = await serverGet();
            const center = Object.assign({}, data.center || {}, { shiftClasses: cfg });
            await sb('seatPlanSave', token, '__center__', Object.assign({}, data, { center: center }));
            return true;
        } catch (e) { console.warn('শিফট-শ্রেণি সার্ভারে সংরক্ষণ হয়নি:', e.message); return false; }
    }
    async function pullServer() {
        try {
            const { data } = await serverGet();
            const sc = data.center && data.center.shiftClasses;
            if (sc && Array.isArray(sc.noMorning) && Array.isArray(sc.noNoon)) {
                try { localStorage.setItem(KEY, JSON.stringify(sc)); } catch (e) {}
                apply();
            } else {
                const l = localStorage.getItem(KEY);   // সার্ভারে নেই কিন্তু এই ব্রাউজারে আছে → সার্ভারে তুলে দেওয়া
                if (l) pushServer(JSON.parse(l));
            }
        } catch (e) { console.warn('শিফট-শ্রেণি সার্ভার থেকে আনা যায়নি:', e.message); }
    }
    window.fbReady.then(pullServer);
    window.fbReady.then(refreshUse);
    apply();
})();
</script>
<script>
// ===== কক্ষ নং: সাবমিটের পর পরের বার নিজে থেকে পরের নম্বর বসবে (১০১ → ১০২) =====
(function () {
    const KEY = 'seatplan_next_room';
    const BN = '০১২৩৪৫৬৭৮৯';
    const toEn = v => String(v == null ? '' : v).replace(/[০-৯]/g, d => String(BN.indexOf(d)));
    const toBn = v => String(v).replace(/\d/g, d => BN[+d]);
    const box = document.getElementById('roomNumber');
    if (!box) return;

    // শেষের সংখ্যা ১ বাড়ায়; বাংলা/ইংরেজি অঙ্ক ও শুরুর শূন্য (০০৯ → ০১০) ঠিক রাখে; শেষে সংখ্যা না থাকলে null
    function nextRoom(v) {
        const raw = String(v || '').trim(), m = toEn(raw).match(/^(.*?)(\d+)$/);
        if (!m) return null;
        let num = String(parseInt(m[2], 10) + 1);
        while (num.length < m[2].length) num = '0' + num;
        const out = m[1] + num;
        return /[০-৯]/.test(raw) ? toBn(out) : out;
    }

    const fire = () => box.dispatchEvent(new Event('change', { bubbles: true }));
    let touched = false;
    box.addEventListener('input', e => { if (e.isTrusted) touched = true; });

    // সংরক্ষিত কক্ষগুলোর (সার্ভার) মধ্যে বর্তমান শিফটের সর্বোচ্চ কক্ষ নং-এর পরেরটি বসানো (১০২ থাকলে ১০৩)
    async function applyNextFromServer() {
        if (touched || window.__editingId) return;
        try {
            const { api: sbApi, token } = await window.fbReady;
            const list = await sbApi('seatPlanList', token);
            const sh = window.currentShift && window.currentShift();
            let best = null, bestN = -1;
            (Array.isArray(list) ? list : []).forEach(r => {
                if (!r || r.id === '__center__' || !r.data) return;
                if (sh && window.shiftOfRow && window.shiftOfRow(r) !== sh) return;
                const raw = String((r.data.roomInfo || {}).roomNumber || '').trim();
                const m = toEn(raw).match(/(\d+)$/);
                if (!m) return;
                const n = parseInt(m[1], 10);
                if (n > bestN) { bestN = n; best = raw; }
            });
            const nx = best ? nextRoom(best) : '';   // এই শিফটে কোনো কক্ষ না থাকলে ঘর ফাঁকা
            if (!touched && !window.__editingId && box.value !== nx) { box.value = nx; fire(); }
        } catch (e) { console.warn('পরের কক্ষ নং সার্ভার থেকে আনা যায়নি:', e.message); }
    }

    // লোডের সময়: আগে এই ব্রাউজারে সংরক্ষিত নম্বর (দ্রুত), তারপর সার্ভার থেকে নিশ্চিত করা
    try {
        const saved = localStorage.getItem(KEY);
        if (saved) { box.value = saved; fire(); }
    } catch (e) {}
    if (window.fbReady) window.fbReady.then(applyNextFromServer).catch(() => {});
    // পরীক্ষার সময় (শিফট) বদলালে ওই শিফটের শেষ কক্ষের পরেরটি
    const et = document.getElementById('examTime');
    if (et) et.addEventListener('change', () => setTimeout(applyNextFromServer, 0));

    // সাবমিট সফল হলে পরের নম্বর রেখে দেওয়া (এডিটের সময় নম্বর এগোবে না)
    const _prev = fastGenerateSeatPlan;
    fastGenerateSeatPlan = async function () {
        const wasEditing = !!window.__editingId, used = box.value.trim();
        await _prev();
        if (!window.__seatSaved || wasEditing) return;
        const nx = nextRoom(used);
        if (nx) { try { localStorage.setItem(KEY, nx); } catch (e) {} }
    };
})();
</script>
<script>
// ===== এক নজরে আসন বিন্যাস: সংরক্ষিত কক্ষ থেকে স্বয়ংক্রিয় টেবিল (প্রিন্ট / PDF / কপি) =====
// বসাতে হবে: ফাইলের সবচেয়ে শেষের script ব্লকের পরে, body বন্ধ হওয়ার ঠিক আগে
(function () {
    if (window.__glanceInit) return; window.__glanceInit = true;

    // ---------- Config (প্রয়োজনে এখানে বদলান) ----------
    const CFG = {
        title: 'এক নজরে আসন বিন্যাস',
        signLeft: 'প্রস্তুতকারী',
        signRight: 'কেন্দ্র সচিব',
        sep: ' থেকে '            // রোল রেঞ্জের মাঝের শব্দ: "৫০০১ থেকে ৫০৪০"
    };

    const $ = id => document.getElementById(id);
    const BN = '০১২৩৪৫৬৭৮৯';
    const bn = s => String(s == null ? '' : s).replace(/\d/g, d => BN[d]);
    const en = s => String(s == null ? '' : s).replace(/[০-৯]/g, d => String(BN.indexOf(d)));
    const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const SHN = { morning: 'সকাল', noon: 'বিকাল' };

    const shiftOf = r => (window.shiftOfRow ? window.shiftOfRow(r) : 'morning') === 'noon' ? 'noon' : 'morning';

    // ---------- ডেটা (V13: শ্রেণি + রোল; রোল সংরক্ষণ rg.classKey / rg.rolls) ----------
    const A = () => window.__stu || null;
    const stT = () => (window.__stu && window.__stu.st) || { loaded: false, map: {}, keys: [] };
    const pad3 = n => String(n).padStart(3, '0');
    function rollNum(key, x) {   // সংরক্ষিত রোল → ভেতরের সংখ্যা (সাফিক্স রোল যেমন ২.০০১ সহ)
        const a = A();
        if (a && a.fromSaved) { const v = a.fromSaved(key, x); if (!isNaN(v)) return v; }
        const m = en(x).match(/\d+/); return m ? parseInt(m[0], 10) : NaN;
    }
    function rollTxt(key, v, prefix) {   // "IX-০০১" ধরনের লেখা
        const a = A(), known = key && stT().map[key];
        const pf = known && a && a.prefixOf ? a.prefixOf(key) : (prefix || '');
        const lab = known && a && a.rollLabel ? a.rollLabel(key, v) : pad3(Math.floor(Number(v) + 1e-9));
        return bn((pf ? pf + '-' : '') + lab);
    }
    const classLabel = key => !key ? '' : ((stT().map[key] && stT().map[key].label) || ('শ্রেণি ' + key));
    const keyByLabel = name => (stT().keys || []).find(k => classLabel(k) === String(name).trim()) || '';
    const keyOrd = key => { const i = (stT().keys || []).indexOf(key); return i >= 0 ? i : (parseFloat(key) || 0); };
    function groupsOfRow(r) {   // কক্ষের রোল শ্রেণি ধরে আলাদা
        const by = {};
        ((r.data && r.data.columnData) || []).forEach(c => (c.ranges || []).forEach(rg => {
            if (!Array.isArray(rg.rolls) || !rg.rolls.length) return;
            const key = rg.classKey || '';
            const g = by[key] || (by[key] = { key, prefix: rg.prefix || '', set: new Set() });
            rg.rolls.forEach(x => { const v = rollNum(key, x); if (!isNaN(v)) g.set.add(v); });
        }));
        return Object.keys(by).map(k => ({ key: by[k].key, prefix: by[k].prefix, rolls: [...by[k].set] }));
    }
    let posCache = {};
    function posMap(key) {   // শ্রেণির নিজস্ব রোল তালিকার ক্রম: মাঝের রোল না থাকলেও রেঞ্জ ভাঙবে না
        if (!key) return null;
        if (key in posCache) return posCache[key];
        const g = stT().map && stT().map[key];
        let m = null;
        if (g) { m = {}; [...g.rolls].sort((a, b) => a - b).forEach((v, i) => { m[v] = i; }); }
        return (posCache[key] = m);
    }
    function runsOf(rolls, key) {
        const m = posMap(key), out = [];
        let a = null, z = null, zp = null, n = 0;
        rolls.slice().sort((x, y) => x - y).forEach(v => {
            const p = m && m[v] != null ? m[v] : Math.floor(v + 1e-9);
            if (a !== null && p === zp + 1) { z = v; zp = p; n++; }
            else { if (a !== null) out.push({ from: a, to: z, n }); a = z = v; zp = p; n = 1; }
        });
        if (a !== null) out.push({ from: a, to: z, n });
        return out;
    }
    const placeOf = ri => [String(ri.building || '').trim(), ri.floor ? '(' + String(ri.floor).trim() + ')' : ''].filter(Boolean).join(' ');
    const sk = e => e.ord * 1e6 + e.from;   // শ্রেণি → রোল ক্রম

    // সংরক্ষিত কক্ষ → টেবিলের সারি
    function build(rows, shift, sortBy) {
        posCache = {};
        const list = [];
        rows.filter(r => shiftOf(r) === shift).forEach(r => {
            const ri = r.data.roomInfo || {};
            const room = String(ri.roomNumber || '').trim();
            const roomNum = parseInt(en(room), 10) || 0;
            const place = placeOf(ri);
            // প্রথম পছন্দ: "শ্রেণি / শাখা / গ্রুপ নির্বাচন করুন" ঘরে যা বাছা হয়েছে (নাম + শুরু–শেষ রোল) — সিটে ঠিক তাই দেখাবে
            const sel = (r.data.schools || []).filter(x => x && String(x.name || '').trim() && x.startRoll && x.endRoll);
            const gs = groupsOfRow(r);
            if (sel.length) {
                sel.forEach(x => {
                    const key = keyByLabel(x.name), a = Number(x.startRoll), z = Number(x.endRoll);
                    list.push({ label: String(x.name).trim(), ord: key ? keyOrd(key) : 0, from: a, to: z,
                        fromTxt: key ? rollTxt(key, a) : bn(a), toTxt: key ? rollTxt(key, z) : bn(z),
                        n: x.studentCount || (z - a + 1), room, roomNum, place });
                });
            } else if (gs.length) {   // নির্বাচিত ঘর না থাকলে সিটে বসানো রোল (classKey) থেকে
                gs.forEach(g => runsOf(g.rolls, g.key).forEach(rn => list.push({
                    label: classLabel(g.key), ord: keyOrd(g.key), from: rn.from, to: rn.to,
                    fromTxt: rollTxt(g.key, rn.from, g.prefix), toTxt: rollTxt(g.key, rn.to, g.prefix), n: rn.n, room, roomNum, place })));
            }
        });
        // একটি কক্ষের সব শ্রেণি/রেঞ্জ পরপর; কক্ষের ক্রম: কক্ষ নম্বর অথবা কক্ষের সবচেয়ে ছোট (শ্রেণি, রোল) অনুযায়ী
        const groups = {};
        list.forEach(e => { const g = e.room + '|' + e.place; (groups[g] = groups[g] || { min: sk(e), roomNum: e.roomNum, items: [] }); groups[g].min = Math.min(groups[g].min, sk(e)); groups[g].items.push(e); });
        const order = Object.values(groups).sort(sortBy === 'roll' ? (a, b) => a.min - b.min || a.roomNum - b.roomNum : (a, b) => a.roomNum - b.roomNum || a.min - b.min);
        const out = [];
        order.forEach(g => g.items.sort((a, b) => sk(a) - sk(b)).forEach(e => out.push(e)));
        return out;
    }
    const rollText = e => e.fromTxt + (e.to !== e.from ? CFG.sep + e.toTxt : '');

    // ---------- টেবিল HTML (প্রিভিউ ও প্রিন্ট একই) ----------
    function tableHtml(list, o) {
        let zebra = 0, prev = null;
        const total = list.reduce((s, e) => s + e.n, 0);
        const rooms = new Set(list.map(e => e.room)).size;
        const body = list.map((e, i) => {
            const same = prev && prev.room === e.room && prev.place === e.place;
            if (!same) zebra ^= 1;
            let span = 1;
            if (!same) { for (let j = i + 1; j < list.length && list[j].room === e.room && list[j].place === e.place; j++) span++; }
            prev = e;
            return '<tr class="z' + zebra + '">' +
                (o.label ? '<td class="gl-l">' + esc(e.label || '—') + '</td>' : '') +
                '<td class="gl-r">' + esc(rollText(e)) + '</td>' +
                (same ? '' : '<td class="gl-room"' + (span > 1 ? ' rowspan="' + span + '"' : '') + '>' + bn(esc(e.room)) + '</td>' +
                    '<td class="gl-p"' + (span > 1 ? ' rowspan="' + span + '"' : '') + '>' + esc(e.place || '—') + '</td>') +
                (o.count ? '<td class="gl-n">' + bn(e.n) + ' জন</td>' : '') + '</tr>';
        }).join('');
        const cols = 3 + (o.label ? 1 : 0) + (o.count ? 1 : 0);
        return '<table class="gl-tbl"><thead><tr>' + (o.label ? '<th>শ্রেণি</th>' : '') + '<th>রোল নং</th><th>কক্ষ নং</th><th>কক্ষ পরিচিতি</th>' + (o.count ? '<th>পরীক্ষার্থী</th>' : '') + '</tr></thead><tbody>' +
            (body || '<tr><td colspan="' + cols + '" class="gl-empty">এই শিফটে কোনো সংরক্ষিত কক্ষ নেই</td></tr>') + '</tbody>' +
            (list.length ? '<tfoot><tr><td colspan="' + (cols - (o.count ? 1 : 0)) + '">মোট ' + bn(rooms) + 'টি কক্ষ</td>' + (o.count ? '<td class="gl-n">' + bn(total) + ' জন</td>' : '') + '</tr></tfoot>' : '') + '</table>';
    }
    // ---------- অফিসিয়াল প্রিন্ট শিট (সাদা-কালো, সরকারি চিঠির ধাঁচ) ----------
    function officialTable(list, o, exam) {
        let prev = null, serial = 0;
        const total = list.reduce((s, e) => s + e.n, 0);
        let body = '';
        list.forEach((e, i) => {
            const same = prev && prev.room === e.room && prev.place === e.place;
            let span = 1;
            if (!same) { serial++; for (let j = i + 1; j < list.length && list[j].room === e.room && list[j].place === e.place; j++) span++; }
            prev = e;
            const rs = span > 1 ? ' rowspan="' + span + '"' : '';
            if (!same) body += (i ? '</tbody>' : '') + '<tbody class="rg">';
            body += '<tr>' + (same ? '' : '<td class="c"' + rs + '>' + bn(serial) + '</td>') +
                (o.label ? '<td class="l">' + esc(e.label || '—') + '</td>' : '') +
                '<td class="c">' + esc(rollText(e)) + '</td>' +
                (same ? '' : '<td class="c b"' + rs + '>' + bn(esc(e.room)) + '</td><td class="l"' + rs + '>' + esc(e.place || '—') + '</td>') +
                (o.count ? '<td class="c">' + bn(e.n) + '</td>' : '') + '</tr>';
        });
        if (list.length) body += '</tbody>';
        const nc = 4 + (o.label ? 1 : 0);   // ক্রম, (বিদ্যালয়), রোল, কক্ষ নং, কক্ষ পরিচিতি
        return '<table class="gl-ot"><thead><tr class="of-ch"><th style="width:7%">ক্রম</th>' + (o.label ? '<th>শ্রেণি</th>' : '') +
            '<th style="width:30%">রোল নং</th><th style="width:9%">কক্ষ নং</th><th>কক্ষ পরিচিতি</th>' + (o.count ? '<th style="width:11%">পরীক্ষার্থী সংখ্যা</th>' : '') + '</tr></thead>' + body +
            (list.length ? '<tfoot>' + (o.count ? '<tr><td colspan="' + nc + '" class="r">মোট পরীক্ষার্থী:</td><td class="c b">' + bn(total) + '</td></tr>' : '') +
                '<tr class="sg"><td colspan="' + (nc + (o.count ? 1 : 0)) + '" class="sgn"><div class="of-sign"><span>' + esc(CFG.signLeft) + '</span><span>' + esc(CFG.signRight) + '</span></div></td></tr></tfoot>' : '') + '</table>';
    }
    function officialSheet(o, rows, list) {
        const nm = ($('examName') || {}).value || '', yr = ($('examYear') || {}).value || '';
        const exam = [nm, yr ? bn(yr) : ''].filter(Boolean).join(' ');
        const first = rows.find(r => shiftOf(r) === o.shift && r.data && r.data.examStartTime);
        const time = (first && first.data.examStartTime) || '';
        return '<div class="gl-of">' +
            officialTable(list, o, exam) +
            '<div class="of-foot">সিট প্ল্যান সিস্টেম থেকে স্বয়ংক্রিয়ভাবে প্রস্তুত</div></div>';
    }
    function headHtml(o, rows) {
        const nm = ($('examName') || {}).value || '', yr = ($('examYear') || {}).value || '';
        const exam = [nm, yr ? bn(yr) : ''].filter(Boolean).join(' ');
        const first = rows.find(r => shiftOf(r) === o.shift && r.data && r.data.examStartTime);
        const time = o.time || (first && first.data.examStartTime) || '';
        return '<div class="gl-h1">' + esc(CFG.title) + '</div>' +
            (exam ? '<div class="gl-h2">' + esc(exam) + '</div>' : '') +
            '<div class="gl-h3">' + SHN[o.shift] + (time ? ' • শুরু: ' + bn(esc(time)) : '') + (o.date ? ' • তারিখ: ' + bn(esc(o.date)) : '') + '</div>';
    }

        document.head.appendChild(s);

    // ---------- ডায়ালগ ----------
    let rowsAll = [], centerGuess = '';
    async function loadRows() {
        const { api: sbApi, token } = await window.fbReady;
        const list = await sbApi('seatPlanList', token);
        const cr = (Array.isArray(list) ? list : []).find(r => r && r.id === '__center__'), cc = (cr && cr.data && cr.data.center) || {};
        centerGuess = String(cc.name || cc.centerName || cc.title || cc.college || cc.school || '').trim();
        rowsAll = (Array.isArray(list) ? list : []).filter(r => r && r.id && String(r.id).indexOf('__') !== 0 && r.data && r.data.roomInfo);
    }
    async function openGlance() {
        if ($('glDlg')) return;
        const btn = $('glanceBtn'); if (btn) btn.disabled = true;
        try { await loadRows(); }
        catch (e) { if (typeof showAlert === 'function') showAlert('তথ্য আনতে ত্রুটি: ' + e.message, 'error'); if (btn) btn.disabled = false; return; }
        if (btn) btn.disabled = false;
        if (!rowsAll.length) { if (typeof showAlert === 'function') showAlert('কোনো সংরক্ষিত কক্ষ পাওয়া যায়নি!', 'error'); return; }
        injectCss();
        const o = { shift: (window.currentShift && window.currentShift()) === 'noon' ? 'noon' : 'morning', sort: 'room', label: true, count: false, date: '', time: '', center: '', memo: '' };
        try { o.center = localStorage.getItem('glance.center') || ''; } catch (x) {}
        if (!o.center && centerGuess) o.center = centerGuess;
        const ov = document.createElement('div'); ov.id = 'glDlg'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true');
        ov.innerHTML =
            '<div class="gl-card"><div class="gl-top"><span>📋 ' + esc(CFG.title) + '</span><button type="button" class="gl-x" aria-label="বন্ধ করুন">✕</button></div>' +
            '<div class="gl-ctl"><span class="gl-seg" id="glSeg"><button type="button" data-sh="morning">🌅 সকাল</button><button type="button" data-sh="noon">☀️ বিকাল</button></span>' +
            '<label>সাজান: <select id="glSort"><option value="room">কক্ষ নম্বর অনুযায়ী</option><option value="roll">রোল অনুযায়ী (কক্ষ একসাথে)</option></select></label>' +
            '<label><input type="checkbox" id="glLabel" checked> শ্রেণি কলাম</label>' +
            '<label><input type="checkbox" id="glCount"> পরীক্ষার্থী সংখ্যা</label>' +
                        '<label>কেন্দ্রের নাম: <input type="text" id="glCenter" placeholder="প্রতিষ্ঠানের নাম" size="26"></label></div>' +
            '<div class="gl-body"><div class="gl-paper" id="glPaper"></div></div>' +
            '<div class="gl-foot">' +
            '<button type="button" class="gl-btn" id="glReload">🔄 হালনাগাদ</button>' +
            '<button type="button" class="gl-btn pri" id="glPrint">🖨 প্রিন্ট / PDF</button></div></div>';
        document.body.appendChild(ov);

        const view = () => {
            ov.querySelectorAll('#glSeg button').forEach(b => b.classList.toggle('on', b.dataset.sh === o.shift));
            const list = build(rowsAll, o.shift, o.sort);
            $('glPaper').innerHTML = headHtml(o, rowsAll) + tableHtml(list, o);
            return list;
        };
        const close = () => { document.removeEventListener('keydown', onKey); ov.remove(); };
        const onKey = e => { if (e.key === 'Escape') close(); };
        document.addEventListener('keydown', onKey);
        ov.querySelector('.gl-x').onclick = close;
        ov.addEventListener('mousedown', e => { if (e.target === ov) close(); });
        ov.querySelectorAll('#glSeg button').forEach(b => b.onclick = () => { o.shift = b.dataset.sh; view(); });
        $('glSort').onchange = e => { o.sort = e.target.value; view(); };
        $('glLabel').onchange = e => { o.label = e.target.checked; view(); };
        $('glCount').onchange = e => { o.count = e.target.checked; view(); };
        $('glReload').onclick = async () => { try { await loadRows(); view(); } catch (e) { if (typeof showAlert === 'function') showAlert('তথ্য আনতে ত্রুটি: ' + e.message, 'error'); } };
        $('glPrint').onclick = () => {
            const list = build(rowsAll, o.shift, o.sort);
            let sh = $('glSheet'); if (!sh) { sh = document.createElement('div'); sh.id = 'glSheet'; document.body.appendChild(sh); }
            sh.innerHTML = '<div class="gl-sheet">' + officialSheet(o, rowsAll, list) + '</div>';
            // ল্যান্ডস্কেপ: প্রিন্টের মুহূর্তে সাধারণ @page বসে, প্রিন্ট শেষে সরে যায় (আপনার অন্য প্রিন্টে প্রভাব ফেলে না)
            let ps = $('glPageStyle'); if (ps) ps.remove();
            ps = document.createElement('style'); ps.id = 'glPageStyle';
            const cs = t => String(t == null ? '' : t).replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/[\r\n]+/g, ' ');
            const nm = ($('examName') || {}).value || '', yr = ($('examYear') || {}).value || '';
            const exam = [nm, yr ? bn(yr) : ''].filter(Boolean).join(' ');
            const lines = [o.center, exam, CFG.title].filter(Boolean).map(cs);
            ps.textContent = '@page { size: 14in 8.5in; margin: ' + (lines.length > 2 ? '2.3in' : '1.7in') + ' 0.4in 0.4in; ' +
                '@top-center { content: "' + lines.join('\\A ') + '"; white-space: pre-wrap; text-align: center; vertical-align: middle; font-family: SolaimanLipi, Kalpurush, "Noto Serif Bengali", "Hind Siliguri", serif; font-size: 34pt; font-weight: 700; color: #000; } ' +
                '@bottom-center { content: "পৃষ্ঠা " counter(page, bengali); font-size: 14pt; } }';
            document.head.appendChild(ps);
            document.body.classList.add('gl-printing');
            window.addEventListener('afterprint', function done() { document.body.classList.remove('gl-printing'); const x = $('glPageStyle'); if (x) x.remove(); window.removeEventListener('afterprint', done); });
            setTimeout(() => window.print(), 60);
        };
        $('glCenter').value = o.center;
        $('glCenter').oninput = e => { o.center = e.target.value.trim(); try { localStorage.setItem('glance.center', o.center); } catch (x) {} };
        view();
    }
    window.openGlance = openGlance;
    window.__glanceTest = { build, tableHtml, runsOf, rollText };   // শুধু পরীক্ষার জন্য

    // ---------- বাটন: "এডিট"-এর পাশে ----------
    const anchor = $('editPrintBtn');
    if (anchor && !$('glanceBtn')) {
        const b = document.createElement('button');
        b.type = 'button'; b.id = 'glanceBtn'; b.className = 'print-btn no-print';
        b.title = 'সংরক্ষিত কক্ষ থেকে এক নজরে আসন বিন্যাস টেবিল';
        b.textContent = 'এক নজরে';
        b.addEventListener('click', openGlance);
        anchor.insertAdjacentElement('afterend', b);
    }
})();
</script>
<script>
// ===== মূল সিট প্ল্যান: ওপরে "শ্রেণি / শাখা / গ্রুপ নির্বাচন করুন"-এ যা বাছা হবে, সিট অংশের শ্রেণি তালিকায় শুধু তাই দেখাবে =====
(function () {
    const $ = id => document.getElementById(id);
    // ওপরের সারিগুলোতে বাছা শ্রেণির key-সমূহ; কিছুই বাছা না থাকলে null (তখন সব শ্রেণি দেখায়)
    function pickedKeys() {
        const set = new Set();
        document.querySelectorAll('#schoolForms .school-select').forEach(s => {
            const o = s.selectedOptions[0], k = o && o.dataset ? o.dataset.k : '';
            if (s.value && k) set.add(k);
        });
        return set.size ? set : null;
    }
    function apply() {
        const keys = pickedKeys();
        document.querySelectorAll('#columnInputs select.stu-class').forEach(sel => {
            [...sel.options].forEach(o => {
                if (!o.value) return;
                const bad = !!keys && !keys.has(o.value) && !o.selected;   // আগে বাছা থাকলে সেটি থাকবে
                o.hidden = bad; o.disabled = bad;
            });
        });
    }
    let tm = null;
    const sched = () => { clearTimeout(tm); tm = setTimeout(apply, 120); };   // শিফট-ফিল্টারের (৩০ms) পরে চলবে
    const sf = $('schoolForms'), ci = $('columnInputs');
    if (sf) {
        sf.addEventListener('change', sched);
        sf.addEventListener('input', sched);
        new MutationObserver(sched).observe(sf, { childList: true, subtree: true });
    }
    if (ci) new MutationObserver(sched).observe(ci, { childList: true, subtree: true });
    const et = $('examTime'); if (et) et.addEventListener('change', sched);
    const ss = $('stuStatus'); if (ss) new MutationObserver(sched).observe(ss, { childList: true, characterData: true, subtree: true });

    // সাবমিটের আগে: বাছা হয়নি এমন শ্রেণি সিটে থাকলে আটকানো
    const _qv = quickValidation;
    quickValidation = function () {
        const e = _qv(), keys = pickedKeys();
        if (keys) {
            const bad = new Set();
            document.querySelectorAll('#columnInputs select.stu-class').forEach(s => { if (s.value && !keys.has(s.value)) bad.add(s.value); });
            if (bad.size) {
                const lab = k => { const g = window.__stu && window.__stu.st.map[k]; return g ? g.label.replace('শ্রেণি: ', '') : k; };
                e.push('ওপরে নির্বাচন করা হয়নি এমন শ্রেণি সিটে আছে: ' + [...bad].map(lab).join(', '));
            }
        }
        return e;
    };
    sched();
})();
</script>
