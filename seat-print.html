<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>সিট প্লান প্রিন্ট</title>
<style id="pageSize"></style>
<style>
  /* ফন্ট: সোলিমান লিপি (প্রধান), কালপুরুষ (বিকল্প) — সরাসরি CDN থেকে */
  @font-face { font-family:'SolaimanLipi'; src:local('SolaimanLipi'), local('Solaiman Lipi'), url('https://cdn.jsdelivr.net/npm/@hixbe/solaiman-lipi@5.2.5/files/solaiman-lipi.woff2') format('woff2'); font-weight:400; font-display:swap; }
  @font-face { font-family:'Kalpurush'; src:url('https://cdn.jsdelivr.net/npm/@hixbe/kalpurush@5.2.5/files/kalpurush.woff2') format('woff2'); font-weight:400; font-display:swap; }
  :root { --navy:#1D2B4F; --gold:#B9822E; --band:#DCEFDC; --cream:#FFF2CC; --sky:#DDEBF7; }
  * { box-sizing: border-box; }
  body { font-family:'Times New Roman',Times,'SolaimanLipi','Kalpurush','Noto Sans Bengali',serif; margin:0; background:#EEF1F8; color:#000; }

  /* =====================================================
     পর্দার নকশা (UI) — প্রিন্টে এই অংশ দেখাবে না
     ===================================================== */
  :root {
    --ink:#17223B; --ink-soft:#5B6579; --desk:#E3E7EF; --line:#D5DAE4;
    --accent:#1D2B4F; --accent-hover:#27396A; --accent-ink:#fff;
    --focus:#2F6FED; --danger:#B42318; --ok:#1F7A4D;
  }
  body { background:radial-gradient(900px 380px at 50% -120px, #F6F8FC, rgba(246,248,252,0)), var(--desk); }

  /* ---- টুলবার ---- */
  .toolbar { position:sticky; top:0; z-index:20; display:flex; flex-wrap:wrap; align-items:center; gap:10px 18px; padding:10px 18px; background:rgba(255,255,255,.92); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); box-shadow:0 6px 18px rgba(23,34,59,.07); color:var(--ink); font-size:15px; }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand .mark { width:36px; height:36px; border-radius:10px; background:var(--accent); color:#fff; display:grid; place-items:center; flex:none; }
  .brand-text strong { display:block; font-size:16px; line-height:1.25; }
  .brand-text small { display:block; font-size:12px; color:var(--ink-soft); line-height:1.3; }
  .group { display:flex; align-items:flex-end; gap:8px; }
  .group.actions { margin-left:auto; align-items:center; }
  .group.nav { align-items:flex-end; }

  .field { display:flex; flex-direction:column; gap:2px; font-size:11.5px; color:var(--ink-soft); font-weight:500; }
  .field.grow select { min-width:230px; max-width:340px; }
  .toolbar select { font:inherit; font-size:14px; color:var(--ink); padding:7px 28px 7px 10px; min-height:38px; border:1px solid var(--line); border-radius:9px; background:#fff; cursor:pointer; }
  .toolbar select:hover { border-color:#BCC4D3; }

  .toolbar button { font:inherit; font-size:14px; min-height:38px; padding:0 14px; border-radius:9px; border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:background .15s, border-color .15s, transform .1s, box-shadow .15s; white-space:nowrap; }
  .toolbar button:hover:not(:disabled) { background:#F3F5F9; border-color:#C2C9D6; }
  .toolbar button:active:not(:disabled) { transform:translateY(1px); }
  .toolbar button:disabled { opacity:.4; cursor:not-allowed; }
  .toolbar button.icon { width:38px; padding:0; }
  .toolbar button.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:700; box-shadow:0 2px 8px rgba(29,43,79,.25); }
  .toolbar button.primary:hover:not(:disabled) { background:var(--accent-hover); border-color:var(--accent-hover); }
  .toolbar button svg { width:17px; height:17px; flex:none; }
  .toolbar :focus-visible { outline:3px solid var(--focus); outline-offset:2px; }

  .counter { min-width:56px; height:38px; display:inline-flex; align-items:center; justify-content:center; font-size:13px; color:var(--ink-soft); font-variant-numeric:tabular-nums; }

  .seg { display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#fff; }
  .seg button { border:none !important; border-radius:0 !important; min-height:36px !important; }
  .seg button + button { border-left:1px solid var(--line) !important; }
  .badge { min-width:22px; height:22px; padding:0 6px; border-radius:999px; background:#EEF1F8; color:var(--accent); font-size:12.5px; font-weight:700; display:inline-grid; place-items:center; }

  .zoom { display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#fff; }
  .zoom button { border:none !important; border-radius:0 !important; min-height:36px !important; }
  .zoom button + button { border-left:1px solid var(--line) !important; }
  .zoom button.zoom-label { min-width:84px; font-size:13px; font-variant-numeric:tabular-nums; }

  /* ---- খোঁজার ঘর (ছোট, গোল, আধুনিক) ---- */
  .search { position:relative; width:240px; }
  .search label { cursor:text; }
  .search [hidden] { display:none !important; }
  .search-wrap { display:flex; align-items:center; gap:8px; height:38px; padding:0 6px 0 12px; border:1px solid var(--line); border-radius:999px; background:#fff; color:var(--ink-soft); transition:border-color .15s, box-shadow .15s; }
  .search-wrap:hover { border-color:#BCC4D3; }
  .search-wrap:focus-within { border-color:var(--focus); box-shadow:0 0 0 3px rgba(47,111,237,.18); color:var(--ink); }
  .search-wrap > svg { width:16px; height:16px; flex:none; }
  .search-wrap input { flex:1; min-width:0; height:100%; padding:0; border:none; outline:none; background:transparent; font:inherit; font-size:14px; color:var(--ink); }
  .search-wrap input::placeholder { color:#8B94A7; }
  .search-wrap input:disabled { cursor:progress; }
  .search-kbd { font:inherit; font-size:12px; line-height:1; padding:3px 7px; margin-right:4px; border:1px solid var(--line); border-bottom-width:2px; border-radius:6px; color:var(--ink-soft); background:#F6F8FC; }
  .search-wrap:focus-within .search-kbd { display:none; }
  .toolbar button.search-clear { width:26px; height:26px; min-height:26px; padding:0; border:none; border-radius:50%; background:#EEF1F8; color:var(--ink-soft); }
  .toolbar button.search-clear:hover:not(:disabled) { background:#E1E6F0; }
  .toolbar button.search-clear svg { width:13px; height:13px; }
  .search-results { position:absolute; top:calc(100% + 6px); left:0; width:max(100%, 330px); max-height:340px; overflow:auto; padding:6px; background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:0 16px 40px rgba(23,34,59,.18); z-index:30; }
  .sr-item { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:10px; cursor:pointer; }
  .sr-item:hover, .sr-item.active { background:#EEF3FF; }
  .sr-num { flex:none; min-width:42px; height:34px; padding:0 8px; display:grid; place-items:center; border-radius:9px; background:var(--accent); color:#fff; font-weight:700; font-size:15px; }
  .sr-item.current .sr-num { background:var(--ok); }
  .sr-body { min-width:0; flex:1; }
  .sr-title, .sr-sub { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sr-title { font-size:14px; color:var(--ink); }
  .sr-sub { font-size:12px; color:var(--ink-soft); }
  .sr-tag { flex:none; font-size:11.5px; padding:2px 8px; border-radius:999px; background:#E6F4EC; color:var(--ok); }
  .sr-empty { padding:14px 12px; text-align:center; font-size:13.5px; color:var(--ink-soft); }

  /* ---- এডিট ডায়ালগ ---- */
  dialog.dlg { width:min(900px, calc(100% - 24px)); max-height:min(90vh, 780px); padding:0; border:none; border-radius:18px; background:#fff; color:var(--ink); font-size:15px; box-shadow:0 30px 80px rgba(23,34,59,.35); overflow:hidden; }
  dialog.dlg[open] { display:flex; flex-direction:column; }
  dialog.dlg::backdrop { background:rgba(23,34,59,.5); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); }
  .dlg form { display:flex; flex-direction:column; flex:1; min-height:0; margin:0; }
  .dlg-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:18px 22px 10px; }
  .dlg-head h2 { margin:0; font-size:19px; }
  .dlg-head p { margin:2px 0 0; font-size:13px; color:var(--ink-soft); }
  .dlg-x { width:34px; height:34px; flex:none; border-radius:50%; border:none; background:#EEF1F8; color:var(--ink-soft); cursor:pointer; display:grid; place-items:center; padding:0; }
  .dlg-x:hover { background:#E1E6F0; }
  .dlg-x svg { width:16px; height:16px; }
  .tabs { display:flex; gap:6px; padding:0 22px 12px; border-bottom:1px solid var(--line); overflow-x:auto; }
  .tabs button { font:inherit; font-size:14px; padding:7px 15px; border-radius:999px; border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer; white-space:nowrap; }
  .tabs button:hover { background:#F3F5F9; }
  .tabs button[aria-selected="true"] { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }
  .dlg-body { flex:1; min-height:0; overflow:auto; padding:16px 22px; }
  .pane[hidden] { display:none; }
  .fg { display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:12px 14px; }
  .fl { display:flex; flex-direction:column; gap:4px; font-size:12.5px; color:var(--ink-soft); font-weight:500; }
  .dlg input, .dlg select { font:inherit; font-size:14.5px; color:var(--ink); height:38px; width:100%; min-width:0; padding:0 11px; border:1px solid var(--line); border-radius:9px; background:#fff; }
  .dlg select { cursor:pointer; }
  .dlg input:hover, .dlg select:hover { border-color:#BCC4D3; }
  .dlg input:focus-visible, .dlg select:focus-visible { outline:none; border-color:var(--focus); box-shadow:0 0 0 3px rgba(47,111,237,.18); }
  .hint { margin:12px 0 0; font-size:12.5px; color:var(--ink-soft); line-height:1.6; }
  .rows { display:flex; flex-direction:column; gap:8px; }
  .rh, .rw { display:grid; gap:8px; align-items:center; }
  .rh { font-size:12px; color:var(--ink-soft); padding:0 2px; }
  .rh.sch, .rw.sch { grid-template-columns:minmax(0,2.6fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 34px; }
  .rw.rg { grid-template-columns:minmax(0,1fr) minmax(0,1fr) 34px; }
  .ix { width:34px; height:34px; padding:0; border-radius:9px; border:1px solid var(--line); background:#fff; color:var(--danger); cursor:pointer; display:grid; place-items:center; }
  .ix:hover { background:#FFF1F0; border-color:#F4C7C3; }
  .ix svg { width:15px; height:15px; }
  .btn { font:inherit; font-size:14px; min-height:38px; padding:0 16px; border-radius:9px; border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; text-decoration:none; white-space:nowrap; transition:background .15s, border-color .15s; }
  .btn:hover:not(:disabled) { background:#F3F5F9; border-color:#C2C9D6; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }
  .btn.primary:hover:not(:disabled) { background:var(--accent-hover); border-color:var(--accent-hover); }
  .btn.ghost { border-style:dashed; background:transparent; color:var(--accent); }
  .btn.sm { min-height:32px; font-size:13px; padding:0 12px; }
  .btn:disabled { opacity:.6; cursor:progress; }
  .rows > .btn, .col > .btn, .pane > .btn { align-self:flex-start; }
  .btn:focus-visible, .ix:focus-visible, .dlg-x:focus-visible, .tabs button:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
  .total-fl { max-width:260px; margin-top:14px; }
  .cols { display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:12px; margin-top:12px; }
  .col { display:flex; flex-direction:column; gap:8px; padding:10px; border:1px solid var(--line); border-radius:12px; background:#FAFBFD; }
  .col-h { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13.5px; }
  .col-h span { color:var(--ink-soft); font-size:12px; }
  .col-h .pill { margin-left:auto; padding:2px 9px; border-radius:999px; background:#EEF1F8; color:var(--accent); font-weight:700; }
  .dlg-err { margin:0; color:var(--danger); font-size:13.5px; }
  .dlg-err:not(:empty) { padding:10px 22px 0; }
  .dlg-foot { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:14px 22px; border-top:1px solid var(--line); background:#FAFBFD; }
  .dlg-note { flex:1 1 220px; font-size:12px; color:var(--ink-soft); line-height:1.5; }
  @media (max-width:640px) {
    dialog.dlg { width:calc(100% - 12px); max-height:94vh; border-radius:14px; }
    .dlg-head, .tabs, .dlg-body, .dlg-foot { padding-left:14px; padding-right:14px; }
    .dlg-err:not(:empty) { padding-left:14px; padding-right:14px; }
    .rh { display:none; }
    .rw.sch { grid-template-columns:1fr 1fr 1fr 34px; }
    .rw.sch input:first-child { grid-column:1 / -1; }
  }

  /* ---- টুলবার: সব এক লাইনে (বড় পর্দায়) ---- */
  .toolbar { flex-wrap:nowrap; gap:8px; padding:8px 14px; }
  .toolbar .group, .toolbar .search { flex:none; }
  .group, .group.actions, .group.nav { align-items:center; gap:6px; }
  .group.actions { margin-left:auto; }
  .brand .mark { width:34px; height:34px; }
  .toolbar select.room-sel { width:170px; text-overflow:ellipsis; }
  .toolbar #paperSelect { width:88px; padding-right:24px; }
  .search { width:150px; }
  .search-kbd { display:none; }
  .counter { min-width:44px; }
  .zoom button.zoom-label { min-width:70px; }
  .toolbar button { padding:0 11px; gap:6px; }
  .toolbar button.icon { width:38px; padding:0; }
  .seg button { padding:0 10px !important; gap:5px; }
  @media (max-width:1230px) {
    .toolbar { flex-wrap:wrap; }
    .group.actions { margin-left:0; }
  }

  /* ---- বর্তমান কক্ষের তথ্য-পট্টি ---- */
  .statusbar { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; padding:12px 16px 0; }
  .statusbar[hidden] { display:none; }
  .chip { padding:4px 12px; border-radius:999px; background:#fff; border:1px solid var(--line); font-size:13px; color:var(--ink); font-family:'SolaimanLipi','Kalpurush','Noto Sans Bengali',sans-serif; }
  .chip.accent { background:var(--accent); border-color:var(--accent); color:#fff; }

  /* ---- লোড / ত্রুটি / খালি অবস্থা ---- */
  #msg { max-width:440px; margin:70px auto; padding:28px 24px; text-align:center; background:#fff; border:1px solid var(--line); border-radius:16px; color:var(--ink-soft); box-shadow:0 10px 30px rgba(23,34,59,.08); line-height:1.6; }
  #msg.loading::before { content:""; display:block; width:28px; height:28px; margin:0 auto 14px; border:3px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin .9s linear infinite; }
  #msg.error { border-color:#F4C7C3; background:#FFF8F7; color:var(--danger); }
  #msg .msg-title { display:block; font-size:18px; font-weight:700; color:var(--ink); margin-bottom:4px; }
  #msg.error .msg-title { color:var(--danger); }
  #msg .msg-btn { display:inline-block; margin-top:16px; padding:9px 18px; border-radius:9px; border:none; background:var(--accent); color:#fff; font:inherit; font-size:14px; font-weight:700; text-decoration:none; cursor:pointer; }
  #msg .msg-btn:hover { background:var(--accent-hover); }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* ---- টোস্ট বার্তা ---- */
  .toast { position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px); opacity:0; pointer-events:none; z-index:50; background:#17223B; color:#fff; padding:11px 20px; border-radius:12px; font-size:14px; box-shadow:0 10px 30px rgba(23,34,59,.3); transition:opacity .2s, transform .2s; max-width:calc(100% - 32px); text-align:center; }
  .toast.show { opacity:1; transform:translate(-50%,0); }

  @media (prefers-reduced-motion:reduce) {
    #msg.loading::before { animation:none; }
    .toast, .toolbar button { transition:none; }
  }
  @media (max-width:900px) { .group.actions { margin-left:0; } }
  @media (max-width:720px) {
    .toolbar { padding:10px 12px; gap:10px 12px; }
    .brand, .group.nav { width:100%; }
    .group.nav .field.grow { flex:1; }
    .field.grow select { min-width:0; max-width:none; width:100%; }
    .group { flex-wrap:wrap; }
    .group.actions { width:100%; }
    .group.actions .primary { flex:1; }
    .zoom { display:none; }
    .search { width:100%; }
    .search-kbd { display:none; }
    .search-results { width:100%; }
  }

  /* =====================================================
     ছাপার পাতা (আগের মতোই — Legal 8.5in x 14in)
     ===================================================== */
  .page { background:#fff; width:var(--pw,8.5in); min-height:var(--ph,14in); margin:16px auto; padding:0.18in 0.3in; box-shadow:0 1px 2px rgba(23,34,59,.10), 0 10px 30px rgba(23,34,59,.14); border-radius:2px; page-break-after:always; }
  .page.hidden { display:none; }
  .page { line-height:1.05; }

  .h1 { text-align:center; font-size:32pt; font-weight:700; margin:0 0 2pt; line-height:1.05; }
  .h2 { text-align:center; font-size:21pt; font-weight:500; margin:0; line-height:1.1; }
  .row-between { display:flex; justify-content:space-between; font-size:19pt; font-weight:700; border-bottom:2.5pt solid #000; padding:2pt 0 1pt; margin-top:3pt; line-height:1.05; }
  .venue { font-size:29pt; font-weight:700; margin:2pt 0 2pt; line-height:1.05; }

  /* ---- আসন পরিকল্পনা: শিরোনাম-ট্যাব + তথ্য-ছক + ভবন-ফিতা ---- */
  .plan-title { width:44%; margin:0 auto; text-align:center; background:var(--navy); color:#fff; border:1.6pt solid var(--navy); border-bottom:none; border-radius:12px 12px 0 0; font-size:27pt; font-weight:700; letter-spacing:.6pt; padding:0 0 1pt; line-height:1.05; position:relative; }
  .plan-title::before, .plan-title::after { content:""; position:absolute; top:50%; width:7pt; height:7pt; background:var(--gold-bright,#D6A24E); transform:translateY(-50%) rotate(45deg); }
  .plan-title::before { left:14pt; }
  .plan-title::after { right:14pt; }
  table.info { width:100%; border-collapse:separate; border-spacing:0; border:1.6pt solid var(--navy); border-radius:10px; overflow:hidden; background:#fff; }
  table.info td { padding:0 10pt; line-height:1.05; vertical-align:middle; }
  table.info td.side { width:35%; background:#F4F7FC; }
  table.info tr:first-child td.side { border-bottom:1pt solid #C9D2E3; }
  table.info td.side:first-child { border-right:1pt solid #C9D2E3; }
  table.info td.side:last-child { border-left:1pt solid #C9D2E3; }
  table.info .kv { display:flex; align-items:baseline; justify-content:space-between; gap:6pt; line-height:1.05; }
  table.info .k { font-size:16pt; font-weight:500; color:#4A5670; white-space:nowrap; }
  table.info .v { font-size:21pt; font-weight:700; color:var(--navy); text-align:right; }
  table.info .v em { font-style:normal; font-size:15pt; font-weight:600; color:#4A5670; }
  table.info td.mid { width:30%; text-align:center; background:var(--navy); color:#fff; padding:0 6pt; }
  table.info td.mid .k { display:block; font-size:14pt; font-weight:500; color:var(--gold-soft,#F1E2C3); letter-spacing:.4pt; }
  table.info td.mid .dir { display:block; font-size:28pt; font-weight:700; line-height:1.05; }
  .building { width:44%; margin:0 auto; text-align:center; background:var(--gold-soft,#F1E2C3); color:var(--navy); border:1.6pt solid var(--navy); border-top:none; border-radius:0 0 12px 12px; font-size:19pt; font-weight:700; padding:0 6pt 1pt; line-height:1.05; }

  table.sch { width:100%; border-collapse:collapse; margin-top:3pt; }
  table.sch th { font-size:24pt; font-weight:700; padding:1pt 4pt; line-height:1.05; border-bottom:2.5pt solid #000; }
  table.sch td { font-size:18pt; padding:0 4pt; height:7.5mm; line-height:1.05; border-bottom:1px solid #000; }
  table.sch tr.alt td { background:#F2F2F2; }
  table.sch td.name { text-align:left; }
  table.sch td.roll { text-align:center; font-weight:700; font-size:21pt; font-family:'Times New Roman',Times,serif; }
  table.sch td.cnt { text-align:right; font-weight:600; font-size:19pt; }
  table.sch tr { page-break-inside:avoid; }
  table.sch th:nth-child(1) { text-align:left; }
  table.sch th:nth-child(2) { text-align:center; }
  table.sch th:nth-child(3) { text-align:right; }

  .total { background:var(--band); text-align:right; font-weight:700; font-size:25pt; padding:0 8pt; margin-top:2pt; line-height:1.1; }

  /* ---- সিটের ছক: কাঠের বেঞ্চ (প্রতি জোড়া সিট = একটি বেঞ্চ) ---- */
  table.seat { width:100%; border-collapse:separate; border-spacing:0 1.4mm; table-layout:fixed; margin-top:0; }
  table.seat tr { page-break-inside:avoid; }
  table.seat td {
    position:relative; height:10mm; padding:0 3pt; vertical-align:middle; text-align:center;
    font-family:'Times New Roman',Times,serif; font-weight:700; font-size:25pt; line-height:1; white-space:nowrap;
    color:#2B1606;
    /* কাঠের দাগ + কাঠের রং */
    background:
      repeating-linear-gradient(180deg, rgba(90,50,15,.18) 0 1px, transparent 1px 3mm),
      linear-gradient(180deg,#E6BC82 0%,#D3A05F 55%,#C08A4A 100%);
    border:1.6pt solid #4A2A0C;
    border-bottom:4.5pt solid #4A2A0C;           /* তক্তার সামনের মোটা ধার */
    box-shadow:inset 0 2pt 0 rgba(255,255,255,.35);
  }
  /* একটি সারি ছাড়া একটি সারিতে একটু গাঢ় কাঠ */
  table.seat tr.even td:not(.g):not(.blank):not(.door) {
    background:
      repeating-linear-gradient(180deg, rgba(90,50,15,.18) 0 1px, transparent 1px 3mm),
      linear-gradient(180deg,#D9AC70 0%,#C79350 55%,#B37D3F 100%);
  }
  /* বাঁ সিট: বাঁ কোণা গোল + মাঝে ভাগ-রেখা */
  table.seat td.l  { border-right:1.4pt solid #4A2A0C; border-radius:7px 0 0 7px; }
  /* ডান সিট: ডান কোণা গোল */
  table.seat td.rt { border-left:none; border-radius:0 7px 7px 0; }
  /* পায়া: বেঞ্চের দুই প্রান্তে */
  table.seat td.l::after,
  table.seat td.rt::after { content:""; position:absolute; top:100%; width:3.2mm; height:1mm; background:#4A2A0C; border-radius:0 0 2px 2px; }
  table.seat td.l::after  { left:9%; }
  table.seat td.rt::after { right:9%; }
  /* জোড়ার মাঝের পথ */
  table.seat td.g { width:14pt; border:none; background:transparent !important; box-shadow:none; padding:0; }
  table.seat td.g::after { display:none; }
  /* ফাঁকা সিট */
  table.seat td.blank { background:#F1E9DC !important; border-color:#9C8B73; border-bottom-width:3pt; border-style:dashed; box-shadow:none; }
  table.seat td.blank::after { background:#9C8B73; }
  /* ২ কলামে বেঞ্চ বড় */
  table.seat.two td { height:13.5mm; font-size:32pt; }
  table.seat.two td.g { width:auto; }
  /* DOOR */
  table.seat td.door { vertical-align:middle; padding:0; background:var(--navy) !important; color:#fff; font-family:'Times New Roman',Times,serif; font-size:19pt; text-align:center; letter-spacing:.5pt; border:none; border-radius:7px; box-shadow:none; }
  table.seat td.door::after { display:none; }
  table.seat.two td.door { font-size:26pt; }

  /* কাগজের মাপ টুলবারের ড্রপডাউন থেকে JS দিয়ে বসে (উপরের #pageSize স্টাইল) */
  @media print {
    body { background:#fff; }
    .toolbar, .statusbar, #msg, .toast, dialog { display:none !important; }
    .page { margin:0; box-shadow:none; width:auto; min-height:auto; padding:0.18in 0.3in; }
    .page.hidden { display:none !important; }
    .page[data-last] { page-break-after:auto; }
    * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
</style>
</head>

<script type="module">
// ===== Supabase (হাবের একই সার্ভার ফাংশন) =====
const API_URL  = "https://xemvwhqqpbxsdkqcscrg.supabase.co/functions/v1/attendance";
const ANON_KEY = "sb_publishable_Ecayyqfsteeio6zjLzHAZw_F6I3h_F0";
(function () {   // হাব থেকে ?token=... নিয়ে এসেছে — সেশনে রেখে URL পরিষ্কার করা
  try {
    const u = new URL(location.href), t = u.searchParams.get("token");
    if (t) { sessionStorage.setItem("app_token", t); u.searchParams.delete("token"); history.replaceState(null, "", u.pathname + (u.search || "") + u.hash); }
  } catch (e) {}
})();
let TOKEN = ""; try { TOKEN = sessionStorage.getItem("app_token") || ""; } catch (e) {}
async function api(fn, ...args) {
  const h = { "Content-Type": "application/json" };
  if (ANON_KEY) { h.apikey = ANON_KEY; if (/^eyJ/.test(ANON_KEY)) h.Authorization = "Bearer " + ANON_KEY; }
  let r, j;
  try { r = await fetch(API_URL, { method: "POST", headers: h, body: JSON.stringify({ fn, args }) }); j = await r.json(); }
  catch (e) { throw new Error("সার্ভারে পৌঁছানো যায়নি। ইন্টারনেট ও সার্ভার ফাংশন দেখুন।"); }
  if (!j.ok) {
    if (j.error === "SESSION_EXPIRED") { try { sessionStorage.removeItem("app_token"); } catch (e) {} location.href = "index.html"; throw new Error("সেশনের মেয়াদ শেষ। আবার লগইন করুন।"); }
    throw new Error(j.error || "অজানা সমস্যা।");
  }
  return j.data;
}

// ===== পরিবর্তনযোগ্য কেন্দ্রের তথ্য =====
const CENTER = {
  exam: 'এস.এস.সি পরীক্ষা - ২০২৬',
  name: 'পরীক্ষা কেন্দ্র - কাশিয়ানী',
  school: '(কাশিয়ানী গিরীশ চন্দ্র পাইলট উচ্চ বিদ্যালয়)',
  place: 'কাশিয়ানী, গোপালগঞ্জ।',
  code: '৩৩৩',
  mobile: '০১৭১৫২২২৫৮৬',
  venue: 'কাশিয়ানী গিরীশ চন্দ্র পাইলট উচ্চ বিদ্যালয়'
};

// এডিট করা কেন্দ্রের তথ্য (এই ব্রাউজারে সংরক্ষিত) থাকলে সেটি ডিফল্টের উপর বসবে
const CENTER_DEFAULT = { ...CENTER };
try {
  const savedCenter = JSON.parse(localStorage.getItem('centerInfo') || '{}');
  Object.keys(CENTER_DEFAULT).forEach(k => { if (typeof savedCenter[k] === 'string') CENTER[k] = savedCenter[k]; });
} catch (_) {}

// সিটের কলামের ক্রম (seat-plan.html-এর সাথে একই): দুটি করে জোড়া
const COLUMNS = ['C','D','F','G','I','J'];


const bn = n => String(n).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ms = p => { const v = p.updatedAt; if (!v) return 0; if (typeof v === 'number') return v; const t = Date.parse(v); return isNaN(t) ? 0 : t; };
const floorText = f => { const t = String(f || '').trim(); return t === 'নিচতলা' ? 'নিচ তলা' : t; };

// ---- পেজের অবস্থা (state) ----
let plans = [];
let currentPaper = 'legal';
let zoomMode = 'fit';      // 'fit' = স্ক্রিন অনুযায়ী স্বয়ংক্রিয়, 'manual' = হাতে ঠিক করা
let zoomVal = 1;
const ZSTEP = 0.1, ZMIN = 0.4, ZMAX = 1.6;

const $ = id => document.getElementById(id);
const roomSel = $('roomSelect');


// ---- টোস্ট বার্তা ----
let toastTimer;
function toast(text) {
  const t = $('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

// ---- কাগজের মাপ (পছন্দমতো) ----
const PAPERS = { legal:['8.5in','14in'], a4:['210mm','297mm'], letter:['8.5in','11in'], folio:['8.5in','13in'] };
function applyPaper(key) {
  currentPaper = PAPERS[key] ? key : 'legal';
  const [w, h] = PAPERS[currentPaper];
  document.documentElement.style.setProperty('--pw', w);
  document.documentElement.style.setProperty('--ph', h);
  $('pageSize').textContent = `@page { size:${w} ${h}; margin:0; }`;
}
(function initPaper() {
  const sel = $('paperSelect');
  let saved = 'legal';
  try { saved = localStorage.getItem('paperSize') || 'legal'; } catch (_) {}
  if (!PAPERS[saved]) saved = 'legal';
  sel.value = saved;
  applyPaper(saved);
  sel.addEventListener('change', () => {
    applyPaper(sel.value);
    fitPages();
    try { localStorage.setItem('paperSize', sel.value); } catch (_) {}
  });
})();

// ---- জুম: ফিট (স্বয়ংক্রিয়) বা হাতে ঠিক করা (প্রিন্টে বন্ধ থাকে) ----
function pageWidthPx() {
  const w = PAPERS[currentPaper][0];
  const n = parseFloat(w);
  return w.endsWith('mm') ? n * 3.7795 : n * 96;
}
function currentZoom() {
  return zoomMode === 'fit' ? Math.min(1, (window.innerWidth - 24) / pageWidthPx()) : zoomVal;
}
function fitPages() {
  const z = currentZoom();
  document.querySelectorAll('.page').forEach(p => { p.style.zoom = z === 1 ? '' : z; });
  $('zoomLabel').textContent = zoomMode === 'fit' ? 'ফিট ' + bn(Math.round(z * 100)) + '%' : bn(Math.round(z * 100)) + '%';
}
function setZoom(v) {
  zoomMode = 'manual';
  zoomVal = Math.round(Math.min(ZMAX, Math.max(ZMIN, v)) * 100) / 100;
  fitPages();
}
$('zoomIn').addEventListener('click', () => setZoom(currentZoom() + ZSTEP));
$('zoomOut').addEventListener('click', () => setZoom(currentZoom() - ZSTEP));
$('zoomLabel').addEventListener('click', () => { zoomMode = 'fit'; fitPages(); });

window.addEventListener('resize', fitPages);
// প্রিন্টের ঠিক আগে প্রতিটি পাতা মেপে কাগজের এক পাতায় আঁটিয়ে দেয় (বেঞ্চ বেশি হলে একটু ছোট হয়, কাটে না)
function fitForPrint() {
  const hStr = PAPERS[currentPaper][1], hv = parseFloat(hStr);
  const H = hStr.endsWith('mm') ? hv * 3.7795 : hv * 96;
  const avail = H - 0.08 * 96;                       // নিচে সামান্য নিরাপদ ফাঁক
  let lastVisible = null, minZ = 1;
  document.querySelectorAll('.page').forEach(p => {
    const wasHidden = p.classList.contains('hidden');
    p.style.zoom = ''; p.removeAttribute('data-last');
    if (wasHidden) p.classList.remove('hidden');
    const prevMin = p.style.minHeight; p.style.minHeight = '0';
    const need = p.scrollHeight;                     // বিষয়বস্তু + উপর-নিচের প্যাডিং
    p.style.minHeight = prevMin;
    if (wasHidden) p.classList.add('hidden'); else lastVisible = p;
    const z = need > 0 ? Math.min(1, avail / need) : 1;
    p.style.zoom = z < 1 ? String(Math.floor(z * 1000) / 1000) : '';
    if (!wasHidden) minZ = Math.min(minZ, z);
  });
  if (lastVisible) lastVisible.setAttribute('data-last', '1');   // শেষ পাতার পরে ফাঁকা পাতা আটকাতে
  window.__printScale = minZ;
}
window.addEventListener('beforeprint', fitForPrint);
window.addEventListener('afterprint', fitPages);

// ---- মেসেজ কার্ড (ত্রুটি / খালি অবস্থা) ----
function showMsg(kind, title, text, btnHtml) {
  const m = $('msg');
  m.style.display = '';
  m.className = kind;
  m.innerHTML = `<span class="msg-title">${esc(title)}</span>${esc(text)}${btnHtml ? '<br>' + btnHtml : ''}`;
}

(async () => {
  if (!TOKEN) { location.href = 'index.html'; return; }
  try {
    const me = await api('whoAmI', TOKEN);
    if (!me.isAdmin) { alert('সিট প্ল্যান শুধু অ্যাডমিনের জন্য।'); location.href = 'index.html'; return; }
    await loadPlans();
  } catch (err) {
    console.error(err);
    showMsg('error', 'ডেটা লোড করা যায়নি', err.message || 'অজানা ত্রুটি',
      '<button class="msg-btn" onclick="location.reload()">আবার চেষ্টা করুন</button>');
  }
})();

async function loadPlans() {
  const rows = await api('seatPlanList', TOKEN);
  plans = (Array.isArray(rows) ? rows : []).map(r => ({ ...(r.data || {}), id: r.id, updatedAt: r.updatedAt || null }));

  if (plans.length === 0) {
    showMsg('', 'কোনো সিট প্লান পাওয়া যায়নি', 'সিট প্লান পেজে গিয়ে আগে সাবমিট করুন।',
      '<a class="msg-btn" href="seat-plan.html">সিট প্লান পেজে যান</a>');
    return;
  }

  // সবচেয়ে সাম্প্রতিক সাবমিট করা কক্ষটি ডিফল্ট
  const latestId = [...plans].sort((a, b) => ms(b) - ms(a))[0].id;

  plans.sort((a, b) => String(a.roomInfo?.roomNumber || '').localeCompare(String(b.roomInfo?.roomNumber || ''), 'bn', { numeric: true }));
  $('msg').style.display = 'none';

  roomSel.innerHTML = plans.map(p => {
    const r = p.roomInfo || {};
    return `<option value="${esc(p.id)}">কক্ষ ${esc(r.roomNumber)} — ${esc(r.building)} (${esc(floorText(r.floor))})</option>`;
  }).join('');
  roomSel.addEventListener('change', () => showOne(roomSel.value));

  $('sheets').innerHTML = plans.map(renderPlan).join('');
  $('cntTwo').textContent = bn(document.querySelectorAll('.page.two').length);
  $('cntThree').textContent = bn(document.querySelectorAll('.page.three').length);
  $('cntAll').textContent = bn(plans.length);
  sInput.disabled = false;
  sInput.placeholder = 'কক্ষ, রোল বা স্কুল';
  $('btnEdit').disabled = false;

  const wanted = new URLSearchParams(location.search).get('room');
  const start = plans.find(p => p.id === wanted) ? wanted : latestId;
  showOne(start);
  fitPages();

  // সিট প্লান পেজের "এডিট করুন" বোতাম থেকে এলে (?room=...&edit=1) সরাসরি এডিট ডায়ালগ খুলবে
  const sp = new URLSearchParams(location.search);
  if (sp.get('edit') === '1') {
    try { history.replaceState(null, '', location.pathname + (wanted ? '?room=' + encodeURIComponent(wanted) : '')); } catch (_) {}
    if (plans.find(p => p.id === wanted)) openEdit('room');
    else toast('এই কক্ষটি এখনো সাবমিট করা হয়নি। আগে সিট প্লান পেজে সাবমিট করুন।');
  }
}

// ---- একটি কক্ষ দেখানো + নেভিগেশন ও তথ্য-পট্টি হালনাগাদ ----
function showOne(id) {
  const pages = [...document.querySelectorAll('.page')];
  pages.forEach(p => p.classList.toggle('hidden', p.dataset.id !== id));

  const i = plans.findIndex(p => p.id === id);
  if (i < 0) return;
  const r = plans[i].roomInfo || {};
  const page = pages.find(p => p.dataset.id === id);
  const isTwo = !!page && page.classList.contains('two');

  roomSel.value = id;
  $('roomCounter').textContent = bn(i + 1) + ' / ' + bn(plans.length);
  $('btnPrev').disabled = i === 0;
  $('btnNext').disabled = i === plans.length - 1;

  const bar = $('statusbar');
  bar.hidden = false;
  bar.innerHTML =
    `<span class="chip accent">${isTwo ? '২ কলাম' : '৩ কলাম'}</span>` +
    `<span class="chip">কক্ষ ${esc(bn(r.roomNumber))}${r.gender ? ' (' + esc(r.gender) + ')' : ''}</span>` +
    `<span class="chip">${esc(r.building)} (${esc(floorText(r.floor))})</span>` +
    `<span class="chip">বেঞ্চ ${bn(r.benchCount || 0)} খানা</span>` +
    `<span class="chip">পরীক্ষার্থী ${bn(plans[i].totals?.totalStudents || 0)} জন</span>`;
}
function step(d) {
  const i = plans.findIndex(p => p.id === roomSel.value) + d;
  if (i >= 0 && i < plans.length) { showOne(plans[i].id); window.scrollTo({ top: 0 }); }
}
$('btnPrev').addEventListener('click', () => step(-1));
$('btnNext').addEventListener('click', () => step(1));
// কিবোর্ডের ← → চাপলে আগের/পরের কক্ষ
document.addEventListener('keydown', e => {
  if (e.target.matches && e.target.matches('select, input, textarea')) return;
  if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === 'ArrowRight') step(1);
});

// ---- খোঁজার ঘর: কক্ষ নম্বর / রোল / ভবন / স্কুলের নাম দিয়ে কক্ষ খোঁজা ----
const bnToEn = s => String(s ?? '').replace(/[০-৯]/g, d => '০১২৩৪৫৬৭৮৯'.indexOf(d));
const normQ = s => bnToEn(s).toLowerCase().replace(/\s+/g, ' ').trim();
const sInput = $('searchInput'), sClear = $('searchClear'), sList = $('searchResults');
let sHits = [], sActive = -1;

function searchPlans(raw) {
  const q = normQ(raw);
  if (!q) return [];
  const isNum = /^\d+$/.test(q);
  const hits = [];
  plans.forEach((p, idx) => {
    const r = p.roomInfo || {};
    let score = 0, reason = '';
    const best = (s, why) => { if (s > score) { score = s; reason = why; } };

    const roomNo = normQ(r.roomNumber);
    if (roomNo === q) best(100, 'কক্ষ নম্বর মিলেছে');
    else if (isNum && roomNo.startsWith(q)) best(70, 'কক্ষ নম্বর');

    if (isNum) {
      const roll = Number(q);
      (p.schools || []).forEach(s => {
        if (roll >= Number(s.startRoll) && roll <= Number(s.endRoll)) best(90, 'রোল ' + bn(roll) + ' — ' + (s.name || ''));
      });
    } else {
      [['ভবন', r.building], ['তলা', floorText(r.floor)], ['বিভাগ', r.department], ['দিক', r.direction], ['ধরন', r.gender]]
        .forEach(([label, val]) => { if (val && normQ(val).includes(q)) best(60, label + ': ' + val); });
      (p.schools || []).forEach(s => { if (s.name && normQ(s.name).includes(q)) best(55, 'শ্রেণি: ' + s.name); });
    }
    if (score) hits.push({ p, idx, score, reason });
  });
  hits.sort((a, b) => b.score - a.score || a.idx - b.idx);
  return hits.slice(0, 8);
}

function closeList() {
  sList.hidden = true;
  sInput.setAttribute('aria-expanded', 'false');
  sInput.removeAttribute('aria-activedescendant');
  sHits = []; sActive = -1;
}
function setActive(i) {
  sActive = i;
  sList.querySelectorAll('.sr-item').forEach((el, k) => {
    el.classList.toggle('active', k === i);
    el.setAttribute('aria-selected', k === i ? 'true' : 'false');
    if (k === i) { sInput.setAttribute('aria-activedescendant', el.id); el.scrollIntoView({ block: 'nearest' }); }
  });
}
function renderHits(raw) {
  if (!normQ(raw)) { closeList(); return; }
  sHits = searchPlans(raw);
  sActive = sHits.length ? 0 : -1;
  if (!sHits.length) {
    sList.innerHTML = '<div class="sr-empty">“' + esc(raw.trim()) + '” দিয়ে কিছু পাওয়া যায়নি</div>';
  } else {
    sList.innerHTML = sHits.map((h, i) => {
      const r = h.p.roomInfo || {};
      const cur = h.p.id === roomSel.value;
      return '<div class="sr-item' + (i === 0 ? ' active' : '') + (cur ? ' current' : '') + '" id="sr-' + i + '" role="option" aria-selected="' + (i === 0) + '" data-i="' + i + '">' +
        '<span class="sr-num">' + esc(bn(r.roomNumber ?? '')) + '</span>' +
        '<span class="sr-body"><span class="sr-title">' + esc(r.building) + ' (' + esc(floorText(r.floor)) + ')</span>' +
        '<span class="sr-sub">' + esc(h.reason) + '</span></span>' +
        (cur ? '<span class="sr-tag">খোলা আছে</span>' : '') + '</div>';
    }).join('');
    sInput.setAttribute('aria-activedescendant', 'sr-0');
  }
  sList.hidden = false;
  sInput.setAttribute('aria-expanded', 'true');
}
function pickHit(i) {
  const h = sHits[i];
  if (!h) return;
  showOne(h.p.id);
  window.scrollTo({ top: 0 });
  sInput.value = ''; sClear.hidden = true;
  closeList();
  sInput.blur();
  toast('কক্ষ ' + bn(h.p.roomInfo?.roomNumber ?? '') + ' খোলা হয়েছে');
}
sInput.addEventListener('input', () => { sClear.hidden = !sInput.value; renderHits(sInput.value); });
sInput.addEventListener('focus', () => { if (sInput.value) renderHits(sInput.value); });
sInput.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (sList.hidden) { renderHits(sInput.value); return; }
    if (sHits.length) setActive((sActive + (e.key === 'ArrowDown' ? 1 : -1) + sHits.length) % sHits.length);
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (sHits.length) pickHit(sActive >= 0 ? sActive : 0);
    else if (sInput.value) renderHits(sInput.value);
  } else if (e.key === 'Escape') {
    if (sInput.value) { sInput.value = ''; sClear.hidden = true; closeList(); }
    else sInput.blur();
  }
});
sList.addEventListener('mousedown', e => e.preventDefault());
sList.addEventListener('click', e => {
  const el = e.target.closest('.sr-item');
  if (el) pickHit(Number(el.dataset.i));
});
sClear.addEventListener('click', () => { sInput.value = ''; sClear.hidden = true; closeList(); sInput.focus(); });

// "/" চাপলে খোঁজার ঘরে কার্সর যাবে
document.addEventListener('keydown', e => {
  if (e.key !== '/' || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target.matches && e.target.matches('select, input, textarea')) return;
  if (sInput.disabled) return;
  e.preventDefault();
  sInput.focus(); sInput.select();
});

    '<button type="button" class="btn ghost sm" data-act="resetCenter" style="margin-top:10px">ডিফল্ট তথ্যে ফেরান</button>';

  const pane = (name, html) => '<section class="pane" data-pane="' + name + '"' + (editTab === name ? '' : ' hidden') + '>' + html + '</section>';
  const sc = editBody.scrollTop;
  editBody.innerHTML = pane('room', room) + pane('schools', schools) + pane('seats', seats) + pane('center', center);
  editBody.scrollTop = sc;
  document.querySelectorAll('#editTabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === editTab ? 'true' : 'false'));
}

function switchTab(name) {
  editTab = name;
  editBody.querySelectorAll('.pane').forEach(el => { el.hidden = el.dataset.pane !== name; });
  document.querySelectorAll('#editTabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === name ? 'true' : 'false'));
  editBody.scrollTop = 0;
}

function syncTotal() {
  draft.total = String(draft.schools.reduce((a, s) => a + (toNum(s.studentCount) || 0), 0));
  const el = $('totalInp'); if (el) el.value = draft.total;
}
function updateColTotal(ci) {
  const sum = draft.cols[ci].reduce((a, rg) => a + (toNum(rg.count) || 0), 0);
  const el = editForm.querySelector('[data-coltotal="' + ci + '"]');
  if (el) el.textContent = bn(sum) + ' সিট';
}

function openEdit(tab) {
  const p = plans.find(x => x.id === roomSel.value);
  if (!p) return;
  editId = p.id; draft = makeDraft(p); editDirty = false; editTab = tab || 'room';
  $('editSub').textContent = 'কক্ষ ' + bn(p.roomInfo?.roomNumber ?? '') + (p.roomInfo?.building ? ' — ' + p.roomInfo.building : '');
  $('editErr').textContent = '';
  $('editLink').href = 'seat-plan.html';
  renderEdit();
  editDlg.showModal();
}
function requestClose() {
  if (editDirty && !confirm('সংরক্ষণ না করা পরিবর্তন বাদ যাবে। বন্ধ করবেন?')) return;
  editDlg.close();
}

editForm.addEventListener('input', e => {
  const path = e.target.dataset && e.target.dataset.path;
  if (!path) return;
  setPath(draft, path, e.target.value);
  editDirty = true;
  $('editErr').textContent = '';
  let m;
  if ((m = path.match(/^schools\.(\d+)\.(startRoll|endRoll)$/))) {
    const s = draft.schools[Number(m[1])];
    const a = toNum(s.startRoll), b = toNum(s.endRoll);
    if (!isNaN(a) && !isNaN(b) && b >= a) {
      s.studentCount = String(b - a + 1);
      const el = editForm.querySelector('[data-path="schools.' + m[1] + '.studentCount"]');
      if (el) el.value = s.studentCount;
      syncTotal();
    }
  } else if (/^schools\.\d+\.studentCount$/.test(path)) {
    syncTotal();
  } else if ((m = path.match(/^cols\.(\d+)\./))) {
    updateColTotal(Number(m[1]));
  }
});
editForm.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const a = t.dataset.act, i = Number(t.dataset.i), c = Number(t.dataset.c);
  let focusPath = '';
  if (a === 'addSchool') { draft.schools.push({ name: '', startRoll: '', endRoll: '', studentCount: '' }); focusPath = 'schools.' + (draft.schools.length - 1) + '.name'; }
  else if (a === 'delSchool') { draft.schools.splice(i, 1); }
  else if (a === 'addRange') { draft.cols[c].push({ startRoll: '', count: '' }); focusPath = 'cols.' + c + '.' + (draft.cols[c].length - 1) + '.startRoll'; }
  else if (a === 'delRange') { draft.cols[c].splice(i, 1); }
  else if (a === 'resetCenter') { draft.center = { ...CENTER_DEFAULT }; }
  else return;
  if (a === 'addSchool' || a === 'delSchool') syncTotal();
  editDirty = true;
  renderEdit();
  if (focusPath) { const el = editForm.querySelector('[data-path="' + focusPath + '"]'); if (el) el.focus(); }
});
$('editTabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]');
  if (b) switchTab(b.dataset.tab);
});
$('btnEdit').addEventListener('click', () => openEdit('room'));
$('editClose').addEventListener('click', requestClose);
$('editCancel').addEventListener('click', requestClose);
editDlg.addEventListener('cancel', e => {
  if (editDirty && !confirm('সংরক্ষণ না করা পরিবর্তন বাদ যাবে। বন্ধ করবেন?')) e.preventDefault();
});

async function saveEdit() {
  const err = m => { $('editErr').textContent = m; };
  const fail = (tab, m) => { switchTab(tab); err(m); };
  const orig = plans.find(p => p.id === editId);
  if (!orig) return err('কক্ষটি পাওয়া যায়নি। পেজ রিলোড করুন।');
  const d = draft;

  // কক্ষ
  const room = {};
  // ড্রপডাউনের মান হুবহু রাখা হয় (সিট প্লান পেজের মতো); বাকিগুলোর দুই পাশের ফাঁকা বাদ
  ROOM_FIELDS.forEach(([k]) => { room[k] = SELECT_FIELDS.includes(k) ? String(d.room[k] ?? '') : String(d.room[k] ?? '').trim(); });
  if (!room.roomNumber) return fail('room', 'কক্ষ নং লিখুন।');
  const bench = room.benchCount === '' ? 0 : toNum(room.benchCount);
  if (isNaN(bench)) return fail('room', 'বেঞ্চের সংখ্যা সংখ্যায় লিখুন।');

  // স্কুল ও রোল
  const schools = [];
  for (let i = 0; i < d.schools.length; i++) {
    const s = d.schools[i];
    const name = String(s.name ?? '').trim();
    const a = toNum(s.startRoll), b = toNum(s.endRoll), n = toNum(s.studentCount);
    const row = ' (স্কুল সারি ' + bn(i + 1) + ')';
    if (!name) return fail('schools', 'শ্রেণি / শাখা / গ্রুপ লিখুন' + row + '।');
    if (isNaN(a) || isNaN(b) || a > b) return fail('schools', 'শুরু ও শেষ রোল ঠিকভাবে লিখুন; শুরু শেষের চেয়ে বড় হবে না' + row + '।');
    if (isNaN(n)) return fail('schools', 'পরীক্ষার্থীর সংখ্যা সংখ্যায় লিখুন' + row + '।');
    schools.push({ _o: s._o, name, startRoll: a, endRoll: b, studentCount: n });
  }
  const total = toNum(d.total);
  if (isNaN(total)) return fail('schools', 'মোট পরীক্ষার্থীর সংখ্যা সংখ্যায় লিখুন।');

  // সিট
  const cols = [], seatRolls = [];
  for (let ci = 0; ci < COLUMNS.length; ci++) {
    const rs = [];
    for (let ri = 0; ri < d.cols[ci].length; ri++) {
      const rg = d.cols[ci][ri];
      const a = toNum(rg.startRoll), n = toNum(rg.count);
      const row = ' (কলাম ' + COLUMNS[ci] + ', সারি ' + bn(ri + 1) + ')';
      if (isNaN(a)) return fail('seats', 'শুরু রোল সংখ্যায় লিখুন; ফাঁকা সিটের জন্য ০ দিন' + row + '।');
      if (isNaN(n) || n < 1) return fail('seats', 'সিট সংখ্যা ১ বা তার বেশি হতে হবে' + row + '।');
      rs.push({ _o: rg._o, startRoll: a, count: n });
      if (a > 0) for (let k = 0; k < n; k++) seatRolls.push(a + k);
    }
    cols.push(rs);
  }
  const seen = new Set(), dups = new Set();
  seatRolls.forEach(r => { if (seen.has(r)) dups.add(r); else seen.add(r); });
  if (dups.size && !confirm('এই রোলগুলো একাধিক সিটে আছে: ' + [...dups].slice(0, 8).map(bn).join(', ') + (dups.size > 8 ? ' ...' : '') + '।\nতবুও সংরক্ষণ করবেন?')) return;

  // কী কী বদলেছে (বদলানো অংশ পুরোনো ডেটার উপর বসিয়ে সংরক্ষণ হবে; অন্য ফিল্ড অক্ষত থাকবে)
  const updates = {};
  ROOM_FIELDS.forEach(([k]) => {
    const o = orig.roomInfo?.[k];
    let v = k === 'benchCount' ? bench : room[k];
    if (k === 'roomNumber' && typeof o === 'number' && /^\d+$/.test(bnToEn(v))) v = Number(bnToEn(v));
    if (String(o ?? '') !== String(v)) updates['roomInfo.' + k] = v;
  });
  // নতুন যোগ করা স্কুলের id বসে (পুরোনোগুলোর id অপরিবর্তিত)
  const newSchools = schools.map((s, i) => ({ ...(s._o === undefined ? { id: i + 1 } : ((orig.schools || [])[s._o] || {})), name: s.name, startRoll: s.startRoll, endRoll: s.endRoll, studentCount: s.studentCount }));
  if (stable(newSchools) !== stable(orig.schools || [])) updates.schools = newSchools;
  if (total !== (orig.totals?.totalStudents ?? 0)) updates['totals.totalStudents'] = total;
  const totalSeats = cols.reduce((a, rs) => a + rs.reduce((b, rg) => b + rg.count, 0), 0);
  if (totalSeats !== (orig.totals?.totalSeats ?? 0)) updates['totals.totalSeats'] = totalSeats;
  const newCols = COLUMNS.map((_, ci) => {
    const oc = (orig.columnData || [])[ci] || {};
    return { ...oc, ranges: cols[ci].map(rg => { const o0 = (oc.ranges || [])[rg._o] || {}; const n0 = { ...o0, startRoll: rg.startRoll, count: rg.count }; if (o0.startRoll !== rg.startRoll || o0.count !== rg.count) { delete n0.rolls; delete n0.classKey; } return n0; }) };
  });
  if (stable(newCols) !== stable(orig.columnData || [])) updates.columnData = newCols;

  // কেন্দ্র
  const cNew = {};
  CENTER_FIELDS.forEach(([k]) => { cNew[k] = String(d.center[k] ?? '').trim(); });
  const centerChanged = CENTER_FIELDS.some(([k]) => cNew[k] !== CENTER[k]);
  const hasDb = Object.keys(updates).length > 0;

  if (!hasDb && !centerChanged) { editDirty = false; editDlg.close(); toast('কোনো পরিবর্তন নেই।'); return; }

  // কক্ষের আইডি (ভবন_তলা_কক্ষ) বদলে গেলে সিট প্লান পেজের সাথে গরমিল হতে পারে — আগে জানিয়ে নেওয়া
  if (['roomInfo.roomNumber', 'roomInfo.building', 'roomInfo.floor'].some(k => k in updates) &&
      !confirm('কক্ষ নং / ভবন / তলা বদলানো হচ্ছে।\nসিট প্লান পেজ থেকে এই কক্ষ আবার সাবমিট করলে আলাদা নতুন কক্ষ তৈরি হবে।\nতবুও সংরক্ষণ করবেন?')) return;

  const btn = $('editSave');
  btn.disabled = true; btn.textContent = 'সংরক্ষণ হচ্ছে…';
  try {
    if (hasDb) {
      // "roomInfo.roomNumber" ধরনের পথ ধরে পুরোনো ডেটায় বদল বসিয়ে পুরো ডেটা সংরক্ষণ
      const base = JSON.parse(JSON.stringify(orig)); delete base.id; delete base.updatedAt;
      Object.keys(updates).forEach(k => {
        const parts = k.split('.'); let o = base;
        parts.slice(0, -1).forEach(q => { if (typeof o[q] !== 'object' || o[q] === null) o[q] = {}; o = o[q]; });
        o[parts[parts.length - 1]] = updates[k];
      });
      base.roomId = editId;
      await api('seatPlanSave', TOKEN, editId, base);
      const idx = plans.findIndex(q => q.id === editId);
      if (idx >= 0) plans[idx] = { ...base, id: editId, updatedAt: Date.now() };
    }
    if (centerChanged) {
      Object.assign(CENTER, cNew);
      try { localStorage.setItem('centerInfo', JSON.stringify(cNew)); } catch (_) {}
    }
    editDirty = false;
    editDlg.close();
    rebuildAll(editId);
    toast('সংরক্ষণ হয়েছে।');
  } catch (e) {
    console.error(e);
    err('সংরক্ষণ করা যায়নি: ' + (e.message || 'অজানা ত্রুটি'));
  } finally {
    btn.disabled = false; btn.textContent = 'সংরক্ষণ';
  }
}
editForm.addEventListener('submit', e => { e.preventDefault(); saveEdit(); });

// নির্দিষ্ট ধরনের (২ বা ৩ কলাম) সব কক্ষ একসাথে প্রিন্ট
window.printType = function (type) {
  const pages = document.querySelectorAll('.page.' + type);
  if (pages.length === 0) {
    toast(type === 'two' ? 'কোনো ২ কলামের কক্ষ নেই।' : 'কোনো ৩ কলামের কক্ষ নেই।');
    return;
  }
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('hidden', !p.classList.contains(type)));
  window.print();
};
// সব কক্ষ একসাথে প্রিন্ট
window.printAll = function () {
  if (!document.querySelector('.page')) { toast('প্রিন্ট করার মতো কোনো কক্ষ নেই।'); return; }
  window.showAll();
  window.print();
};
window.addEventListener('afterprint', () => {
  if (roomSel.value) showOne(roomSel.value);
});
window.showAll = function () {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('hidden'));
};

function renderPlan(p) {
  const r = p.roomInfo || {};
  const schools = p.schools || [];
  const totalStu = p.totals?.totalStudents || 0;

  // প্রতিটি কলামের সিট তালিকা (রোল না থাকলে null = ফাঁকা সিট)
  const seatsByCol = COLUMNS.map((_, i) => {
    const seats = [];
    ((p.columnData || [])[i]?.ranges || []).forEach(rg => {
      if (Array.isArray(rg.rolls)) {   // Students থেকে বাছা রোল: ক্রমানুসারে পরবর্তী বিদ্যমান রোল বসে (যেমন VI-001); কম পড়লে বাকি সিট ফাঁকা
        for (let k = 0; k < rg.count; k++) { const rl = rg.rolls[k]; seats.push(rl ? (rg.prefix ? rg.prefix + '-' + String(rl).padStart(3, '0') : rl) : null); }
      } else { for (let k = 0; k < rg.count; k++) seats.push(rg.startRoll > 0 ? rg.startRoll + k : null); }
    });
    return seats;
  });
  // সারি = সবচেয়ে লম্বা কলামের সিট সংখ্যা (প্রতি সারি = এক জোড়া সিট)
  const rows = Math.max(...seatsByCol.map(s => s.length)) || (r.benchCount || 0);
  // প্রতি কলাম নিচ থেকে মেলানো: কম সিটের কলামের উপরে ফাঁকা সারি বসবে
  seatsByCol.forEach(col => { while (col.length < rows) col.unshift(null); });
  // মাঝের জোড়ায় (F, G) কোনো রোল না থাকলে ২ কলাম, থাকলে ৩ কলাম
  const two = !seatsByCol[2].some(Boolean) && !seatsByCol[3].some(Boolean);
  const use = two ? [0, 1, 4, 5] : [0, 1, 2, 3, 4, 5];

  // DOOR: শেষ জোড়ার (I, J) প্রথম সারি ফাঁকা হলে সেখানে দরজা দেখাবে
  const doorRow0 = !seatsByCol[4][0] && !seatsByCol[5][0];

  let body = '';
  for (let i = 0; i < rows; i++) {
    let tr = `<tr class="${i % 2 === 0 ? 'odd' : 'even'}">`;
    use.forEach((ci) => {
      if ((!two && ci === 2) || ci === 4) tr += '<td class="g"></td>';
      if (i === 0 && doorRow0 && ci === 4) {
        tr += '<td class="door" colspan="2">DOOR</td>';
        return;
      }
      if (i === 0 && doorRow0 && ci === 5) return;
      const roll = seatsByCol[ci][i];
      const cls = (ci % 2 === 0) ? 'l' : 'rt';
      tr += roll ? `<td class="${cls}">${roll}</td>` : `<td class="blank ${cls}"></td>`;
    });
    body += tr + '</tr>';
  }

  const schoolRows = schools.map((s, i) =>
    `<tr class="${i % 2 ? 'alt' : ''}"><td class="name">${esc(s.name)}ঃ</td><td class="roll">${s.startRoll}-${s.endRoll}</td><td class="cnt">মোট ${s.studentCount} জন</td></tr>`
  ).join('');


  return `
  <div class="page ${two ? 'two' : 'three'}" data-id="${esc(p.id)}">
    <h1 class="h1">${CENTER.exam}</h1>
    <div class="h2">${CENTER.name}</div>
    <div class="h2">${CENTER.school}</div>
    <div class="h2">${CENTER.place}</div>
    <div class="row-between"><span>কেন্দ্র কোডঃ ${CENTER.code}</span><span>মোবাইল নম্বরঃ ${CENTER.mobile}</span></div>
    <div class="venue">ভেন্যুঃ ${CENTER.venue}</div>

    <div class="plan-title">আসন পরিকল্পনা</div>
    <table class="info">
      <tr>
        <td class="side"><div class="kv"><span class="k">কক্ষ নং</span><span class="v">${esc(bn(r.roomNumber))} <em>(${esc(r.gender)})</em></span></div></td>
        <td class="mid" rowspan="2"><span class="dir">${esc(r.direction)}</span></td>
        <td class="side"><div class="kv"><span class="k">বিভাগ</span><span class="v">${esc(r.department)}</span></div></td>
      </tr>
      <tr>
        <td class="side"><div class="kv"><span class="k">বেঞ্চের সংখ্যা</span><span class="v">${bn(r.benchCount || 0)} খানা</span></div></td>
        <td class="side"><div class="kv"><span class="k">পরীক্ষার্থীর সংখ্যা</span><span class="v">${bn(totalStu)} জন</span></div></td>
      </tr>
    </table>
    <div class="building">${esc(r.building)} (${esc(floorText(r.floor))})</div>

    <table class="sch">
      <tr><th>শ্রেণি / শাখা / গ্রুপ</th><th>রোল নম্বর</th><th>সংখ্যা</th></tr>
      ${schoolRows}
    </table>
    <div class="total">মোট: ${totalStu} জন</div>

    <table class="seat ${two ? 'two' : ''}">${two ? '<colgroup><col style="width:22%"><col style="width:22%"><col style="width:12%"><col style="width:22%"><col style="width:22%"></colgroup>' : ''}${body}</table>
  </div>`;
}
</script>
