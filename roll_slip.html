<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>রোল নং স্লিপ</title>
<style>
  @font-face {
    font-family: 'SolaimanLipi';
    src: local('SolaimanLipi'), local('Solaiman Lipi'), url('SolaimanLipi.ttf') format('truetype');
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'SolaimanLipi', 'Kalpurush', 'Hind Siliguri', 'Noto Sans Bengali', sans-serif; background: #eef0f5; color: #1b2540; }

  /* ===== নিয়ন্ত্রণ প্যানেল (প্রিন্টে দেখা যায় না) ===== */
  .panel { max-width: 900px; margin: 16px auto; background: #fff; border-radius: 14px; padding: 16px 18px; box-shadow: 0 4px 18px rgba(0,0,0,.08); }
  .panel h1 { margin: 0 0 12px; font-size: 20px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: end; margin-bottom: 10px; }
  .row label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; }
  .row input[type=text], .row input[type=number] { padding: 7px 10px; border: 1.5px solid #c6cde0; border-radius: 8px; font: inherit; font-size: 14px; }
  .row input[type=text] { min-width: 260px; }
  .row input[type=number] { width: 110px; }
  .sel { padding: 7px 10px; border: 1.5px solid #c6cde0; border-radius: 8px; font: inherit; font-size: 14px; background: #fff; }
  .chk { flex-direction: row !important; align-items: center; gap: 6px !important; }
  .btn { padding: 9px 20px; border: 0; border-radius: 999px; font: inherit; font-weight: 700; cursor: pointer; background: #1D2B4F; color: #fff; }
  .btn.alt { background: #fff; color: #1D2B4F; border: 1.5px solid #1D2B4F; }
  .hint { font-size: 12px; color: #5a6480; margin: 0; }

  /* ===== A4 পাতা: ২ কলাম × ৪ সারি = ৮টি স্লিপ ===== */
  .sheet { width: 210mm; height: 297mm; margin: 0 auto 14px; background: #fff; padding: 0.4in;
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(4, 1fr); gap: 7mm 8mm; box-shadow: 0 4px 18px rgba(0,0,0,.1); }
  .slip { color: #000; border: 2.2px dashed #000; padding: 2mm 5mm 4mm; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; text-align: center; break-inside: avoid; }
  .slip .logo { height: 17mm; display: flex; align-items: center; justify-content: center; margin-bottom: 3mm; }
  .slip .logo img { max-height: 17mm; max-width: 40mm; object-fit: contain; }
  .slip .ttl { font-size: 21pt; font-weight: 700; line-height: 1.25; }
  .slip .roll { font-family: 'Times New Roman', Times, 'SolaimanLipi', 'Kalpurush', 'Noto Sans Bengali', serif; margin-top: 6mm; font-size: 18pt; font-weight: 700; align-self: flex-start; padding-left: 4mm; }
  .slip .roll b { font-size: 25pt; font-weight: 700; letter-spacing: .5px; }
  .slip .dots { letter-spacing: 1px; }
  .slip.hasmeta .roll { margin-top: 3mm; }
  .slip .foot { margin-top: auto; width: 100%; padding-top: 2mm; font-size: 14pt; font-weight: 700; text-align: center; white-space: nowrap; }
  .slip .roll .meta { font-size: 10pt; font-weight: 600; margin-top: 1mm; line-height: 1.3; }
  .slip .ttl .sch { display: block; font-size: 12pt; font-weight: 600; margin-bottom: 1mm; }

  @page { size: A4 portrait; margin: 0; }
  @media print {
    body { background: #fff; }
    .panel { display: none !important; }
    .sheet { margin: 0; box-shadow: none; break-after: page; page-break-after: always; }
    .sheet:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
</head>
<body>
<div class="panel">
  <div class="row">
  </div>
  <div class="row" id="srvRow">
    <select id="srvSrc" style="display:none"><option value="internal" selected>অভ্যন্তরীণ পরীক্ষা</option></select>
    <label class="intOnly">পরীক্ষার নাম
      <input type="text" id="intExam" value="বার্ষিক পরীক্ষা" style="width:170px">
    </label>
    <label>পরীক্ষার সাল
      <input type="number" id="year" min="2000" max="2099" value="2026" style="width:100px">
    </label>
    <label class="intOnly">বিদ্যালয়ের নাম
      <input type="text" id="intSchool" value="কাশিয়ানী গিরিশ চন্দ্র পাইলট উচ্চ বিদ্যালয়" style="width:300px">
    </label>
    <label>Session
      <input type="text" id="srvSess" value="2026" style="width:100px">
    </label>
    <label>শ্রেণি
      <select id="srvClass" class="sel"><option value="">— আগে রোল আনুন —</option></select>
    </label>
    <label>শাখা/গ্রুপ
      <select id="srvGrp" class="sel" style="min-width:200px"><option value="">—</option></select>
    </label>
    <label>কক্ষ
      <select id="srvRoom" class="sel" style="min-width:220px"><option value="">— আগে রোল আনুন —</option></select>
    </label>
    <button class="btn" id="srvPlan">🪑 সিট প্ল্যান থেকে রোল আনুন</button>
    <button class="btn alt" id="srvLoad">📥 Session থেকে রোল আনুন</button>
    <span class="hint" id="srvInfo"></span>
  </div>
  <div class="row">
    <button class="btn" id="go">হালনাগাদ</button>
    <button class="btn alt" id="print">🖨 প্রিন্ট</button>
  </div>
  <p class="hint">প্রিন্টের সময় ডায়ালগে "Margins: None" ও "Background graphics" চালু রাখুন। </p>
</div>
<div id="pages"></div>

  jsc: { lines: y => ['জুনিয়র বৃত্তি পরীক্ষা-' + y], logo: DEFAULT_LOGO },
  internal: { html: y => '<span class="sch">' + esc($('intSchool').value.trim()) + '</span>' + esc((e => /[0-9০-৯]/.test(e) ? e : e + '-' + y)($('intExam').value.trim() || 'অভ্যন্তরীণ পরীক্ষা')), logo: SCHOOL_LOGO }
};

function render() {
  const ex = EXAMS[$('srvSrc').value] || EXAMS.ssc, logo = ex.logo;
  const yr = bn(String($('year').value || '').trim() || '2026');
  const titleHtml = ex.html ? ex.html(yr) : ex.lines(yr).map(esc).join('<br>');
  const useSrv = srvRolls.length > 0, fill = useSrv, pad = 0, start = 0;
  let n = useSrv ? srvRolls.length : 8;                           // সার্ভারের রোল তালিকা থাকলে সেটিই ব্যবহার হবে
  if (!fill) n = Math.max(8, Math.ceil(n / 8) * 8);         // ফাঁকা রোল: পুরো পাতা ভরে
  const total = Math.ceil(n / 8) * 8;
  const slips = [];
  for (let i = 0; i < total; i++) {
    const it = useSrv ? srvRolls[i] : null, has = i < n && (!useSrv || it);
    let rollHtml;
    if (fill && has) rollHtml = 'রোল নং- <b>' + String(useSrv ? (it.txt || it.roll) : start + i) + '</b>' + (it && it.meta ? '<div class="meta">' + esc(it.meta) + '</div>' : '');
    else if (fill) rollHtml = '';                                 // শেষ পাতার বাকি ঘর ফাঁকা
    else rollHtml = 'রোল নং-<span class="dots">……………………</span>';
    const empty = fill && !has;
    slips.push(empty ? '<div></div>' :
      '<div class="slip' + (it && it.meta ? ' hasmeta' : '') + '"><div class="logo">' + (logo ? '<img src="' + logo + '" alt="">' : '') + '</div>' +
      '<div class="ttl">' + titleHtml + '</div><div class="roll">' + rollHtml + '</div>' +
      (it && it.room ? '<div class="foot">কক্ষ নং- ' + bn(esc(it.room)) + '</div>' : '') + '</div>');
  }
  let html = '';
  for (let p = 0; p < total; p += 8) html += '<div class="sheet">' + slips.slice(p, p + 8).join('') + '</div>';
  $('pages').innerHTML = html;
}
['year'].forEach(id => $(id).addEventListener('input', render));
$('go').onclick = render;
$('print').onclick = () => { render(); setTimeout(() => window.print(), 80); };
// ===== হাবের students টেবিল থেকে রোল আনা (listStudents) =====
const API_URL  = "https://xemvwhqqpbxsdkqcscrg.supabase.co/functions/v1/attendance";
const ANON_KEY = "sb_publishable_Ecayyqfsteeio6zjLzHAZw_F6I3h_F0";   // হাবের index.html-এর মতোই
const TOKEN = new URLSearchParams(location.search).get('token') || sessionStorage.getItem('app_token') || '';
let srvData = [];          // [{class_base, grp, section, roll}]
let srvRolls = [];         // এখন যে রোলগুলো স্লিপে যাবে
async function api(fn, ...args) {
  const h = { 'Content-Type': 'application/json' };
  if (ANON_KEY) { h.apikey = ANON_KEY; if (/^eyJ/.test(ANON_KEY)) h.Authorization = 'Bearer ' + ANON_KEY; }
  let j;
  try { j = await (await fetch(API_URL, { method: 'POST', headers: h, body: JSON.stringify({ fn, args }) })).json(); }
  catch (e) { throw new Error('সার্ভারে পৌঁছানো যায়নি।'); }
  if (!j.ok) throw new Error(j.error === 'SESSION_EXPIRED' ? 'সেশনের মেয়াদ শেষ। হাব থেকে আবার লগইন করে খুলুন।' : (j.error || 'অজানা সমস্যা।'));
  return j.data;
}
function srvSetInfo(t, bad) { const e = $('srvInfo'); e.textContent = t; e.style.color = bad ? '#B4432E' : '#3F7A63'; }
const grpKey = s => [s.grp, s.section].map(x => String(x || '').trim()).filter(Boolean).join(' - ');
const numCmp = (a, b) => String(a).localeCompare(String(b), undefined, { numeric: true });
function srvFillClass() {
  const cls = [...new Set(srvData.map(s => s.class_base))].sort(numCmp);
  const t = $('srvSrc').value, want = srvData.some(r => r.room) ? '' : t === 'jsc' ? '8' : t === 'ssc' ? '10' : (cls[0] || '');   // SSC → ১০ম, বৃত্তি → ৮ম, অভ্যন্তরীণ → প্রথম শ্রেণি (এক শ্রেণি বেছে নিন)
  $('srvClass').innerHTML = '<option value="">সব শ্রেণি</option>' + cls.map(c => '<option value="' + esc(c) + '">শ্রেণি ' + esc(bn(c)) + '</option>').join('');
  $('srvClass').value = cls.includes(want) ? want : '';
  srvFillGrp();
}
function srvFillGrp() {
  const c = $('srvClass').value, list = srvData.filter(s => !c || s.class_base === c), m = new Map();
  list.forEach(s => m.set(grpKey(s), (m.get(grpKey(s)) || 0) + 1));
  $('srvGrp').innerHTML = '<option value="">সব শাখা/গ্রুপ (' + bn(list.length) + ' জন)</option>' +
    [...m].sort((a, b) => numCmp(a[0], b[0])).map(([k, n]) => '<option value="' + esc(k) + '">' + esc(k || '(শাখা নেই)') + ' (' + bn(n) + ')</option>').join('');
  srvPick();
}
// ===== সিট প্ল্যান ১ (সংরক্ষিত কক্ষ) থেকে কক্ষের তথ্য: [প্রিফিক্স-]রোল → কক্ষ নং =====
const enN = s => String(s == null ? '' : s).replace(/[০-৯]/g, d => '০১২৩৪৫৬৭৮৯'.indexOf(d));
const ROMAN = { 1:'I',2:'II',3:'III',4:'IV',5:'V',6:'VI',7:'VII',8:'VIII',9:'IX',10:'X',11:'XI',12:'XII' };
const prefixOf = k => { const b = parseInt(String(k).trim(), 10); return ROMAN[b] || String(k == null ? '' : k).trim().split(' ')[0]; };   // সিট প্ল্যান ১-এর মতোই: ১০ → X
function rollLab(raw) {                  // "2" → "002", "2 (H)" → "002 (H)" (সিট প্ল্যান ১-এর রোল লেবেল)
  const t = enN(raw).trim(), m = t.match(/^(\d+)\s*(.*)$/);
  if (!m) return t;
  return String(parseInt(m[1], 10)).padStart(3, '0') + (m[2] ? ' ' + m[2].replace(/\s+/g, ' ').trim() : '');
}
const rollTxt = (cls, raw) => { const pf = prefixOf(cls); return (pf ? pf + '-' : '') + rollLab(raw); };   // "X-০০১" ধরনের লেখা (প্রিফিক্সসহ)
let spMap = new Map(), spState = '';      // spState: '' | 'loading' | 'done' | 'fail'
const spKey = (pf, lab) => (pf ? pf + '|' : '|') + lab;
function applySpRooms() {             // srvData-র প্রতিটি রোলে সিট প্ল্যান ১-এর কক্ষ বসানো (না পেলে আগের কক্ষ থাকে)
  srvData.forEach(r => {
    if (r.room0 === undefined) r.room0 = r.room || '';
    const lab = rollLab(r.roll);
    r.room = spMap.get(spKey(prefixOf(r.class_base), lab)) || spMap.get(spKey('', lab)) || r.room0;
  });
}
async function loadSpRooms() {
  if (spState === 'loading') return;
  spState = 'loading';
  try {
    const list = await api('seatPlanList', TOKEN);
    const rows = (Array.isArray(list) ? list : []).filter(r => r && r.id && String(r.id).indexOf('__') !== 0 && r.data && r.data.roomInfo);
    rows.sort((a, b) => (parseInt(enN((a.data.roomInfo || {}).roomNumber), 10) || 0) - (parseInt(enN((b.data.roomInfo || {}).roomNumber), 10) || 0));
    spMap = new Map();
    rows.forEach(r => {
      const no = String((r.data.roomInfo || {}).roomNumber || '').trim();
      if (!no) return;
      ((r.data && r.data.columnData) || []).forEach(c => (c.ranges || []).forEach(rg => {
        if (!Array.isArray(rg.rolls)) return;
        const pf = rg.prefix || (rg.classKey ? prefixOf(rg.classKey) : '');
        rg.rolls.forEach(x => { const k = spKey(pf, rollLab(x)); if (!spMap.has(k)) spMap.set(k, no); });
      }));
    });
    spState = 'done';
    if (srvData.length) { srvFillRoom(); srvFillClass(); }
  } catch (e) { spState = 'fail'; console.warn('সিট প্ল্যান ১ থেকে কক্ষ আনা যায়নি:', e.message); }
}
function srvFillRoom() {
  applySpRooms();
  if (!spState) loadSpRooms();
  const rooms = [...new Set(srvData.map(r => r.room).filter(Boolean))];
  $('srvRoom').innerHTML = rooms.length ? '<option value="">সব কক্ষ (প্রতি কক্ষ নতুন পাতায়)</option>' + rooms.map(r => '<option value="' + esc(r) + '">কক্ষ ' + esc(r) + '</option>').join('') : '<option value="">— কক্ষের তথ্য নেই —</option>';
}
function srvPick() {
  const c = $('srvClass').value, g = $('srvGrp').value, rm = $('srvRoom').value;
  const sel = srvData.filter(r => (!c || r.class_base === c) && (g === '' || grpKey(r) === g) && (!rm || r.room === rm));
  if (sel.some(r => r.room)) {          // কক্ষ অনুযায়ী: কক্ষ নং-এর ক্রমে (কক্ষহীন শেষে), প্রতি কক্ষ নতুন পাতায়
    const rn = r => r.room ? (parseInt(enN(r.room), 10) || 0) : Infinity;
    sel.sort((a, b) => (rn(a) === rn(b) ? 0 : rn(a) < rn(b) ? -1 : 1) || String(a.room).localeCompare(String(b.room), undefined, { numeric: true }) || ((a.seat && b.seat) ? 0 : numCmp(a.roll, b.roll)));
    const out = []; let cur = null;
    sel.forEach(r => {
      if (cur !== null && r.room !== cur) while (out.length % 8) out.push(null);
      cur = r.room;
      out.push({ roll: r.roll, meta: ['শ্রেণি ' + bn(r.class_base) + ([r.grp, r.section].filter(Boolean).length ? ' ' + [r.grp, r.section].filter(Boolean).join('-') : ''), r.seat ? 'আসন ' + bn(r.seat) : ''].filter(Boolean).join(' · '), room: r.room, txt: rollTxt(r.class_base, r.roll) });
    });
    srvRolls = out;
  } else {
    const seen = new Map();
    sel.forEach(r => { const n = Number(r.roll); if (!isNaN(n)) { const k = r.class_base + '|' + n; if (!seen.has(k)) seen.set(k, { roll: n, cls: r.class_base, txt: rollTxt(r.class_base, r.roll) }); } });
    srvRolls = [...seen.values()].sort((a, b) => numCmp(a.cls, b.cls) || a.roll - b.roll);
  }
  const real = srvRolls.filter(Boolean).length;
  if (real) srvSetInfo('✅ ' + bn(real) + ' জনের রোল এসেছে (' + bn(Math.ceil(srvRolls.length / 8)) + ' পাতা)।');
  else if (srvData.length) srvSetInfo('❌ এই বাছাইয়ে কোনো রোল নেই।', true);
  render();
}
async function srvLoad() {
  const btn = $('srvLoad'), sess = $('srvSess').value.trim();
  if (!sess) return srvSetInfo('❌ Session লিখুন।', true);
  btn.disabled = true; srvSetInfo('লোড হচ্ছে…');
  try {
    const list = await api('listStudents', TOKEN, { session: sess });
    srvData = (Array.isArray(list) ? list : []).map(r => ({ class_base: String(r.class_base ?? '').trim(), grp: String(r.grp ?? '').trim(), section: String(r.section ?? '').trim(), roll: String(r.roll ?? '').trim() })).filter(r => r.roll && r.class_base);
    if (!srvData.length) { srvRolls = []; $('srvClass').innerHTML = '<option value="">—</option>'; $('srvGrp').innerHTML = '<option value="">—</option>'; srvSetInfo('❌ ' + sess + ' session-এ কোনো শিক্ষার্থী পাওয়া যায়নি। হাবের "শিক্ষার্থী ইমপোর্ট" থেকে আগে শিক্ষার্থী যোগ করুন।', true); render(); return; }
    srvFillRoom(); srvFillClass();
  } catch (e) { srvSetInfo('❌ ' + e.message, true); }
  finally { btn.disabled = false; }
}
// সিট প্ল্যান (হাবের "অভ্যন্তরীণ পরীক্ষার সিট প্ল্যান") যে তালিকা ও বাছাই ব্রাউজারে রেখেছে, সেখান থেকে রোল আনা
function srvLoadPlan() {
  let sv = {}; try { sv = JSON.parse(localStorage.getItem('seatplan_v1') || '') || {}; } catch (e) {}
  const gk = r => ['শ্রেণি ' + r.class_base, r.grp, r.section && 'শাখা ' + r.section].filter(Boolean).join(' ');
  const keys = Array.isArray(sv.keys) ? sv.keys : [], plan = Array.isArray(sv.plan) ? sv.plan : [];
  const list = plan.length
    ? plan.flatMap(p => (p.students || []).map(r => ({ ...r, room: p.room })))          // তৈরি সিট প্ল্যান: কক্ষ ও আসন সহ
    : (Array.isArray(sv.students) ? sv.students : []).filter(r => !keys.length || keys.includes(gk(r)));   // সিট প্ল্যান তৈরি হয়নি: শুধু তালিকা
  const ok = list.filter(r => r.roll && r.class_base);
  if (!ok.length) { srvSetInfo('❌ সিট প্ল্যানে কোনো শিক্ষার্থী পাওয়া যায়নি। হাবের "অভ্যন্তরীণ পরীক্ষার সিট প্ল্যান" খুলে শিক্ষার্থী লোড করে সিট প্ল্যান তৈরি করুন (একই ব্রাউজারে)।', true); return false; }
  srvData = ok.map(r => ({ class_base: String(r.class_base).trim(), grp: String(r.grp || '').trim(), section: String(r.section || '').trim(), roll: String(r.roll).trim(), room: r.room ? String(r.room) : '', seat: r.seat || '' }));
  if (sv.school && /[^\x00-\x7F]/.test(sv.school)) $('intSchool').value = sv.school;   // সিট প্ল্যানে বাংলা নাম থাকলেই নেয়
  if (sv.title) $('intExam').value = sv.title;
  $('srvSrc').value = 'internal'; srvToggle(); srvFillRoom(); srvFillClass();
  if (!plan.length) srvSetInfo('ℹ️ সিট প্ল্যান এখনো তৈরি হয়নি, তাই কক্ষ অনুযায়ী নয়। হাবে সিট প্ল্যান তৈরি করে আবার আনুন।');
  return true;
}
$('srvPlan').onclick = srvLoadPlan;
$('srvLoad').onclick = srvLoad;
$('srvClass').addEventListener('change', srvFillGrp);
$('srvGrp').addEventListener('change', srvPick);
$('srvRoom').addEventListener('change', srvPick);
function srvToggle() { document.querySelectorAll('.intOnly').forEach(e => e.style.display = $('srvSrc').value === 'internal' ? '' : 'none'); }
$('srvSrc').addEventListener('change', () => { srvToggle(); if (srvData.length) srvFillClass(); else render(); });
['intExam', 'intSchool'].forEach(id => $(id).addEventListener('input', render));
srvToggle();
$('srvSess').addEventListener('keydown', e => { if (e.key === 'Enter') srvLoad(); });
// হাত দিয়ে শুরু/শেষ/মোট বদলালে সার্ভারের তালিকা বাদ, আগের মতো ক্রমিক রোল

render();
if (!srvLoadPlan()) srvLoad();   // পেজ খুললেই আগে সিট প্ল্যান থেকে, না পেলে Session থেকে
</script>
